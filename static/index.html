<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
name="theme-color"
content="#fff8ed"
>

<title>Teacher Pack</title>


<style>

:root{

  --bg:#fff8ed;
  --card:#ffffff;
  --ink:#27324a;
  --muted:#6f7890;

  --primary:#6c63ff;
  --primary2:#5148e8;

  --mint:#dff8ee;
  --blue:#e3f0ff;

  --line:#e8e4dc;

  --shadow:
  0 12px 30px rgba(49,55,85,.09);
}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
  linear-gradient(
    180deg,
    #fff8ed 0%,
    #f7f5ff 100%
  );

  color:var(--ink);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans Thai",
  sans-serif;
}


button,
input,
select,
textarea{
  font:inherit;
}


.container{

  width:min(
    900px,
    92%
  );

  margin:auto;
}


.header{

  padding:
  22px 0 10px;

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  gap:12px;
}


.brand{

  display:flex;

  align-items:center;

  gap:10px;

  font-size:20px;

  font-weight:800;
}


.logo{

  width:44px;
  height:44px;

  border-radius:14px;

  background:#fff;

  display:grid;

  place-items:center;

  box-shadow:var(--shadow);

  font-size:23px;
}


.badge{

  background:var(--mint);

  padding:
  7px 11px;

  border-radius:999px;

  font-size:12px;

  font-weight:800;
}


.hero{

  text-align:center;

  padding:
  28px 0 20px;
}


.hero h1{

  margin:0 0 10px;

  font-size:
  clamp(30px,7vw,48px);

  letter-spacing:-1px;
}


.hero p{

  margin:0;

  color:var(--muted);

  font-size:16px;
}


.card{

  background:var(--card);

  border:
  1px solid var(--line);

  border-radius:24px;

  padding:22px;

  box-shadow:var(--shadow);

  margin:16px 0;
}


.label{

  display:block;

  font-weight:800;

  margin-bottom:9px;
}


.prompt{

  width:100%;

  min-height:110px;

  resize:vertical;

  padding:16px;

  border:
  2px solid #e8e4f8;

  border-radius:18px;

  background:#fcfbff;

  outline:none;
}


.prompt:focus{

  border-color:
  var(--primary);
}


.examples{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:10px;
}


.example{

  border:0;

  background:#f2f0ff;

  color:#5148e8;

  border-radius:999px;

  padding:8px 12px;

  cursor:pointer;
}


.teacher-input{

  width:100%;

  border:
  2px solid #e8e4f8;

  border-radius:16px;

  padding:14px;

  outline:none;

  background:#fcfbff;

  margin-bottom:14px;
}


.teacher-input:focus{

  border-color:
  var(--primary);
}


.grid{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:14px;
}


.field{

  background:#faf9f5;

  border:
  1px solid var(--line);

  padding:15px;

  border-radius:18px;
}


select{

  width:100%;

  border:0;

  background:transparent;

  outline:none;

  color:var(--ink);

  font-weight:700;
}


.types{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:10px;
}


.check{

  position:relative;
}


.check input{

  position:absolute;

  opacity:0;
}


.check label{

  display:block;

  padding:14px;

  border:
  2px solid var(--line);

  border-radius:16px;

  background:#fff;

  cursor:pointer;

  font-weight:700;
}


.check input:checked+label{

  border-color:
  var(--primary);

  background:#f0efff;

  color:#5148e8;
}


.primary{

  width:100%;

  border:0;

  border-radius:18px;

  padding:17px;

  background:
  linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );

  color:#fff;

  font-weight:800;

  font-size:18px;

  cursor:pointer;

  box-shadow:
  0 9px 18px
  rgba(108,99,255,.25);
}


.primary:disabled{

  opacity:.6;

  cursor:wait;
}


.note{

  text-align:center;

  color:var(--muted);

  font-size:13px;

  margin-top:12px;
}


.hidden{

  display:none!important;
}


.loading{

  text-align:center;

  padding:35px;
}


.spinner{

  font-size:38px;

  animation:
  bounce 1s infinite alternate;
}


@keyframes bounce{

  to{
    transform:translateY(-8px);
  }

}


.result-head{

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  gap:12px;

  flex-wrap:wrap;
}


.result-head h2{

  margin:0;
}


.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:8px;
}


.chip{

  padding:
  7px 10px;

  border-radius:999px;

  background:var(--blue);

  font-size:12px;

  font-weight:800;
}


.tabs{

  display:flex;

  gap:8px;

  overflow:auto;

  padding-bottom:4px;

  margin-top:18px;
}


.tab{

  white-space:nowrap;

  border:0;

  background:#f2f1ee;

  color:var(--muted);

  border-radius:12px;

  padding:10px 13px;

  font-weight:800;

  cursor:pointer;
}


.tab.active{

  background:#5148e8;

  color:#fff;
}


.panel{

  line-height:1.8;

  margin-top:20px;
}


.panel h3{

  margin-top:24px;
}


.item{

  padding:15px;

  border:
  1px solid var(--line);

  border-radius:16px;

  margin:10px 0;

  background:#fff;
}


.qtype{

  display:inline-block;

  font-size:11px;

  background:#f1f0ff;

  color:#5148e8;

  padding:5px 8px;

  border-radius:999px;

  font-weight:800;
}


.options{

  margin-top:10px;

  padding-left:25px;
}


.answer{

  color:#6f7890;

  margin-top:7px;
}


.actions{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:10px;

  margin-top:20px;
}


.secondary{

  border:
  2px solid #e7e3f6;

  background:#fff;

  color:#5148e8;

  border-radius:16px;

  padding:13px;

  font-weight:800;

  cursor:pointer;
}


.error{

  background:#ffe7e7;

  color:#9d2929;

  padding:14px;

  border-radius:16px;
}


.saved{

  background:#e9f8f0;

  color:#23724d;

  padding:12px 14px;

  border-radius:14px;

  margin-top:10px;

  font-size:13px;

  font-weight:700;
}


@media(max-width:650px){

  .grid{

    grid-template-columns:1fr;
  }


  .types{

    grid-template-columns:1fr;
  }


  .actions{

    grid-template-columns:1fr;
  }


  .card{

    padding:17px;
  }


  .header{

    padding-top:16px;
  }

}


@media print{

  body{

    background:#fff;
  }


  .header,
  .hero,
  #builder,
  .actions,
  .tabs{

    display:none!important;
  }


  .card{

    box-shadow:none;

    border:0;

    padding:0;
  }


  .panel{

    display:block!important;
  }

}

</style>

</head>


<body>


<div class="container">


<header class="header">

  <div class="brand">

    <div class="logo">
      📚
    </div>

    Teacher Pack

  </div>


  <div class="badge">
    V1.5
  </div>

</header>


<section class="hero">

  <h1>
    สอนอะไรวันนี้? ✨
  </h1>

  <p>
    พิมพ์คำสั่ง แล้วสร้างเอกสารการสอนพร้อมใช้
  </p>

</section>


<!-- =====================================================
     BUILDER
===================================================== -->

<section
id="builder"
class="card"
>


  <label class="label">
    👨‍🏫 ชื่อครู
  </label>


  <input
  id="teacherName"
  class="teacher-input"
  type="text"
  placeholder="เช่น นายสมชาย ใจดี"
  maxlength="100"
  >


  <label class="label">
    👋 วันนี้คุณอยากสอนอะไร?
  </label>


  <textarea
  id="prompt"
  class="prompt"
  placeholder="เช่น ระบบสุริยะ ป.5 1 ชั่วโมง"
  ></textarea>


  <div class="examples">

    <button
    class="example"
    onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
    >
      🧮 เศษส่วน ป.4
    </button>


    <button
    class="example"
    onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
    >
      🌎 ระบบสุริยะ ป.5
    </button>


    <button
    class="example"
    onclick="fillExample('Animals ป.3 30 นาที')"
    >
      🇬🇧 Animals ป.3
    </button>

  </div>

</section>


<section class="card">


  <div class="grid">


    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>

      <select id="count">

        <option value="5">
          5 ข้อ
        </option>

        <option value="10" selected>
          10 ข้อ
        </option>

        <option value="15">
          15 ข้อ
        </option>

        <option value="20">
          20 ข้อ
        </option>

        <option value="30">
          30 ข้อ
        </option>

      </select>

    </div>


    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option value="mixed" selected>
          ผสม
        </option>

      </select>

    </div>


  </div>


  <div style="margin-top:18px">


    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
      style="
      color:#6f7890;
      font-weight:500
      "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">


      <div class="check">

        <input
        type="checkbox"
        id="multiple_choice"
        checked
        >

        <label for="multiple_choice">
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="fill_blank"
        >

        <label for="fill_blank">
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="calculation"
        >

        <label for="calculation">
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="application"
        >

        <label for="application">
          💡 ประยุกต์ใช้
        </label>

      </div>


    </div>

  </div>


  <div style="margin-top:18px">


    <button
    id="generateBtn"
    class="primary"
    onclick="generate()"
    >
      ✨ สร้างชุดการสอน
    </button>


    <div class="note">

      แผนการสอน + ใบงาน + แบบทดสอบ + เฉลย

    </div>


  </div>


</section>


<!-- =====================================================
     LOADING
===================================================== -->

<section
id="loading"
class="card loading hidden"
>

  <div class="spinner">
    ✨
  </div>

  <h3>
    กำลังเตรียมชุดการสอน...
  </h3>

  <p style="color:#6f7890">
    AI กำลังจัดเนื้อหาและตรวจคำตอบ
  </p>

</section>


<!-- =====================================================
     ERROR
===================================================== -->

<section
id="error"
class="card hidden"
>

  <div
  class="error"
  id="errorText"
  ></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section
id="result"
class="card hidden"
>


  <div class="result-head">

    <div>

      <h2>
        🎉 ชุดการสอนพร้อมแล้ว
      </h2>

      <div
      id="summary"
      class="chips"
      ></div>

    </div>

  </div>


  <div
  id="savedMessage"
  class="saved hidden"
  >
    💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
  </div>


  <div class="tabs">

    <button
    class="tab active"
    data-tab="lesson"
    >
      📚 แผนการสอน
    </button>


    <button
    class="tab"
    data-tab="worksheet"
    >
      📝 ใบงาน
    </button>


    <button
    class="tab"
    data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>


    <button
    class="tab"
    data-tab="answer"
    >
      ✅ เฉลย
    </button>

  </div>


  <div
  id="lesson"
  class="panel"
  ></div>


  <div
  id="worksheet"
  class="panel hidden"
  ></div>


  <div
  id="quiz"
  class="panel hidden"
  ></div>


  <div
  id="answer"
  class="panel hidden"
  ></div>


  <div class="actions">


    <button
    class="secondary"
    onclick="downloadPDF()"
    >
      📄 ดาวน์โหลด PDF
    </button>


    <button
    class="secondary"
    onclick="window.print()"
    >
      🖨️ พิมพ์
    </button>


    <button
    class="secondary"
    onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>


    <button
    class="secondary"
    onclick="clearSaved()"
    >
      🗑️ ล้างชุดที่บันทึก
    </button>


  </div>


</section>


</div>


<script>


// ========================================================
// GLOBAL
// ========================================================

let currentData = null;


const STORAGE_KEY =
  "teacher_pack_current_v15";


const typeNames = {

  multiple_choice:"ปรนัย",

  fill_blank:"เติมคำ",

  calculation:"คำนวณ",

  application:"ประยุกต์ใช้"

};


// ========================================================
// ESCAPE
// ========================================================

function esc(s){

  return String(
    s ?? ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[m];

    }
  );

}


// ========================================================
// EXAMPLE
// ========================================================

function fillExample(value){

  document.getElementById(
    "prompt"
  ).value = value;

}


// ========================================================
// TABS
// ========================================================

document
.querySelectorAll(".tab")
.forEach(function(btn){

  btn.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".tab")
      .forEach(function(b){

        b.classList.remove(
          "active"
        );

      });


      document
      .querySelectorAll(".panel")
      .forEach(function(p){

        p.classList.add(
          "hidden"
        );

      });


      btn.classList.add(
        "active"
      );


      document
      .getElementById(
        btn.dataset.tab
      )
      .classList.remove(
        "hidden"
      );

    }
  );

});


// ========================================================
// SAVE
// ========================================================

function saveData(data){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(e){

    console.log(
      "localStorage error",
      e
    );

  }

}


// ========================================================
// LOAD
// ========================================================

function loadData(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){

      return null;

    }


    return JSON.parse(raw);

  }catch(e){

    console.log(
      "load error",
      e
    );

    return null;

  }

}


// ========================================================
// GENERATE
// ========================================================

async function generate(){

  const prompt =
    document
    .getElementById("prompt")
    .value
    .trim();


  const teacherName =
    document
    .getElementById("teacherName")
    .value
    .trim();


  const selected =
    [
      ...document
      .querySelectorAll(
        ".check input:checked"
      )
    ]
    .map(
      x => x.id
    );


  if(!teacherName){

    showError(
      "กรุณากรอกชื่อครูก่อนสร้างเอกสารครับ"
    );

    return;

  }


  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    return;

  }


  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  setLoading(true);


  try{


    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify({

            prompt,

            teacher_name:
            teacherName,

            question_count:
            Number(
              document
              .getElementById(
                "count"
              )
              .value
            ),

            question_types:
            selected,

            difficulty:
            document
            .getElementById(
              "difficulty"
            )
            .value

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        "เกิดข้อผิดพลาด"
      );

    }


    currentData = data;


    saveData(
      data
    );


    render(
      data
    );


  }catch(error){

    showError(
      error.message
    );

  }finally{

    setLoading(false);

  }

}


// ========================================================
// LOADING
// ========================================================

function setLoading(value){

  document
  .getElementById("loading")
  .classList
  .toggle(
    "hidden",
    !value
  );


  document
  .getElementById("generateBtn")
  .disabled = value;

}


// ========================================================
// ERROR
// ========================================================

function showError(message){

  document
  .getElementById("error")
  .classList
  .remove("hidden");


  document
  .getElementById("errorText")
  .textContent =
    message;

}


// ========================================================
// RENDER
// ========================================================

function render(data){

  document
  .getElementById("error")
  .classList
  .add("hidden");


  document
  .getElementById("result")
  .classList
  .remove("hidden");


  const s =
    data.summary;


  document
  .getElementById("summary")
  .innerHTML = `

    <span class="chip">
      👨‍🏫 ${esc(s.teacher_name)}
    </span>

    <span class="chip">
      🎒 ${esc(s.grade)}
    </span>

    <span class="chip">
      📖 ${esc(s.subject)}
    </span>

    <span class="chip">
      ✏️ ${esc(s.topic)}
    </span>

    <span class="chip">
      ⏱️ ${esc(s.duration)}
    </span>

  `;


  // ======================================================
  // LESSON
  // ======================================================

  document
  .getElementById("lesson")
  .innerHTML = `

    <h3>
      จุดประสงค์การเรียนรู้
    </h3>

    <ul>

      ${data.lesson_plan.objective
        .map(
          x =>
          `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ul>


    <h3>
      เนื้อหาที่ใช้สอน
    </h3>

    <div class="item">

      ${esc(
        data.teaching_content.intro
      )}

    </div>


    <h3>
      สาระสำคัญ
    </h3>

    ${data.teaching_content.concepts
      .map(
        x =>
        `<div class="item">${esc(x)}</div>`
      )
      .join("")
    }


    <h3>
      ตัวอย่างสำหรับใช้สอน
    </h3>

    ${data.teaching_content.examples
      .map(
        x => `

          <div class="item">

            <b>
              ${esc(x.title)}
            </b>

            <div style="margin-top:8px">

              ${esc(x.explanation)}

            </div>

          </div>

        `
      )
      .join("")
    }


    <h3>
      คำถามชวนคิด
    </h3>

    <ul>

      ${data.teaching_content.thinking_questions
        .map(
          x =>
          `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ul>


    <h3>
      ขั้นตอนการจัดการเรียนรู้
    </h3>

    ${data.lesson_plan.steps
      .map(
        (x,i) => `

          <div class="item">

            <b>
              ${i+1}.
              ${esc(x.title)}
            </b>

            <div>
              เวลา:
              ${esc(x.time)}
            </div>

// ========================================================
// DOWNLOAD PDF
// ========================================================

async function downloadPDF(){

  if(!currentData){

    showError(
      "ยังไม่มีชุดการสอน"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/pdf?section=all",
        {

          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:
          JSON.stringify(
            currentData
          )

        }
      );


    if(!response.ok){

      const error =
        await response.json();

      throw new Error(
        error.detail ||
        "สร้าง PDF ไม่สำเร็จ"
      );

    }


    const blob =
      await response.blob();


    const url =
      window.URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );


    a.href = url;


    a.download =
      "teacher-pack.pdf";


    document
    .body
    .appendChild(a);


    a.click();


    a.remove();


    window.URL.revokeObjectURL(
      url
    );


  }catch(error){

    showError(
      error.message
    );

  }

}


// ========================================================
// NEW PACK
// ========================================================

function newPack(){

  document
  .getElementById("result")
  .classList
  .add("hidden");


  document
  .getElementById("prompt")
  .value = "";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


// ========================================================
// CLEAR SAVED
// ========================================================

function clearSaved(){

  localStorage.removeItem(
    STORAGE_KEY
  );


  currentData = null;


  document
  .getElementById("result")
  .classList
  .add("hidden");


  alert(
    "ลบชุดการสอนที่บันทึกไว้แล้ว"
  );

}


// ========================================================
// RESTORE ON LOAD
// ========================================================

window.addEventListener(
  "load",
  function(){

    const saved =
      loadData();


    if(saved){

      currentData =
        saved;


      render(
        saved
      );


      const teacher =
        saved
        .summary
        ?.teacher_name ||
        "";


      document
      .getElementById(
        "teacherName"
      )
      .value =
        teacher;

    }

  }
);

</script>
