<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
name="theme-color"
content="#fff8ed"
>

<title>AI ครูผู้ช่วย</title>


<style>

:root{

  --bg:#fff8ed;
  --card:#ffffff;
  --ink:#27324a;
  --muted:#6f7890;

  --primary:#6c63ff;
  --primary2:#5148e8;

  --mint:#dff8ee;
  --blue:#e3f0ff;

  --line:#e9e5dc;

  --shadow:
    0 12px 30px rgba(49,55,85,.09);
}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #fff8ed 0,
      #f7f5ff 100%
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    sans-serif;

  color:var(--ink);
}


button,
input,
select,
textarea{

  font:inherit;
}


.container{

  width:min(
    900px,
    92%
  );

  margin:auto;
}


.header{

  padding:
    24px
    0
    12px;

  display:flex;

  justify-content:
    space-between;

  align-items:center;
}


.brand{

  display:flex;

  gap:12px;

  align-items:center;

  font-weight:800;

  font-size:20px;
}


.logo{

  width:46px;

  height:46px;

  border-radius:15px;

  background:#fff;

  box-shadow:var(--shadow);

  display:grid;

  place-items:center;

  font-size:25px;
}


.badge{

  font-size:12px;

  background:var(--mint);

  padding:
    7px
    11px;

  border-radius:999px;

  font-weight:700;
}


.hero{

  text-align:center;

  padding:
    30px
    0
    20px;
}


.hero h1{

  font-size:
    clamp(
      30px,
      7vw,
      48px
    );

  margin:
    0
    0
    10px;

  letter-spacing:-1px;
}


.hero p{

  color:var(--muted);

  font-size:16px;

  margin:0;
}


.card{

  background:var(--card);

  border:
    1px solid
    var(--line);

  border-radius:24px;

  padding:22px;

  box-shadow:var(--shadow);

  margin:16px 0;
}


.label{

  font-weight:800;

  margin-bottom:9px;

  display:block;
}


.teacher{

  width:100%;

  border:
    2px solid
    #e8e4f8;

  border-radius:18px;

  padding:14px 16px;

  outline:none;

  background:#fcfbff;

  margin-bottom:14px;
}


.teacher:focus{

  border-color:
    var(--primary);
}


.prompt{

  width:100%;

  min-height:112px;

  border:
    2px solid
    #e8e4f8;

  border-radius:18px;

  padding:16px;

  resize:vertical;

  outline:none;

  background:#fcfbff;
}


.prompt:focus{

  border-color:
    var(--primary);
}


.examples{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:10px;
}


.example{

  border:0;

  background:#f4f2ff;

  color:#5148e8;

  border-radius:999px;

  padding:
    8px
    12px;

  cursor:pointer;
}


.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:14px;
}


.field{

  background:#faf9f5;

  border:
    1px solid
    var(--line);

  padding:15px;

  border-radius:18px;
}


select{

  width:100%;

  border:0;

  background:transparent;

  color:var(--ink);

  outline:none;

  font-weight:700;
}


.types{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}


.check{

  position:relative;
}


.check input{

  position:absolute;

  opacity:0;
}


.check label{

  display:block;

  padding:14px;

  border:
    2px solid
    var(--line);

  border-radius:16px;

  background:#fff;

  cursor:pointer;

  font-weight:700;
}


.check input:checked+label{

  border-color:
    var(--primary);

  background:#f0efff;

  color:#5148e8;
}


button.primary{

  width:100%;

  border:0;

  border-radius:18px;

  padding:17px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-weight:800;

  font-size:18px;

  cursor:pointer;

  box-shadow:
    0 9px 18px
    rgba(108,99,255,.25);
}


button.primary:disabled{

  opacity:.6;

  cursor:wait;
}


.note{

  text-align:center;

  color:var(--muted);

  font-size:13px;

  margin-top:12px;
}


.hidden{

  display:none;
}


.loading{

  text-align:center;

  padding:35px;
}


.spinner{

  font-size:38px;

  animation:
    bounce 1s
    infinite alternate;
}


@keyframes bounce{

  to{

    transform:
      translateY(-8px);

  }

}


.result-head{

  display:flex;

  justify-content:
    space-between;

  gap:12px;

  align-items:center;

  flex-wrap:wrap;
}


.result-head h2{

  margin:0;
}


.chips{

  display:flex;

  gap:7px;

  flex-wrap:wrap;
}


.chip{

  padding:
    7px
    10px;

  border-radius:999px;

  background:var(--blue);

  font-size:12px;

  font-weight:800;
}


.tabs{

  display:flex;

  gap:8px;

  overflow:auto;

  padding-bottom:4px;
}


.tab{

  white-space:nowrap;

  border:0;

  background:#f2f1ee;

  border-radius:12px;

  padding:
    10px
    13px;

  font-weight:800;

  color:var(--muted);

  cursor:pointer;
}


.tab.active{

  background:#5148e8;

  color:#fff;
}


.panel{

  line-height:1.75;
}


.panel h3{

  margin-top:0;
}


.item{

  padding:14px;

  border:
    1px solid
    var(--line);

  border-radius:16px;

  margin:10px 0;

  background:#fff;
}


.qtype{

  font-size:11px;

  background:#f1f0ff;

  color:#5148e8;

  padding:
    5px
    8px;

  border-radius:999px;

  font-weight:800;
}


.actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}


.secondary{

  border:
    2px solid
    #e7e3f6;

  background:#fff;

  color:#5148e8;

  border-radius:16px;

  padding:13px;

  font-weight:800;

  cursor:pointer;
}


.pdf-buttons{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:10px;
}


.pdf-btn{

  border:
    2px solid
    #e7e3f6;

  background:#fff;

  color:#5148e8;

  border-radius:15px;

  padding:12px;

  font-weight:800;

  cursor:pointer;
}


.pdf-btn:hover{

  background:#f6f4ff;
}


.error{

  background:#ffe7e7;

  color:#9d2929;

  padding:14px;

  border-radius:16px;
}


@media(max-width:650px){

  .grid{

    grid-template-columns:1fr;

  }


  .types{

    grid-template-columns:1fr;

  }


  .pdf-buttons{

    grid-template-columns:1fr;

  }


  .card{

    padding:17px;

  }


  .header{

    padding-top:16px;

  }

}


@media print{

  .header,
  .hero,
  #builder,
  .actions,
  .tabs{

    display:none;

  }


  .card{

    box-shadow:none;

    border:0;

  }


  .panel{

    display:block!important;

  }

}

</style>

</head>


<body>


<div class="container">


<header class="header">

  <div class="brand">

    <div class="logo">
      📚
    </div>

    AI ครูผู้ช่วย

  </div>


  <div class="badge">
    V1.3
  </div>

</header>


<section class="hero">

  <h1>
    สอนอะไรวันนี้? ✨
  </h1>

  <p>
    พิมพ์แค่ประโยคเดียว
    แล้วให้ AI ช่วยเตรียมชุดการสอน
  </p>

</section>


<!-- =====================================================
     BUILDER
===================================================== -->

<section
id="builder"
class="card"
>


  <label class="label">

    👨‍🏫 ชื่อครูผู้สอน

  </label>


  <input
    id="teacherName"
    class="teacher"
    type="text"
    maxlength="100"
    placeholder="เช่น ครูสมชาย ใจดี"
  >


  <label class="label">

    👋 วันนี้คุณอยากสอนอะไร?

  </label>


  <textarea
    id="prompt"
    class="prompt"
    placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
  ></textarea>


  <div class="examples">

    <button
      class="example"
      onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
    >
      🧮 เศษส่วน ป.4
    </button>


    <button
      class="example"
      onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
    >
      🌎 ระบบสุริยะ ป.5
    </button>


    <button
      class="example"
      onclick="fillExample('Animals ป.3 30 นาที')"
    >
      🇬🇧 Animals ป.3
    </button>

  </div>

</section>


<!-- =====================================================
     OPTIONS
===================================================== -->

<section class="card">


  <div class="grid">


    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>


      <select id="count">

        <option value="5">
          5 ข้อ
        </option>

        <option
        value="10"
        selected
        >
          10 ข้อ
        </option>

        <option value="15">
          15 ข้อ
        </option>

        <option value="20">
          20 ข้อ
        </option>

        <option value="30">
          30 ข้อ
        </option>

      </select>

    </div>


    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>


      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option
        value="mixed"
        selected
        >
          ผสม
        </option>

      </select>

    </div>

  </div>


  <div style="margin-top:18px">


    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
      style="
      color:#6f7890;
      font-weight:500
      "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">


      <div class="check">

        <input
        type="checkbox"
        id="multiple_choice"
        checked
        >

        <label for="multiple_choice">
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="fill_blank"
        >

        <label for="fill_blank">
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="calculation"
        >

        <label for="calculation">
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
        type="checkbox"
        id="application"
        >

        <label for="application">
          💡 ประยุกต์ใช้
        </label>

      </div>


    </div>

  </div>


  <div style="margin-top:18px">


    <button
    id="generateBtn"
    class="primary"
    onclick="generate()"
    >

      ✨ สร้างชุดการสอน

    </button>


    <div class="note">

      แผนการสอน + เนื้อหาสอน +
      ใบงาน + เฉลย + แบบทดสอบ

    </div>

  </div>

</section>


<!-- =====================================================
     LOADING
===================================================== -->

<section
id="loading"
class="card loading hidden"
>

  <div class="spinner">
    ✨
  </div>

  <h3>
    กำลังเตรียมชุดการสอน...
  </h3>

  <p style="color:#6f7890">

    AI กำลังจัดเนื้อหา
    และตรวจความสอดคล้อง

  </p>

</section>


<!-- =====================================================
     ERROR
===================================================== -->

<section
id="error"
class="card hidden"
>

  <div
  class="error"
  id="errorText"
  ></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section
id="result"
class="card hidden"
>


  <div class="result-head">


    <div>

      <h2>
        🎉 ชุดการสอนพร้อมแล้ว
      </h2>


      <div
      id="summary"
      class="chips"
      style="margin-top:8px"
      ></div>

    </div>


  </div>


  <div
  class="tabs"
  style="margin-top:18px"
  >


    <button
    class="tab active"
    data-tab="lesson"
    >
      📚 แผนการสอน
    </button>


    <button
    class="tab"
    data-tab="worksheet"
    >
      📝 ใบงาน
    </button>


    <button
    class="tab"
    data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>


    <button
    class="tab"
    data-tab="answer"
    >
      ✅ เฉลย
    </button>


  </div>


  <div
  id="lesson"
  class="panel"
  ></div>


  <div
  id="worksheet"
  class="panel hidden"
  ></div>


  <div
  id="quiz"
  class="panel hidden"
  ></div>


  <div
  id="answer"
  class="panel hidden"
  ></div>


  <!-- ===================================================
       PDF
  ==================================================== -->

  <div
  style="
  margin-top:22px;
  font-weight:800
  "
  >

    📄 ดาวน์โหลดเอกสาร PDF

  </div>


  <div class="pdf-buttons">


    <button
    class="pdf-btn"
    onclick="downloadPDF('lesson')"
    >
      📚 แผนการสอน
    </button>


    <button
    class="pdf-btn"
    onclick="downloadPDF('worksheet')"
    >
      📝 ใบงาน
    </button>


    <button
    class="pdf-btn"
    onclick="downloadPDF('quiz')"
    >
      🧠 แบบทดสอบ
    </button>


    <button
    class="pdf-btn"
    onclick="downloadPDF('answers')"
    >
      ✅ เฉลย
    </button>


    <button
    class="pdf-btn"
    style="grid-column:1/-1"
    onclick="downloadPDF('all')"
    >
      📦 ดาวน์โหลดชุดเอกสารทั้งหมด
    </button>


  </div>


  <div
  class="actions"
  style="margin-top:12px"
  >


    <button
    class="secondary"
    onclick="window.print()"
    >
      🖨️ พิมพ์หน้าเว็บ
    </button>


    <button
    class="secondary"
    onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>


  </div>


</section>


</div>


<script>


// =======================================================
// DATA
// =======================================================

let currentData = null;


const typeNames = {

  multiple_choice:"ปรนัย",

  fill_blank:"เติมคำ",

  calculation:"คำนวณ",

  application:"ประยุกต์ใช้"

};


// =======================================================
// EXAMPLE
// =======================================================

function fillExample(value){

  document
    .getElementById("prompt")
    .value = value;

}


// =======================================================
// TABS
// =======================================================

document
.querySelectorAll(".tab")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".tab")
      .forEach(
        b =>
        b.classList.remove("active")
      );


      document
      .querySelectorAll(".panel")
      .forEach(
        p =>
        p.classList.add("hidden")
      );


      button.classList.add(
        "active"
      );


      document
      .getElementById(
        button.dataset.tab
      )
      .classList.remove(
        "hidden"
      );

    }
  );

});


// =======================================================
// ESCAPE
// =======================================================

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    m =>
    ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


// =======================================================
// GENERATE
// =======================================================

async function generate(){

  const prompt =
    document
    .getElementById("prompt")
    .value
    .trim();


  const teacherName =
    document
    .getElementById("teacherName")
    .value
    .trim();


  const selected = [

    ...
    document
    .querySelectorAll(
      ".check input:checked"
    )

  ]
  .map(
    x => x.id
  );


  if(!teacherName){

    showError(
      "กรุณาใส่ชื่อครูผู้สอนก่อนครับ 😊"
    );

    return;
  }


  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    return;
  }


  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;
  }


  setLoading(true);


  try{

    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({

            prompt,

            teacher_name:
            teacherName,

            question_count:
            Number(
              document
              .getElementById("count")
              .value
            ),

            question_types:
            selected,

            difficulty:
            document
            .getElementById(
              "difficulty"
            )
            .value

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.detail ||
        "เกิดข้อผิดพลาด"
      );

    }


    currentData = data;


    render(data);


  }catch(error){

    showError(
      error.message
    );

  }finally{

    setLoading(false);

  }

}


// =======================================================
// PDF
// =======================================================

async function downloadPDF(
  section
){

  if(!currentData){

    showError(
      "ยังไม่มีชุดการสอน"
    );

    return;
  }


  try{

    const response =
      await fetch(
        `/api/pdf?section=${encodeURIComponent(section)}`,
        {

          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify(
            currentData
          )

        }
      );


    if(!response.ok){

      let message =
        "สร้าง PDF ไม่สำเร็จ";


      try{

        const error =
          await response.json();


        if(error.detail){

          message =
            error.detail;

        }

      }catch(e){}


      throw new Error(
        message
      );

    }


    const blob =
      await response.blob();


    const url =
      window.URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href = url;


    link.download =
      `teacher-pack-${section}.pdf`;


    document
      .body
      .appendChild(link);


    link.click();


    link.remove();


    window.URL.revokeObjectURL(
      url
    );


  }catch(error){

    showError(
      error.message
    );

  }

}


// =======================================================
// LOADING
// =======================================================

function setLoading(
  value
){

  document
  .getElementById("loading")
  .classList
  .toggle(
    "hidden",
    !value
  );


  document
  .getElementById("generateBtn")
  .disabled = value;

}


// =======================================================
// ERROR
// =======================================================

function showError(
  message
){

  document
  .getElementById("error")
  .classList
  .remove("hidden");


  document
  .getElementById("errorText")
  .textContent =
    message;


  window.scrollTo({

    top:
      document
      .getElementById("error")
      .offsetTop - 15,

    behavior:"smooth"

  });

}


// =======================================================
// RENDER
// =======================================================

function render(data){

  document
  .getElementById("error")
  .classList
  .add("hidden");


  document
  .getElementById("result")
  .classList
  .remove("hidden");


  const s =
    data.summary;


  const teacher =
    data.teacher_name ||
    "";


  document
  .getElementById("summary")
  .innerHTML =

    `<span class="chip">
      👨‍🏫 ${esc(teacher)}
    </span>

     <span class="chip">
      🎒 ${esc(s.grade)}
    </span>

     <span class="chip">
      📖 ${esc(s.subject)}
    </span>

     <span class="chip">
      ✏️ ${esc(s.topic)}
    </span>

     <span class="chip">
      ⏱️ ${esc(s.duration)}
    </span>`;


  // =====================================================
  // LESSON
  // =====================================================

  document
  .getElementById("lesson")
  .innerHTML = `

    <h3>
      จุดประสงค์การเรียนรู้
    </h3>

    <ol>

      ${
        data.lesson_plan.objective
        .map(
          x =>
          `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ol>


    <h3>
      เนื้อหาที่ใช้สอน
    </h3>

    <div class="item">

      ${esc(
        data.teaching_content.intro
      )}

    </div>


    <h3>
      สาระสำคัญ
    </h3>

    ${
      data.teaching_content
      .concepts
      .map(
        x =>
        `<div class="item">
          ${esc(x)}
        </div>`
      )
      .join("")
    }


    <h3>
      ตัวอย่างสำหรับใช้สอน
    </h3>

    ${
      data.teaching_content
      .examples
      .map(
        (x,i) =>
        `<div class="item">

          <b>
            ${i+1}. ${esc(x.title)}
          </b>

          <div
          style="margin-top:7px"
          >
            ${esc(x.explanation)}
          </div>

        </div>`
      )
      .join("")
    }


    <h3>
      คำถามชวนคิด
    </h3>

    <ol>

      ${
        data.teaching_content
        .thinking_questions
        .map(
          x =>
          `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ol>


    <h3>
      ขั้นตอนการสอน
    </h3>

    ${
      data.lesson_plan.steps
      .map(
        x =>
        `<div class="item">

          <b>
            ${esc(x.time)}
            ·
            ${esc(x.title)}
          </b>

          <div
          style="margin-top:7px"
          >
            ${esc(x.detail)}
          </div>

        </div>`
      )
      .join("")
    }


    <h3>
      เคล็ดลับสำหรับครู
    </h3>

    <ul>

      ${
        data.teaching_content
        .teacher_tips
        .map(
          x =>
          `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ul>


    <h3>
      การประเมินผล
    </h3>

    <div class="item">

      ${esc(
        data.lesson_plan.assessment
      )}

    </div>

  `;


  // =====================================================
  // WORKSHEET
  // =====================================================

  document
  .getElementById("worksheet")
  .innerHTML = `

    <h3>
      ใบงาน
    </h3>

    <p>
      เรื่อง ${esc(s.topic)}
    </p>

    <div class="item">

      <b>
        คำชี้แจง
      </b>

      <div style="margin-top:6px">

        ให้นักเรียนอ่านโจทย์
        และเขียนคำตอบให้ครบทุกข้อ

      </div>

    </div>


    ${
      data.worksheet
      .map(
        x =>
        `<div class="item">

          <b>
            ข้อ ${x.no}
          </b>

          <div style="margin-top:7px">

            ${esc(x.question)}

          </div>

          <div
          style="
          margin-top:12px;
          color:#6f7890
          "
          >

            คำตอบ:
            ______________________

          </div>

        </div>`
      )
      .join("")
    }

  `;


  // =====================================================
  // QUIZ
  // =====================================================

  document
  .getElementById("quiz")
  .innerHTML = `

    <h3>
      แบบทดสอบ
      ${data.quiz.length}
      ข้อ
    </h3>


    ${
      data.quiz
      .map(
        x => `

          <div class="item">

            <span class="qtype">

              ${
                esc(
                  typeNames[x.type]
                  || x.type
                )
              }

            </span>


            <div
            style="margin-top:8px"
            >

              <b>
                ข้อ ${x.no}.
              </b>

              ${esc(x.question)}

            </div>


            ${
              x.options?.length
              ?

              `<ol type="A">

                ${
                  x.options
                  .map(
                    option =>
                    `<li>
                      ${esc(option)}
                    </li>`
                  )
                  .join("")
                }

              </ol>`

              :

              `<div
              style="
              margin-top:10px
              "
              >
                คำตอบ:
                __________________
              </div>`

            }

          </div>

        `
      )
      .join("")
    }

  `;


  // =====================================================
  // ANSWERS
  // =====================================================

  document
  .getElementById("answer")
  .innerHTML = `

    <h3>
      เฉลยใบงาน
    </h3>


    ${
      data.worksheet
      .map(
        x =>
        `<div class="item">

          <b>
            ข้อ ${x.no}
          </b>

          <div
          style="margin-top:5px"
          >
            ${esc(x.answer)}
          </div>

        </div>`
      )
      .join("")
    }


    <h3>
      เฉลยแบบทดสอบ
    </h3>


    ${
      data.quiz
      .map(
        x =>
        `<div class="item">

          <b>
            ข้อ ${x.no}
          </b>

          —
          ${esc(x.answer)}

          <div
          style="
          color:#6f7890;
          margin-top:5px
          "
          >

            ${esc(x.explanation)}

          </div>

        </div>`
      )
      .join("")
    }

  `;


  // กลับไปแท็บแผนการสอน
  document
  .querySelectorAll(".tab")
  .forEach(
    b =>
    b.classList.remove(
      "active"
    )
  );


  document
  .querySelector(
    '.tab[data-tab="lesson"]'
  )
  .classList
  .add("active");


  document
  .querySelectorAll(".panel")
  .forEach(
    p =>
    p.classList.add("hidden")
  );


  document
  .getElementById("lesson")
  .classList
  .remove("hidden");


  window.scrollTo({

    top:
      document
      .getElementById("result")
      .offsetTop - 15,

    behavior:"smooth"

  });

}


// =======================================================
// NEW PACK
// =======================================================

function newPack(){

  document
  .getElementById("result")
  .classList
  .add("hidden");


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}

</script>
