<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
name="theme-color"
content="#fff8ed"
>

<title>จัดทำชุดการสอน</title>


<style>

/* ======================================================
   ROOT
====================================================== */

:root{

--bg:#fff8ed;
--card:#fff;
--ink:#27324a;
--muted:#6f7890;

--primary:#6c63ff;
--primary2:#5148e8;

--line:#e9e5dc;

--blue:#e3f0ff;
--mint:#dff8ee;

--danger:#ffe7e7;

}


/* ======================================================
   BASIC
====================================================== */

*{
box-sizing:border-box
}


body{

margin:0;

background:
linear-gradient(
180deg,
#fff8ed,
#f7f5ff
);

font-family:
-apple-system,
BlinkMacSystemFont,
"Noto Sans Thai",
sans-serif;

color:var(--ink);

font-size:17px;

}


button,
input,
textarea,
select{

font-family:inherit;

}


/* ======================================================
   CONTAINER — ขยายกลับมาใหญ่
====================================================== */

.container{

width:min(
1120px,
94%
);

margin:auto;

}


.header{

padding:
24px 0 12px;

display:flex;

justify-content:
space-between;

align-items:center;

}


.brand{

font-size:24px;

font-weight:800;

}


.badge{

font-size:13px;

background:
var(--mint);

padding:
8px 12px;

border-radius:
999px;

font-weight:700;

}


/* ======================================================
   HERO
====================================================== */

.hero{

text-align:center;

padding:
34px 0 24px;

}


.hero h1{

font-size:
clamp(
34px,
6vw,
50px
);

margin:
0 0 10px;

}


.hero p{

color:
var(--muted);

margin:0;

font-size:17px;

line-height:1.7;

}


/* ======================================================
   CARD — ใหญ่ขึ้น
====================================================== */

.card{

background:#fff;

border:
1px solid var(--line);

border-radius:26px;

padding:28px;

box-shadow:
0 12px 30px
rgba(
49,
55,
85,
.09
);

margin:
18px 0;

}


/* ======================================================
   LABEL
====================================================== */

.label{

font-weight:800;

display:block;

margin-bottom:10px;

font-size:17px;

}


/* ======================================================
   PROMPT
====================================================== */

.prompt{

width:100%;

min-height:135px;

border:
2px solid #e8e4f8;

border-radius:20px;

padding:17px;

resize:vertical;

outline:0;

background:#fcfbff;

font-size:18px;

line-height:1.6;

}


.prompt:focus{

border-color:
var(--primary);

}


/* ======================================================
   GRID
====================================================== */

.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:16px;

}


.field{

background:
#faf9f5;

border:
1px solid var(--line);

padding:17px;

border-radius:20px;

}


.field input,
.field select{

width:100%;

border:0;

background:
transparent;

outline:0;

font-weight:700;

color:
var(--ink);

font-size:17px;

}


/* ======================================================
   EXAMPLES
====================================================== */

.examples{

display:flex;

gap:9px;

flex-wrap:wrap;

margin-top:11px;

}


.example{

border:0;

background:
#f4f2ff;

color:
#5148e8;

border-radius:
999px;

padding:
9px 14px;

font-size:15px;

}


/* ======================================================
   TYPES
====================================================== */

.types{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}


.check input{

position:absolute;

opacity:0;

}


.check label{

display:block;

padding:16px;

border:
2px solid var(--line);

border-radius:18px;

font-weight:700;

cursor:pointer;

font-size:16px;

}


.check input:checked + label{

border-color:
var(--primary);

background:
#f0efff;

color:
#5148e8;

}


/* ======================================================
   PRIMARY BUTTON
====================================================== */

.primary{

width:100%;

border:0;

border-radius:20px;

padding:19px;

background:
linear-gradient(
135deg,
var(--primary),
var(--primary2)
);

color:#fff;

font-weight:800;

font-size:19px;

box-shadow:
0 9px 18px
rgba(
108,
99,
255,
.25
);

cursor:pointer;

}


.primary:disabled{

opacity:.6;

cursor:default;

}


/* ======================================================
   LOADING
====================================================== */

.hidden{

display:none !important;

}


.loading{

text-align:center;

padding:45px;

}


.spinner{

font-size:42px;

animation:
bounce 1s infinite alternate;

}


@keyframes bounce{

to{

transform:
translateY(-8px);

}

}


/* ======================================================
   ERROR
====================================================== */

.error{

background:
var(--danger);

color:
#9d2929;

padding:16px;

border-radius:18px;

white-space:
pre-wrap;

line-height:1.6;

}


.saved{

background:
var(--mint);

color:
#28704e;

padding:14px;

border-radius:18px;

}


/* ======================================================
   RESULT
====================================================== */

.result-head{

display:flex;

justify-content:
space-between;

gap:15px;

align-items:center;

}


.result-head h2{

margin:0;

font-size:25px;

}


.chips{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-top:10px;

}


.chip{

padding:
8px 11px;

border-radius:
999px;

background:
var(--blue);

font-size:13px;

font-weight:800;

}


/* ======================================================
   TABS
====================================================== */

.tabs{

display:flex;

gap:9px;

overflow:auto;

padding-bottom:6px;

margin-top:20px;

}


.tab{

white-space:nowrap;

border:0;

background:
#f2f1ee;

border-radius:14px;

padding:
12px 16px;

font-weight:800;

font-size:15px;

color:
var(--muted);

cursor:pointer;

}


.tab.active{

background:
#5148e8;

color:#fff;

}


/* ======================================================
   PANEL
====================================================== */

.panel{

line-height:1.8;

font-size:17px;

padding-top:12px;

}


.panel h3{

margin-top:30px;

margin-bottom:14px;

font-size:23px;

font-weight:800;

}


.panel h3:first-child{

margin-top:10px;

}


/* ======================================================
   PARAGRAPH
====================================================== */

.paragraph{

margin:
0 0 15px;

line-height:1.85;

}


/* ======================================================
   ITEM
====================================================== */

.item{

padding:16px;

border:
1px solid var(--line);

border-radius:18px;

margin:11px 0;

background:#fff;

line-height:1.8;

}


.lesson-body{

font-size:17px;

line-height:1.9;

margin:
0 0 17px;

}


.lesson-bullet{

margin:
8px 0;

line-height:1.8;

}


/* ======================================================
   ACTION
====================================================== */

.actions{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}


.secondary{

border:
2px solid #e7e3f6;

background:#fff;

color:
#5148e8;

border-radius:17px;

padding:14px;

font-weight:800;

font-size:16px;

cursor:pointer;

}


/* ======================================================
   PDF
====================================================== */

.pdfs{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:11px;

margin-top:15px;

}


.pdfbtn{

display:block;

text-align:center;

text-decoration:none;

border:
2px solid #e7e3f6;

background:#fff;

color:
#5148e8;

border-radius:16px;

padding:13px;

font-weight:800;

font-size:15px;

}


/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:750px){

.container{

width:94%;

}


.grid,
.types{

grid-template-columns:
1fr;

}


.card{

padding:20px;

border-radius:22px;

}


.hero{

padding-top:25px;

}


.hero h1{

font-size:35px;

}


.prompt{

font-size:17px;

}


.pdfs{

grid-template-columns:
1fr;

}


.panel{

font-size:16px;

}

}


@media(max-width:480px){

.header{

padding-top:18px;

}


.brand{

font-size:21px;

}


.badge{

font-size:11px;

}


.card{

padding:17px;

}


.hero h1{

font-size:31px;

}


.hero p{

font-size:15px;

}


.actions{

grid-template-columns:
1fr;

}

}


</style>

</head>


<body>


<div class="container">


<!-- =====================================================
HEADER
===================================================== -->

<header class="header">

<div class="brand">

📚 ชุดการสอน

</div>


<div class="badge">

V1.8

</div>

</header>


<!-- =====================================================
HERO
===================================================== -->

<section class="hero">

<h1>

สอนอะไรวันนี้? ✨

</h1>


<p>

พิมพ์หัวข้อ แล้วสร้างแผนการสอน
ใบงาน แบบทดสอบ และเฉลย

</p>

</section>


<!-- =====================================================
BUILDER
===================================================== -->

<section
class="card"
id="builder"
>


<label class="label">

👋 วันนี้คุณอยากสอนอะไร?

</label>


<textarea
id="prompt"
class="prompt"
placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
></textarea>


<div class="examples">


<button
class="example"
onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
>

🧮 เศษส่วน ป.4

</button>


<button
class="example"
onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
>

🌎 ระบบสุริยะ ป.5

</button>


<button
class="example"
onclick="fillExample('Animals ป.3 30 นาที')"
>

🇬🇧 Animals ป.3

</button>


</div>


</section>


<!-- =====================================================
SETTINGS
===================================================== -->

<section class="card">


<div class="grid">


<div class="field">

<label class="label">

👨‍🏫 ชื่อครู

</label>


<input
id="teacher"
placeholder="เช่น สมปอง เข้ามา"
>


</div>


<div class="field">

<label class="label">

🔢 จำนวนข้อสอบ

</label>


<select id="count">

<option>5</option>

<option selected>10</option>

<option>15</option>

<option>20</option>

<option>30</option>

</select>

</div>


<div class="field">

<label class="label">

🎯 ระดับความยาก

</label>


<select id="difficulty">

<option value="easy">

ง่าย

</option>

<option value="medium">

ปานกลาง

</option>

<option value="hard">

ยาก

</option>

<option
value="mixed"
selected
>

ผสม

</option>

</select>

</div>


</div>


<div style="margin-top:22px">


<label class="label">

🧠 รูปแบบข้อสอบ

<span
style="
color:#6f7890;
font-weight:500
"
>

(เลือกได้หลายแบบ)

</span>

</label>


<div class="types">


<div class="check">

<input
type="checkbox"
id="multiple_choice"
checked
>

<label
for="multiple_choice"
>

☑️ ปรนัย

</label>

</div>


<div class="check">

<input
type="checkbox"
id="fill_blank"
>

<label
for="fill_blank"
>

✏️ เติมคำ

</label>

</div>


<div class="check">

<input
type="checkbox"
id="calculation"
>

<label
for="calculation"
>

🔢 คำนวณ

</label>

</div>


<div class="check">

<input
type="checkbox"
id="application"
>

<label
for="application"
>

💡 ประยุกต์ใช้

</label>

</div>


</div>


</div>


<div style="margin-top:22px">


<button
id="generateBtn"
class="primary"
onclick="generate()"
>

✨ สร้างชุดการสอน

</button>


<div
style="
text-align:center;
color:#6f7890;
font-size:14px;
margin-top:13px;
line-height:1.6
"
>

แผนการสอน + ใบงาน +
แบบทดสอบ + เฉลย

</div>


</div>


</section>


<!-- =====================================================
LOADING
===================================================== -->

<section
id="loading"
class="card loading hidden"
>


<div class="spinner">

✨

</div>


<h3>

กำลังเตรียมชุดการสอน...

</h3>


<p
style="color:#6f7890"
>

กำลังสร้างเอกสารและ PDF
กรุณารอสักครู่

</p>


</section>


<!-- =====================================================
ERROR
===================================================== -->

<section
id="error"
class="card hidden"
>

<div
class="error"
id="errorText"
></div>

</section>


<!-- =====================================================
RESULT
===================================================== -->

<section
id="result"
class="card hidden"
>


<div class="result-head">


<div>

<h2>

🎉 ชุดการสอนพร้อมแล้ว

</h2>


<div
id="summary"
class="chips"
></div>


</div>


</div>


<div
id="saved"
class="saved hidden"
style="margin-top:14px"
>

💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว

</div>


<!-- =====================================================
TABS
===================================================== -->

<div class="tabs">


<button
class="tab active"
data-tab="lesson"
>

📚 แผนการสอน

</button>


<button
class="tab"
data-tab="worksheet"
>

📝 ใบงาน

</button>


<button
class="tab"
data-tab="quiz"
>

🧠 แบบทดสอบ

</button>


<button
class="tab"
data-tab="answer"
>

✅ เฉลย

</button>


</div>


<!-- =====================================================
PANELS
===================================================== -->

<div
id="lesson"
class="panel"
></div>


<div
id="worksheet"
class="panel hidden"
></div>


<div
id="quiz"
class="panel hidden"
></div>


<div
id="answer"
class="panel hidden"
></div>


<!-- =====================================================
PDF
===================================================== -->

<div
id="pdfs"
class="pdfs"
></div>


<!-- =====================================================
ACTION
===================================================== -->

<div
class="actions"
style="margin-top:20px"
>


<button
class="secondary"
onclick="window.print()"
>

🖨️ พิมพ์

</button>


<button
class="secondary"
onclick="newPack()"
>

🔄 สร้างชุดใหม่

</button>


</div>


</section>


</div>


<script>


// ========================================================
// BASIC
// ========================================================

let currentData = null;


const $ = id =>
document.getElementById(id);


function fillExample(value){

$("prompt").value = value;

}


function esc(value){

return String(
value ?? ""
)
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#039;"
}[m])
);

}


function showError(text){

$("error")
.classList
.remove(
"hidden"
);


$("errorText").textContent =
typeof text === "object"
? JSON.stringify(
text,
null,
2
)
: text;

}


function setLoading(value){

$("loading")
.classList
.toggle(
"hidden",
!value
);


$("generateBtn")
.disabled = value;


if(value){

$("loading")
.scrollIntoView({

behavior:"smooth",

block:"center"

});

}

}


// ========================================================
// TABS
// ========================================================

document
.querySelectorAll(".tab")
.forEach(
button => {

button.addEventListener(
"click",
() => {


document
.querySelectorAll(".tab")
.forEach(
b =>
b.classList.remove(
"active"
)
);


document
.querySelectorAll(".panel")
.forEach(
p =>
p.classList.add(
"hidden"
)
);


button.classList.add(
"active"
);


$(
button.dataset.tab
)
.classList.remove(
"hidden"
);


}
);

}
);


// ========================================================
// LOCAL STORAGE
// ========================================================

function saveLocal(data){

try{

localStorage.setItem(

"ai_teacher_v18_data",

JSON.stringify(data)

);

}
catch(e){}

}


function loadLocal(){

try{

const x =
localStorage.getItem(
"ai_teacher_v18_data"
);


return x
? JSON.parse(x)
: null;

}
catch(e){

return null;

}

}


// ========================================================
// GENERATE
// ========================================================

async function generate(){


const prompt =
$("prompt")
.value
.trim();


const teacher =
$("teacher")
.value
.trim();


const selected = [
...
document
.querySelectorAll(
".check input:checked"
)
]
.map(
x => x.id
);


if(!prompt){

showError(
"พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
);

return;

}


if(!selected.length){

showError(
"เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
);

return;

}


$("error")
.classList
.add(
"hidden"
);


setLoading(true);


try{


const response =
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

prompt:

prompt,

teacher_name:

teacher,

question_count:

+$("count").value,

question_types:

selected,

difficulty:

$("difficulty").value

})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.detail ||
"เกิดข้อผิดพลาด"
);

}


currentData =
data;


saveLocal(
data
);


render(
data
);


}
catch(error){

showError(
error.message
);

}
finally{

setLoading(
false
);

}

}


// ========================================================
// RENDER
// ========================================================

function render(data){


$("error")
.classList
.add(
"hidden"
);


$("result")
.classList
.remove(
"hidden"
);


$("saved")
.classList
.remove(
"hidden"
);


// ======================================================
// SUMMARY
// ======================================================

const summary =
data.summary;


$("summary")
.innerHTML = `

<span class="chip">

🎒 ${esc(summary.grade)}

</span>


<span class="chip">

📖 ${esc(summary.subject)}

</span>


<span class="chip">

✏️ ${esc(summary.topic)}

</span>


<span class="chip">

⏱️ ${esc(summary.duration)}

</span>


${
summary.teacher &&
summary.teacher !== "ไม่ระบุ"
?

`

<span class="chip">

👨‍🏫 ${esc(summary.teacher)}

</span>

`

:

""

}

`;


// ======================================================
// LESSON
// ======================================================

const lesson =
data.lesson_plan || {};


const objectives =
(lesson.objective || [])
.map(
x => `

<div class="lesson-bullet">

- ${esc(x)}

</div>

`
)
.join("");


const content =
(lesson.content || [])
.map(
x => `

<p class="lesson-body">

${esc(x)}

</p>

`
)
.join("");


const keyPoints =
(lesson.key_points || [])
.map(
x => `

<p class="lesson-body">

${esc(x)}

</p>

`
)
.join("");


const examples =
(lesson.examples || [])
.map(
x => {

if(
typeof x === "object" &&
x !== null
){

return `

<div class="item">

<b>
${esc(x.title || "")}
</b>

<p class="paragraph">

${esc(x.explanation || "")}

</p>

</div>

`;

}

return `

<p class="lesson-body">

${esc(x)}

</p>

`;

}
)
.join("");


const steps =
(lesson.steps || [])
.map(
x => `

<div class="item">

<b>

${esc(x.time)}
${x.time ? " · " : ""}
${esc(x.title)}

</b>


<p class="paragraph">

${esc(x.detail)}

</p>

</div>

`
)
.join("");


$("lesson")
.innerHTML = `

<h3>

1. จุดประสงค์การเรียนรู้

</h3>

${objectives}


<h3>

2. เนื้อหาที่ใช้สอน

</h3>

${content}


<h3>

สาระสำคัญ

</h3>

${keyPoints}


${
examples
?

`

<h3>

ตัวอย่างสำหรับใช้สอน

</h3>

${examples}

`

:

""

}


<h3>

3. ขั้นตอนการจัดการเรียนรู้

</h3>

${steps}


<h3>

4. การประเมินผล

</h3>


<p class="lesson-body">

${esc(lesson.assessment || "")}

</p>

`;


// ======================================================
// WORKSHEET
// ======================================================

$("worksheet")
.innerHTML = `

<h3>

ใบงาน

</h3>


${
(data.worksheet || [])
.map(
(x,i) => `

<div class="item">


<div
style="
font-size:18px;
line-height:1.8;
font-weight:700;
"
>

${i + 1}.
${esc(x.question)}
