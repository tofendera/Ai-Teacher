<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>ชุดการสอน V1.5</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f8f7f2;
  color:#27304a;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans Thai",
    sans-serif;
}

.wrap{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:24px 18px 60px;
}

.hero{
  text-align:center;
  padding:12px 8px 26px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.brand-title{
  font-size:25px;
  font-weight:800;
}

.version{
  background:#dff6ee;
  color:#27304a;
  padding:9px 16px;
  border-radius:30px;
  font-size:16px;
  font-weight:800;
}

h1{
  margin:10px 0 12px;
  font-size:42px;
  line-height:1.2;
  letter-spacing:-1px;
}

.hero-text{
  margin:0 auto;
  max-width:650px;
  font-size:21px;
  line-height:1.65;
  color:#73788c;
}

.card{
  background:#fff;
  border:1px solid #ebe8e2;
  border-radius:28px;
  padding:25px;
  margin:18px 0;
  box-shadow:
    0 8px 28px rgba(0,0,0,.05);
}

label{
  display:block;
  font-size:20px;
  font-weight:800;
  margin-bottom:10px;
}

textarea,
input,
select{
  width:100%;
  border:2px solid #e8e5f3;
  border-radius:20px;
  background:#fcfbff;
  color:#27304a;
  font-size:20px;
  padding:17px 18px;
  outline:none;
}

textarea{
  min-height:145px;
  resize:vertical;
  line-height:1.5;
}

textarea:focus,
input:focus,
select:focus{
  border-color:#6554d0;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.quick button{
  width:auto;
  margin:0;
  background:#f3f0ff;
  color:#5143bd;
  border:0;
  padding:12px 16px;
  font-size:17px;
}

button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:17px 20px;
  margin-top:15px;
  font-size:21px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:#594bc5;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#594bc5;
  border:2px solid #e2def5;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.status{
  display:none;
}

.status.show{
  display:block;
}

.status-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.status-text{
  font-size:19px;
  color:#6f7487;
  line-height:1.6;
}

.progress{
  height:13px;
  background:#eceaf3;
  border-radius:99px;
  overflow:hidden;
  margin-top:16px;
}

.progress-bar{
  height:100%;
  width:0;
  background:#594bc5;
  border-radius:99px;
  transition:.4s;
}

.result{
  display:none;
}

.result.show{
  display:block;
}

.result-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:15px;
}

.download{
  background:#594bc5;
  color:#fff;
  font-size:23px;
  padding:20px;
}

.new-set{
  background:#fff;
  color:#594bc5;
  border:2px solid #ddd8f2;
  font-size:21px;
}

.note{
  font-size:17px;
  color:#777c8d;
  line-height:1.6;
}

.error{
  display:none;
  background:#fff0f0;
  border:2px solid #f1cccc;
  color:#a33c3c;
  padding:17px;
  border-radius:18px;
  font-size:18px;
  line-height:1.5;
}

.error.show{
  display:block;
}

@media(max-width:600px){

  .wrap{
    padding:
      18px
      14px
      45px;
  }

  h1{
    font-size:36px;
  }

  .hero-text{
    font-size:19px;
  }

  .card{
    padding:20px;
    border-radius:24px;
  }

  label{
    font-size:19px;
  }

  textarea,
  input,
  select{
    font-size:18px;
  }

  .row{
    grid-template-columns:1fr;
  }

  button{
    font-size:19px;
  }

}

</style>

</head>

<body>

<div class="wrap">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <section class="hero">

    <div class="brand">

      <div class="brand-title">
        📚 ชุดการสอน
      </div>

      <div class="version">
        V1.5
      </div>

    </div>

    <h1>
      สอนอะไรกันวันนี้? ✨
    </h1>

    <p class="hero-text">
      พิมพ์หัวข้อ แล้วสร้างแผนการสอน
      ใบงาน แบบทดสอบ และเฉลย
    </p>

  </section>


  <!-- =====================================================
       FORM
  ====================================================== -->

  <section class="card">

    <label>
      👋 วันนี้คุณอยากสอนอะไร?
    </label>

    <textarea
      id="topic"
      placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
    ></textarea>

    <div class="quick">

      <button
        type="button"
        onclick="quickTopic('เศษส่วน ป.4')"
      >
        🧮 เศษส่วน ป.4
      </button>

      <button
        type="button"
        onclick="quickTopic('ระบบสุริยะ ป.5')"
      >
        🌎 ระบบสุริยะ ป.5
      </button>

      <button
        type="button"
        onclick="quickTopic('Animals ป.3')"
      >
        🇬🇧 Animals ป.3
      </button>

    </div>

  </section>


  <!-- =====================================================
       SETTINGS
  ====================================================== -->

  <section class="card">

    <div class="row">

      <div>

        <label>
          👨‍🏫 ชื่อครู
        </label>

        <input
          id="teacher"
          type="text"
          placeholder="เช่น สมปอง เข้ามา"
        >

      </div>

      <div>

        <label>
          🔢 จำนวนข้อสอบ
        </label>

        <select id="questionCount">

          <option value="5">
            5
          </option>

          <option value="10" selected>
            10
          </option>

          <option value="15">
            15
          </option>

          <option value="20">
            20
          </option>

        </select>

      </div>

    </div>


    <div style="margin-top:18px">

      <label>
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="mixed" selected>
          ผสม
        </option>

        <option value="hard">
          ยาก
        </option>

      </select>

    </div>


    <button
      id="generateBtn"
      class="primary"
      onclick="generateLesson()"
    >
      ✨ สร้างชุดการสอน
    </button>

  </section>


  <!-- =====================================================
       ERROR
  ====================================================== -->

  <div
    id="error"
    class="error"
  ></div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <section
    id="statusCard"
    class="card status"
  >

    <div class="status-title">
      ⏳ กำลังสร้างชุดการสอน
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      กำลังเตรียมข้อมูล...
    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </section>


  <!-- =====================================================
       RESULT
  ====================================================== -->

  <section
    id="resultCard"
    class="card result"
  >

    <div class="result-title">
      🎉 สร้างชุดการสอนเสร็จแล้ว
    </div>

    <p class="note">
      ระบบสร้าง PDF รวมทั้งหมดให้แล้ว
      กดปุ่มด้านล่างเพื่อเปิด PDF
      จากนั้นสามารถกดดาวน์โหลดจากตัวแสดง PDF ได้
    </p>


    <!-- มีปุ่มดาวน์โหลดเพียงปุ่มเดียว -->

    <button
      id="downloadBtn"
      class="download"
      onclick="openPDF()"
    >
      📄 ดาวน์โหลด PDF
    </button>


    <!-- มีปุ่มสร้างใหม่เพียงปุ่มเดียว -->

    <button
      class="new-set"
      onclick="newSet()"
    >
      🔄 สร้างชุดใหม่
    </button>

  </section>

</div>


<script>

let pdfUrl = null;


/* =========================================================
   QUICK TOPIC
========================================================= */

function quickTopic(text){

  document.getElementById(
    "topic"
  ).value = text;

}


/* =========================================================
   SCROLL STATUS
========================================================= */

function scrollToStatus(){

  const card =
    document.getElementById(
      "statusCard"
    );

  card.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(){

  const card =
    document.getElementById(
      "statusCard"
    );

  card.classList.add("show");

}


function setStatus(text, progress){

  document.getElementById(
    "statusText"
  ).textContent = text;

  document.getElementById(
    "progressBar"
  ).style.width = progress + "%";

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  const error =
    document.getElementById(
      "error"
    );

  error.textContent = message;

  error.classList.add("show");

}


function hideError(){

  document
    .getElementById("error")
    .classList.remove("show");

}


/* =========================================================
   GENERATE
========================================================= */

async function generateLesson(){

  hideError();

  const topic =
    document.getElementById(
      "topic"
    ).value.trim();

  const teacher =
    document.getElementById(
      "teacher"
    ).value.trim();

  const questionCount =
    Number(
      document.getElementById(
        "questionCount"
      ).value
    );

  const difficulty =
    document.getElementById(
      "difficulty"
    ).value;


  if(!topic){

    showError(
      "กรุณาพิมพ์หัวข้อที่ต้องการสอนก่อน"
    );

    document
      .getElementById("topic")
      .focus();

    return;
  }


  const generateBtn =
    document.getElementById(
      "generateBtn"
    );

  generateBtn.disabled = true;


  document
    .getElementById("resultCard")
    .classList.remove("show");


  showStatus();

  scrollToStatus();


  try{

    setStatus(
      "กำลังเตรียมคำสั่งสำหรับ AI...",
      10
    );


    await wait(400);


    setStatus(
      "กำลังสร้างแผนการจัดการเรียนรู้...",
      25
    );


    const response =
      await fetch(
        "/api/generate",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            prompt:topic,
            teacher_name:teacher,
            question_count:questionCount,
            difficulty:difficulty
          })
        }
      );


    setStatus(
      "กำลังสร้างเนื้อหา ใบงาน และแบบทดสอบ...",
      55
    );


    if(!response.ok){

      let message =
        "เกิดข้อผิดพลาดในการสร้างชุดการสอน";

      try{

        const errorData =
          await response.json();

        if(errorData.detail){

          message =
            errorData.detail;

        }

      }catch(e){}

      throw new Error(
        message
      );
    }


    const data =
      await response.json();


    setStatus(
      "กำลังสร้าง PDF...",
      80
    );


    await wait(500);


    if(
      !data ||
      !data.pdf_url
    ){

      throw new Error(
        "ระบบไม่พบไฟล์ PDF"
      );
    }


    pdfUrl =
      data.pdf_url;


    setStatus(
      "สร้างชุดการสอนเสร็จแล้ว",
      100
    );


    await wait(500);


    document
      .getElementById(
        "resultCard"
      )
      .classList.add("show");


    document
      .getElementById(
        "resultCard"
      )
      .scrollIntoView({
        behavior:"smooth",
        block:"center"
      });


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "เกิดข้อผิดพลาด"
    );

  }finally{

    generateBtn.disabled = false;

  }

}


/* =========================================================
   OPEN PDF
========================================================= */

function openPDF(){

  if(!pdfUrl){

    showError(
      "ยังไม่พบไฟล์ PDF"
    );

    return;
  }


  /*
    สำคัญ:
    เปิดหน้า PDF โดยตรง

    Backend ใช้ Content-Disposition: inline
    ดังนั้น Safari จะเปิด PDF ให้ดู
    ไม่ใช่ส่ง JSON หรือ ZIP
  */

  window.location.href =
    pdfUrl;

}


/* =========================================================
   NEW SET
========================================================= */

function newSet(){

  /*
    ไม่ใช้ localStorage
    ไม่ใช้ sessionStorage

    จึงเริ่มชุดใหม่แบบสะอาด
  */

  pdfUrl = null;


  document.getElementById(
    "topic"
  ).value = "";


  document.getElementById(
    "teacher"
  ).value = "";


  document.getElementById(
    "questionCount"
  ).value = "10";


  document.getElementById(
    "difficulty"
  ).value = "mixed";


  document
    .getElementById("resultCard")
    .classList.remove("show");


  document
    .getElementById("statusCard")
    .classList.remove("show");


  document
    .getElementById("progressBar")
    .style.width = "0%";


  document
    .getElementById("statusText")
    .textContent =
      "กำลังเตรียมข้อมูล...";


  hideError();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   WAIT
========================================================= */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   IMPORTANT:
   ไม่โหลดข้อมูลเดิมตอน Refresh

   ไม่มี localStorage
   ไม่มี sessionStorage
   ไม่มี fetch ประวัติ
========================================================= */

window.addEventListener(
  "pageshow",
  function(){
    /*
      intentionally empty
    */
  }
);

</script>

</body>
</html>
