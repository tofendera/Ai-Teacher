<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ed">

<title>ครูผู้ช่วย</title>

<style>

:root{
  --bg:#fff8ed;
  --card:#ffffff;
  --ink:#27324a;
  --muted:#6f7890;
  --primary:#6c63ff;
  --primary2:#5148e8;
  --yellow:#ffd45c;
  --mint:#dff8ee;
  --pink:#ffe3ec;
  --blue:#e3f0ff;
  --line:#e9e5dc;
  --shadow:0 12px 30px rgba(49,55,85,.09);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    linear-gradient(
      180deg,
      #fff8ed 0,
      #f7f5ff 100%
    );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    sans-serif;
  color:var(--ink);
}

button,
input,
select,
textarea{
  font:inherit;
}

.container{
  width:min(900px,92%);
  margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
  padding:24px 0 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
  font-weight:800;
  font-size:20px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  background:#fff;
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  font-size:25px;
}

.badge{
  font-size:12px;
  background:var(--mint);
  padding:7px 11px;
  border-radius:999px;
  font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  padding:30px 0 20px;
}

.hero h1{
  font-size:clamp(30px,7vw,48px);
  margin:0 0 10px;
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  font-size:16px;
  margin:0;
}

/* =========================
   CARD
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  margin:16px 0;
}

.label{
  font-weight:800;
  margin-bottom:9px;
  display:block;
}

/* =========================
   INPUT
========================= */

.prompt{
  width:100%;
  min-height:112px;
  border:2px solid #e8e4f8;
  border-radius:18px;
  padding:16px;
  resize:vertical;
  outline:none;
  background:#fcfbff;
}

.prompt:focus{
  border-color:var(--primary);
}

.examples{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.example{
  border:0;
  background:#f4f2ff;
  color:#5148e8;
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  background:#faf9f5;
  border:1px solid var(--line);
  padding:15px;
  border-radius:18px;
}

select{
  width:100%;
  border:0;
  background:transparent;
  color:var(--ink);
  outline:none;
  font-weight:700;
}

/* =========================
   QUESTION TYPES
========================= */

.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.check{
  position:relative;
}

.check input{
  position:absolute;
  opacity:0;
}

.check label{
  display:block;
  padding:14px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#fff;
  cursor:pointer;
  font-weight:700;
}

.check input:checked+label{
  border-color:var(--primary);
  background:#f0efff;
  color:#5148e8;
}

/* =========================
   BUTTON
========================= */

button.primary{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
  color:#fff;
  font-weight:800;
  font-size:18px;
  cursor:pointer;
  box-shadow:
    0 9px 18px
    rgba(108,99,255,.25);

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button.primary:active{
  transform:scale(.98);
}

button.primary:disabled{
  opacity:.6;
  cursor:wait;
}

.note{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
}

/* =========================
   LOADING
========================= */

.hidden{
  display:none !important;
}

.loading{
  text-align:center;
  padding:35px 20px;
}

.loading-icon{
  font-size:46px;
  animation:
    loadingBounce
    1s infinite alternate;
}

@keyframes loadingBounce{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-10px);
  }

}

.loading h3{
  margin:12px 0 8px;
}

.loading p{
  color:var(--muted);
  margin:0;
}

.loading-bar{
  width:100%;
  height:8px;
  background:#eeeaff;
  border-radius:999px;
  overflow:hidden;
  margin-top:22px;
}

.loading-bar-inner{
  width:40%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      var(--primary),
      #8b85ff
    );
  border-radius:999px;

  animation:
    loadingBar
    1.4s
    infinite ease-in-out;
}

@keyframes loadingBar{

  0%{
    transform:translateX(-120%);
  }

  100%{
    transform:translateX(300%);
  }

}

/* =========================
   ERROR
========================= */

.error{
  background:#ffe7e7;
  color:#9d2929;
  padding:14px;
  border-radius:16px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* =========================
   RESULT
========================= */

.result-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.result-head h2{
  margin:0;
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chip{
  padding:7px 10px;
  border-radius:999px;
  background:var(--blue);
  font-size:12px;
  font-weight:800;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
}

.tab{
  white-space:nowrap;
  border:0;
  background:#f2f1ee;
  border-radius:12px;
  padding:10px 13px;
  font-weight:800;
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  background:#5148e8;
  color:#fff;
}

.panel{
  line-height:1.75;
}

.panel h3{
  margin-top:0;
}

.item{
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  margin:10px 0;
  background:#fff;
}

.qtype{
  font-size:11px;
  background:#f1f0ff;
  color:#5148e8;
  padding:5px 8px;
  border-radius:999px;
  font-weight:800;
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.secondary{
  border:2px solid #e7e3f6;
  background:#fff;
  color:#5148e8;
  border-radius:16px;
  padding:13px;
  font-weight:800;
  cursor:pointer;
}

/* =========================
   SAVED NOTICE
========================= */

.saved-notice{
  background:#e4f7ee;
  color:#267653;
  padding:13px 15px;
  border-radius:16px;
  margin-top:15px;
  font-weight:700;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .types{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

  .header{
    padding-top:16px;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

/* =========================
   PRINT
========================= */

@media print{

  .header,
  .hero,
  #builder,
  #loading,
  #error,
  .actions,
  .tabs,
  .saved-notice{
    display:none !important;
  }

  .card{
    box-shadow:none;
    border:0;
  }

  .panel{
    display:block !important;
  }

}

</style>
</head>

<body>

<div class="container">

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="brand">

    <div class="logo">
      📚
    </div>

    ครูผู้ช่วย

  </div>

  <div class="badge">
    V1.5
  </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <h1>
    สอนอะไรวันนี้? ✨
  </h1>

  <p>
    พิมพ์แค่ประโยคเดียว
    แล้วให้ระบบช่วยเตรียมชุดการสอน
  </p>

</section>


<!-- =========================
     BUILDER
========================= -->

<section
  id="builder"
  class="card"
>

  <label class="label">
    👋 วันนี้คุณอยากสอนอะไร?
  </label>

  <textarea
    id="prompt"
    class="prompt"
    placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
  ></textarea>

  <div class="examples">

    <button
      class="example"
      onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
    >
      🧮 เศษส่วน ป.4
    </button>

    <button
      class="example"
      onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
    >
      🌎 ระบบสุริยะ ป.5
    </button>

    <button
      class="example"
      onclick="fillExample('Animals ป.3 30 นาที')"
    >
      🇬🇧 Animals ป.3
    </button>

  </div>

</section>


<!-- =========================
     OPTIONS
========================= -->

<section class="card">

  <div class="grid">

    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>

      <select id="count">

        <option value="5">
          5 ข้อ
        </option>

        <option
          value="10"
          selected
        >
          10 ข้อ
        </option>

        <option value="15">
          15 ข้อ
        </option>

        <option value="20">
          20 ข้อ
        </option>

        <option value="30">
          30 ข้อ
        </option>

      </select>

    </div>


    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option
          value="mixed"
          selected
        >
          ผสม
        </option>

      </select>

    </div>

  </div>


  <div style="margin-top:18px">

    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
        style="
          color:#6f7890;
          font-weight:500
        "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">

      <div class="check">

        <input
          type="checkbox"
          id="multiple_choice"
          checked
        >

        <label for="multiple_choice">
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="fill_blank"
        >

        <label for="fill_blank">
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="calculation"
        >

        <label for="calculation">
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="application"
        >

        <label for="application">
          💡 ประยุกต์ใช้
        </label>

      </div>

    </div>

  </div>


  <div style="margin-top:18px">

    <button
      id="generateBtn"
      class="primary"
      onclick="generate()"
    >
      ✨ สร้างชุดการสอน
    </button>

    <div class="note">
      แผนการสอน + ใบงาน + เฉลย + แบบทดสอบ
    </div>

  </div>

</section>


<!-- =========================
     LOADING
========================= -->

<section
  id="loading"
  class="card loading hidden"
>

  <div class="loading-icon">
    ✨
  </div>

  <h3>
    กำลังเตรียมชุดการสอน...
  </h3>

  <p>
    ระบบกำลังสร้างเนื้อหา
    ใบงาน และแบบทดสอบ
  </p>

  <div class="loading-bar">

    <div class="loading-bar-inner"></div>

  </div>

</section>


<!-- =========================
     ERROR
========================= -->

<section
  id="error"
  class="card hidden"
>

  <div
    class="error"
    id="errorText"
  ></div>

</section>


<!-- =========================
     RESULT
========================= -->

<section
  id="result"
  class="card hidden"
>

  <div class="result-head">

    <div>

      <h2>
        🎉 ชุดการสอนพร้อมแล้ว
      </h2>

      <div
        id="summary"
        class="chips"
        style="margin-top:8px"
      ></div>

    </div>

  </div>


  <div
    id="savedNotice"
    class="saved-notice hidden"
  >
    💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
  </div>


  <div
    class="tabs"
    style="margin-top:18px"
  >

    <button
      class="tab active"
      data-tab="lesson"
    >
      📚 แผนการสอน
    </button>

    <button
      class="tab"
      data-tab="worksheet"
    >
      📝 ใบงาน
    </button>

    <button
      class="tab"
      data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>

    <button
      class="tab"
      data-tab="answer"
    >
      ✅ เฉลย
    </button>

  </div>


  <div
    id="lesson"
    class="panel"
  ></div>


  <div
    id="worksheet"
    class="panel hidden"
  ></div>


  <div
    id="quiz"
    class="panel hidden"
  ></div>


  <div
    id="answer"
    class="panel hidden"
  ></div>


  <div
    class="actions"
    style="margin-top:18px"
  >

    <button
      class="secondary"
      onclick="downloadPDF()"
    >
      📄 บันทึก PDF
    </button>

    <button
      class="secondary"
      onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>

  </div>

</section>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let currentData = null;


/* =========================================================
   QUESTION TYPE NAMES
========================================================= */

const typeNames = {

  multiple_choice:
    "ปรนัย",

  fill_blank:
    "เติมคำ",

  calculation:
    "คำนวณ",

  application:
    "ประยุกต์ใช้"

};


/* =========================================================
   EXAMPLE
========================================================= */

function fillExample(value){

  document
    .getElementById("prompt")
    .value = value;

}


/* =========================================================
   TABS
========================================================= */

document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(
            item =>
              item.classList.remove(
                "active"
              )
          );


        document
          .querySelectorAll(".panel")
          .forEach(
            panel =>
              panel.classList.add(
                "hidden"
              )
          );


        button.classList.add(
          "active"
        );


        const target =
          document.getElementById(
            button.dataset.tab
          );


        if(target){

          target.classList.remove(
            "hidden"
          );

        }

      }
    );

  });


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}


/* =========================================================
   ERROR TO TEXT
========================================================= */

function getErrorMessage(error){

  if(
    typeof error === "string"
  ){

    return error;

  }


  if(
    error instanceof Error
  ){

    return (
      error.message ||
      "เกิดข้อผิดพลาด"
    );

  }


  if(
    error &&
    typeof error === "object"
  ){

    if(
      error.detail !== undefined
    ){

      const detail =
        error.detail;


      if(
        typeof detail === "string"
      ){

        return detail;

      }


      if(
        detail &&
        typeof detail === "object"
      ){

        if(
          detail.message
        ){

          return String(
            detail.message
          );

        }


        if(
          detail.error
        ){

          return String(
            detail.error
          );

        }


        try{

          return JSON.stringify(
            detail,
            null,
            2
          );

        }catch(e){}

      }

    }


    if(
      error.message !== undefined
    ){

      if(
        typeof error.message === "string"
      ){

        return error.message;

      }


      try{

        return JSON.stringify(
          error.message,
          null,
          2
        );

      }catch(e){}

    }


    try{

      return JSON.stringify(
        error,
        null,
        2
      );

    }catch(e){

      return "เกิดข้อผิดพลาด";

    }

  }


  return String(
    error ||
    "เกิดข้อผิดพลาด"
  );

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(error){

  const box =
    document.getElementById(
      "error"
    );


  const text =
    document.getElementById(
      "errorText"
    );


  text.textContent =
    getErrorMessage(
      error
    );


  box.classList.remove(
    "hidden"
  );


  /*
   * เลื่อนไปให้เห็น Error
   */

  setTimeout(
    () => {

      box.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },
    50
  );

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

  document
    .getElementById("error")
    .classList.add("hidden");


  document
    .getElementById("errorText")
    .textContent = "";

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(isLoading){

  const loading =
    document.getElementById(
      "loading"
    );


  const button =
    document.getElementById(
      "generateBtn"
    );


  loading.classList.toggle(
    "hidden",
    !isLoading
  );


  button.disabled =
    isLoading;


  if(isLoading){

    /*
     * สำคัญ:
     * เลื่อนหน้าจอลงมาที่ Loading
     * หลังจากเปิด Loading แล้ว
     */

    setTimeout(
      () => {

        loading.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      },
      80
    );

  }

}


/* =========================================================
   SAVE CURRENT DATA
========================================================= */

function saveCurrentData(){

  if(!currentData){

    return;

  }


  try{

    localStorage.setItem(
      "ai_teacher_current_data",
      JSON.stringify(
        currentData
      )
    );


    localStorage.setItem(
      "ai_teacher_saved_at",
      new Date().toISOString()
    );


  }catch(error){

    console.warn(
      "ไม่สามารถบันทึกข้อมูล:",
      error
    );

  }

}


/* =========================================================
   LOAD SAVED DATA
========================================================= */

function loadSavedData(){

  try{

    const raw =
      localStorage.getItem(
        "ai_teacher_current_data"
      );


    if(!raw){

      return;

    }


    const data =
      JSON.parse(raw);


    if(
      !data ||
      typeof data !== "object"
    ){

      return;

    }


    currentData =
      data;


    render(
      currentData,
      false
    );


    const savedNotice =
      document.getElementById(
        "savedNotice"
      );


    savedNotice.classList.remove(
      "hidden"
    );


  }catch(error){

    console.warn(
      "โหลดชุดการสอนไม่สำเร็จ:",
      error
    );

  }

}


/* =========================================================
   CLEAR SAVED DATA
========================================================= */

function clearSavedData(){

  try{

    localStorage.removeItem(
      "ai_teacher_current_data"
    );

    localStorage.removeItem(
      "ai_teacher_saved_at"
    );

  }catch(error){

    console.warn(
      error
    );

  }

}


/* =========================================================
   GENERATE
========================================================= */

async function generate(){

  const prompt =
    document
      .getElementById(
        "prompt"
      )
      .value
      .trim();


  const selected =
    [
      ...document.querySelectorAll(
        ".check input:checked"
      )
    ].map(
      input =>
        input.id
    );


  /*
   * ตรวจหัวข้อ
   */

  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    return;

  }


  /*
   * ตรวจประเภทข้อสอบ
   */

  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  /*
   * ล้าง Error เดิม
   */

  clearError();


  /*
   * ซ่อนผลเก่า
   */

  document
    .getElementById(
      "result"
    )
    .classList.add(
      "hidden"
    );


  /*
   * เริ่ม Loading
   */

  setLoading(true);


  try{

    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prompt:

              prompt,

            question_count:

              Number(
                document
                  .getElementById(
                    "count"
                  )
                  .value
              ),

            question_types:

              selected,

            difficulty:

              document
                .getElementById(
                  "difficulty"
                )
                .value

          })

        }
      );


    /*
     * อ่าน Response
     */

    let data = null;


    try{

      data =
        await response.json();

    }catch(error){

      throw new Error(
        "เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ถูกต้อง"
      );

    }


    /*
     * HTTP Error
     */

    if(!response.ok){

      throw new Error(
        getErrorMessage(
          data
        )
      );

    }


    /*
     * ตรวจว่ามีข้อมูลหรือไม่
     */

    if(
      !data ||
      typeof data !== "object"
    ){

      throw new Error(
        "ระบบไม่ได้ส่งข้อมูลชุดการสอนกลับมา"
      );

    }


    /*
     * เก็บข้อมูล
     */

    currentData =
      data;


    /*
     * บันทึกทันที
     */

    saveCurrentData();


    /*
     * ล้าง Error เก่า
     */

    clearError();


    /*
     * แสดงผล
     */

    render(
      currentData,
      true
    );


  }catch(error){

    console.error(
      "Generate Error:",
      error
    );


    showError(
      error
    );


  }finally{

    setLoading(false);

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(
  data,
  scrollToResult = true
){

  if(
    !data ||
    !data.summary
  ){

    showError(
      "ข้อมูลชุดการสอนไม่สมบูรณ์"
    );

    return;

  }


  clearError();


  const result =
    document.getElementById(
      "result"
    );


  result.classList.remove(
    "hidden"
  );


  const summary =
    data.summary;


  /*
   * SUMMARY
   */

  document.getElementById(
    "summary"
  ).innerHTML = `

    <span class="chip">
      🎒 ${esc(summary.grade)}
    </span>

    <span class="chip">
      📖 ${esc(summary.subject)}
    </span>

    <span class="chip">
      ✏️ ${esc(summary.topic)}
    </span>

    <span class="chip">
      ⏱️ ${esc(summary.duration)}
    </span>

  `;


  /*
   * LESSON
   */

  const lessonPlan =
    data.lesson_plan || {};


  const objectives =
    Array.isArray(
      lessonPlan.objective
    )
      ? lessonPlan.objective
      : [];


  const steps =
    Array.isArray(
      lessonPlan.steps
    )
      ? lessonPlan.steps
      : [];


  document.getElementById(
    "lesson"
  ).innerHTML = `

    <h3>
      จุดประสงค์การเรียนรู้
    </h3>

    <ul>

      ${
        objectives
          .map(
            item =>
              `<li>${esc(item)}</li>`
          )
          .join("")
      }

    </ul>


    <h3>
      ขั้นตอนการสอน
    </h3>

    ${
      steps
        .map(
          item => `

            <div class="item">

              <b>
                ${esc(item.time)}
                ·
                ${esc(item.title)}
              </b>

              <div>
                ${esc(item.detail)}
              </div>

            </div>

          `
        )
        .join("")
    }


    <h3>
      การประเมินผล
    </h3>

    <div class="item">

      ${esc(
        lessonPlan.assessment ||
        ""
      )}

    </div>

  `;


  /*
   * WORKSHEET
   */

  const worksheet =
    Array.isArray(
      data.worksheet
    )
      ? data.worksheet
      : [];


  document.getElementById(
    "worksheet"
  ).innerHTML = `

    <h3>
      ใบงาน
    </h3>

    ${
      worksheet
        .map(
          item => `

            <div class="item">

              <b>
                ${esc(item.no)}.
                ${esc(item.question)}
              </b>

              <div
                style="
                  margin-top:10px
                "
              >
                คำตอบ:
                ____________________
              </div>

            </div>

          `
        )
        .join("")
    }

  `;


  /*
   * QUIZ
   */

  const quiz =
    Array.isArray(
      data.quiz
    )
      ? data.quiz
      : [];


  document.getElementById(
    "quiz"
  ).innerHTML = `

    <h3>
      แบบทดสอบ
      ${quiz.length}
      ข้อ
    </h3>

    ${
      quiz
        .map(
          item => `

            <div class="item">

              <span class="qtype">

                ${esc(
                  typeNames[
                    item.type
                  ] ||
                  item.type ||
                  "ข้อสอบ"
                )}

              </span>


              <div
                style="
                  margin-top:8px
                "
              >

                <b>

                  ${esc(item.no)}.
                  ${esc(item.question)}

                </b>

              </div>


              ${
                Array.isArray(
                  item.options
                ) &&
                item.options.length
                  ? `

                    <ol type="A">

                      ${
                        item.options
                          .map(
                            option =>
                              `<li>${esc(option)}</li>`
                          )
                          .join("")
                      }

                    </ol>

                  `
                  : ""
              }

            </div>

          `
        )
        .join("")
    }

  `;


  /*
   * ANSWER
   */

  document.getElementById(
    "answer"
  ).innerHTML = `

    <h3>
      เฉลย
    </h3>


    <h4>
      เฉลยใบงาน
    </h4>

    ${
      worksheet
        .map(
          item => `

            <div class="item">

              <b>
                ใบงานข้อ
                ${esc(item.no)}
              </b>

              —

              ${esc(item.answer)}

            </div>

          `
        )
        .join("")
    }


    <h4>
      เฉลยแบบทดสอบ
    </h4>

    ${
      quiz
        .map(
          item => `

            <div class="item">

              <b>
                ข้อ
                ${esc(item.no)}
              </b>

              —

              ${esc(item.answer)}

              <div
                style="
                  color:#6f7890;
                  margin-top:4px
                "
              >

                ${esc(
                  item.explanation
                )}

              </div>

            </div>

          `
        )
        .join("")
    }

  `;


  /*
   * ตั้ง Tab กลับไปที่แผนการสอน
   */

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      item =>
        item.classList.add(
          "hidden"
        )
    );


  const lessonTab =
    document.querySelector(
      '[data-tab="lesson"]'
    );


  lessonTab.classList.add(
    "active"
  );


  document
    .getElementById(
      "lesson"
    )
    .classList.remove(
      "hidden"
    );


  /*
   * แสดงสถานะบันทึก
   */

  document
    .getElementById(
      "savedNotice"
    )
    .classList.remove(
      "hidden"
    );


  /*
   * เลื่อนไปที่ผลลัพธ์
   */

  if(scrollToResult){

    setTimeout(
      () => {

        result.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      },
      150
    );

  }

}


/* =========================================================
   DOWNLOAD PDF
========================================================= */

async function downloadPDF(){

  if(!currentData){

    showError(
      "ยังไม่มีชุดการสอนสำหรับสร้าง PDF"
    );

    return;

  }


  clearError();


  try{

    /*
     * ส่งข้อมูลชุดปัจจุบันไป Backend
     */

    const response =
      await fetch(
        "/api/pdf",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify(
            currentData
          )

        }
      );


    /*
     * กรณี Error
     */

    if(!response.ok){

      let data = null;


      try{

        data =
          await response.json();

      }catch(error){

        throw new Error(
          "สร้าง PDF ไม่สำเร็จ"
        );

      }


      throw new Error(
        getErrorMessage(
          data
        )
      );

    }


    /*
     * รับ PDF
     */

    const blob =
      await response.blob();


    /*
     * ตรวจ Blob
     */

    if(
      !blob ||
      blob.size === 0
    ){

      throw new Error(
        "ไฟล์ PDF ที่สร้างมีขนาดเป็น 0"
      );

    }


    /*
     * สร้าง URL
     */

    const url =
      URL.createObjectURL(
        blob
      );


    /*
     * ดาวน์โหลด
     */

    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "ชุดการสอน.pdf";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    /*
     * คืน URL
     */

    setTimeout(
      () => {

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );


    /*
     * สำคัญ:
     * ไม่ล้าง currentData
     * ไม่ล้าง localStorage
     */

    saveCurrentData();


  }catch(error){

    console.error(
      "PDF Error:",
      error
    );


    showError(
      error
    );

  }

}
