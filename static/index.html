<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff8ed"
>

<title>จัดทำชุดการสอน</title>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --bg:#fff8ed;
  --card:#ffffff;

  --ink:#27324a;
  --muted:#737b91;

  --primary:#6258e8;
  --primary2:#5148d8;

  --line:#e8e4dc;

  --soft:#f4f2ff;

  --blue:#e8f2ff;

  --mint:#dff7ed;

  --danger:#ffe7e7;

}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #fff8ed 0%,
      #f7f5ff 100%
    );

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    sans-serif;

  font-size:15px;

  line-height:1.65;

  -webkit-text-size-adjust:100%;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

  width:min(
    900px,
    94%
  );

  margin:0 auto;

  padding-bottom:30px;

}


/* =====================================================
   HEADER
===================================================== */

.header{

  padding:
    18px 0 5px;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.brand{

  font-size:20px;

  font-weight:800;

}

.badge{

  background:var(--mint);

  padding:
    6px 11px;

  border-radius:999px;

  font-size:12px;

  font-weight:800;

}


/* =====================================================
   HERO
===================================================== */

.hero{

  text-align:center;

  padding:
    25px 0 18px;

}

.hero h1{

  margin:
    0 0 8px;

  font-size:
    clamp(
      31px,
      7vw,
      44px
    );

  line-height:1.2;

  font-weight:800;

}

.hero p{

  margin:0 auto;

  max-width:650px;

  color:var(--muted);

  font-size:16px;

  line-height:1.6;

}


/* =====================================================
   CARD
===================================================== */

.card{

  background:var(--card);

  border:
    1px solid var(--line);

  border-radius:23px;

  padding:18px;

  margin:
    15px 0;

  box-shadow:
    0 10px 28px
    rgba(
      45,
      51,
      80,
      .08
    );

}


/* =====================================================
   LABEL
===================================================== */

.label{

  display:block;

  margin-bottom:8px;

  font-size:16px;

  font-weight:800;

}


/* =====================================================
   PROMPT
===================================================== */

.prompt{

  width:100%;

  min-height:105px;

  padding:14px;

  resize:vertical;

  outline:none;

  border:
    2px solid #e7e3f7;

  border-radius:17px;

  background:#fcfbff;

  color:var(--ink);

  font-family:inherit;

  font-size:15px;

  line-height:1.6;

}

.prompt:focus{

  border-color:
    var(--primary);

}


/* =====================================================
   EXAMPLES
===================================================== */

.examples{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:8px;

}

.example{

  border:0;

  border-radius:999px;

  padding:
    7px 11px;

  background:#f3f1ff;

  color:#5148d8;

  font-family:inherit;

  font-size:13px;

  font-weight:700;

  cursor:pointer;

}


/* =====================================================
   GRID
===================================================== */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

}


/* =====================================================
   FIELD
===================================================== */

.field{

  padding:13px;

  border:
    1px solid var(--line);

  border-radius:17px;

  background:#faf9f5;

}

.field input,
.field select{

  width:100%;

  border:0;

  outline:0;

  background:transparent;

  color:var(--ink);

  font-family:inherit;

  font-size:15px;

  font-weight:700;

}

.field input::placeholder{

  color:#a3a3a3;

  font-weight:500;

}


/* =====================================================
   QUESTION TYPES
===================================================== */

.types{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

}

.check input{

  position:absolute;

  opacity:0;

}

.check label{

  display:block;

  padding:11px;

  border:
    2px solid var(--line);

  border-radius:15px;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

}

.check input:checked + label{

  border-color:
    var(--primary);

  background:var(--soft);

  color:#5148d8;

}


/* =====================================================
   PRIMARY BUTTON
===================================================== */

.primary{

  width:100%;

  border:0;

  border-radius:17px;

  padding:14px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-family:inherit;

  font-size:17px;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 8px 17px
    rgba(
      98,
      88,
      232,
      .23
    );

}

.primary:disabled{

  opacity:.6;

  cursor:wait;

}

.note{

  margin-top:9px;

  text-align:center;

  color:var(--muted);

  font-size:12px;

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

  display:none !important;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

  text-align:center;

  padding:
    27px 18px;

}

.spinner{

  font-size:36px;

  animation:
    bounce 1s infinite alternate;

}

@keyframes bounce{

  to{

    transform:
      translateY(-7px);

  }

}

.loading h3{

  margin:
    9px 0 3px;

  font-size:19px;

}

.loading p{

  margin:0;

  color:var(--muted);

  font-size:14px;

}


/* =====================================================
   ERROR
===================================================== */

.error{

  padding:13px;

  border-radius:15px;

  background:var(--danger);

  color:#9d2929;

  font-size:14px;

  white-space:pre-wrap;

}


/* =====================================================
   RESULT
===================================================== */

.result-head h2{

  margin:0;

  font-size:22px;

}


/* =====================================================
   CHIPS
===================================================== */

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:7px;

}

.chip{

  padding:
    5px 9px;

  border-radius:999px;

  background:var(--blue);

  font-size:11px;

  font-weight:800;

}


/* =====================================================
   SAVED
===================================================== */

.saved{

  margin-top:10px;

  padding:11px;

  border-radius:15px;

  background:var(--mint);

  color:#28704e;

  font-size:13px;

}


/* =====================================================
   TABS
===================================================== */

.tabs{

  display:flex;

  gap:7px;

  overflow-x:auto;

  margin-top:15px;

  padding-bottom:4px;

  -webkit-overflow-scrolling:touch;

}

.tab{

  flex:
    0 0 auto;

  border:0;

  border-radius:11px;

  padding:
    8px 11px;

  background:#f1f0ed;

  color:var(--muted);

  font-family:inherit;

  font-size:13px;

  font-weight:800;

  cursor:pointer;

}

.tab.active{

  background:#5148d8;

  color:#fff;

}


/* =====================================================
   PANEL
===================================================== */

.panel{

  font-size:15px;

  line-height:1.75;

}

.panel h3{

  margin:
    20px 0 9px;

  font-size:19px;

  line-height:1.4;

  font-weight:800;

}

.panel h3:first-child{

  margin-top:11px;

}


/* =====================================================
   ITEM
===================================================== */

.item{

  margin:
    8px 0;

  padding:12px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:#fff;

  font-size:15px;

  line-height:1.75;

}

.item b{

  font-size:15px;

}


/* =====================================================
   PDF AREA
===================================================== */

.pdf-area{

  margin-top:19px;

}


/* =====================================================
   DOWNLOAD ALL BUTTON
===================================================== */

.download-all{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  min-height:55px;

  border:
    2px solid #e5e1f5;

  border-radius:16px;

  background:#fff;

  color:#5148d8;

  font-family:inherit;

  font-size:16px;

  font-weight:800;

  text-decoration:none;

  cursor:pointer;

  transition:.15s;

}

.download-all:active{

  transform:scale(.98);

  background:#f7f5ff;

}

.download-all:disabled{

  opacity:.6;

  cursor:wait;

}


/* =====================================================
   NEW PACK
===================================================== */

.actions{

  margin-top:10px;

}

.secondary{

  width:100%;

  border:
    2px solid #e5e1f5;

  border-radius:16px;

  padding:12px;

  background:#fff;

  color:#5148d8;

  font-family:inherit;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  .container{

    width:94%;

  }

  .card{

    padding:16px;

  }

  .grid,
  .types{

    grid-template-columns:1fr;

  }

  .hero{

    padding-top:22px;

  }

  .hero h1{

    font-size:33px;

  }

  .hero p{

    font-size:15px;

  }

  .panel{

    font-size:15px;

  }

  .panel h3{

    font-size:19px;

  }

  .item{

    font-size:15px;

  }

  .download-all{

    font-size:15px;

  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:390px){

  .hero h1{

    font-size:30px;

  }

  .card{

    padding:14px;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="brand">
    📚 ชุดการสอน
  </div>

  <div class="badge">
    V1.5
  </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

  <h1>
    สอนอะไรวันนี้? ✨
  </h1>

  <p>
    พิมพ์หัวข้อ แล้วสร้างแผนการสอน
    ใบงาน แบบทดสอบ และเฉลย
  </p>

</section>


<!-- =====================================================
     BUILDER
===================================================== -->

<section
  class="card"
  id="builder"
>

  <label class="label">
    👋 วันนี้คุณอยากสอนอะไร?
  </label>


  <textarea
    id="prompt"
    class="prompt"
    placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
  ></textarea>


  <div class="examples">


    <button
      type="button"
      class="example"
      onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
    >
      🧮 เศษส่วน ป.4
    </button>


    <button
      type="button"
      class="example"
      onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
    >
      🌎 ระบบสุริยะ ป.5
    </button>


    <button
      type="button"
      class="example"
      onclick="fillExample('Animals ป.3 30 นาที')"
    >
      🇬🇧 Animals ป.3
    </button>


  </div>

</section>


<!-- =====================================================
     SETTINGS
===================================================== -->

<section class="card">


  <div class="grid">


    <!-- TEACHER -->

    <div class="field">

      <label class="label">
        👨‍🏫 ชื่อครู
      </label>

      <input
        id="teacher"
        placeholder="เช่น สมปอง เข้ามา"
      >

    </div>


    <!-- COUNT -->

    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>

      <select id="count">

        <option>5</option>

        <option selected>
          10
        </option>

        <option>15</option>

        <option>20</option>

        <option>30</option>

      </select>

    </div>


    <!-- DIFFICULTY -->

    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option
          value="mixed"
          selected
        >
          ผสม
        </option>

      </select>

    </div>


  </div>


  <!-- QUESTION TYPES -->

  <div
    style="margin-top:16px"
  >

    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
        style="
          color:#737b91;
          font-size:13px;
          font-weight:500;
        "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">


      <div class="check">

        <input
          type="checkbox"
          id="multiple_choice"
          checked
        >

        <label
          for="multiple_choice"
        >
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="fill_blank"
        >

        <label
          for="fill_blank"
        >
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="calculation"
        >

        <label
          for="calculation"
        >
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="application"
        >

        <label
          for="application"
        >
          💡 ประยุกต์ใช้
        </label>

      </div>


    </div>

  </div>


  <!-- GENERATE -->

  <div
    style="margin-top:16px"
  >

    <button
      id="generateBtn"
      class="primary"
      type="button"
      onclick="generate()"
    >
      ✨ สร้างชุดการสอน
    </button>


    <div class="note">
      แผนการสอน + ใบงาน + แบบทดสอบ + เฉลย
    </div>

  </div>


</section>


<!-- =====================================================
     LOADING
===================================================== -->

<section
  id="loading"
  class="card loading hidden"
>

  <div class="spinner">
    ✨
  </div>


  <h3>
    กำลังเตรียมชุดการสอน...
  </h3>


  <p>
    กำลังสร้างเอกสารและ PDF กรุณารอสักครู่
  </p>


</section>


<!-- =====================================================
     ERROR
===================================================== -->

<section
  id="error"
  class="card hidden"
>

  <div
    id="errorText"
    class="error"
  ></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section
  id="result"
  class="card hidden"
>


  <div class="result-head">

    <h2>
      🎉 ชุดการสอนพร้อมแล้ว
    </h2>

  </div>


  <div
    id="summary"
    class="chips"
  ></div>


  <div
    id="saved"
    class="saved hidden"
  >
    💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
  </div>


  <!-- =================================================
       TABS
  ================================================== -->

  <div class="tabs">


    <button
      type="button"
      class="tab active"
      data-tab="lesson"
    >
      📚 แผนการสอน
    </button>


    <button
      type="button"
      class="tab"
      data-tab="worksheet"
    >
      📝 ใบงาน
    </button>


    <button
      type="button"
      class="tab"
      data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>


    <button
      type="button"
      class="tab"
      data-tab="answer"
    >
      ✅ เฉลย
    </button>


  </div>


  <!-- PANELS -->

  <div
    id="lesson"
    class="panel"
  ></div>


  <div
    id="worksheet"
    class="panel hidden"
  ></div>


  <div
    id="quiz"
    class="panel hidden"
  ></div>


  <div
    id="answer"
    class="panel hidden"
  ></div>


  <!-- =================================================
       PDF
       ปุ่มเดียว
  ================================================== -->

  <div
    id="pdfs"
    class="pdf-area"
  ></div>


  <!-- =================================================
       NEW PACK
  ================================================== -->

  <div class="actions">

    <button
      type="button"
      class="secondary"
      onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>

  </div>


</section>


</div>


<script>


/* =====================================================
   STATE
===================================================== */

let currentData = null;


/* =====================================================
   SHORT ID
===================================================== */

function $(id){

  return document.getElementById(id);

}


/* =====================================================
   EXAMPLE
===================================================== */

function fillExample(value){

  $("prompt").value = value;

}


/* =====================================================
   ESC HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[m];

      }
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

  $("error")
    .classList
    .remove("hidden");


  $("errorText").textContent =
    typeof text === "object"

      ? JSON.stringify(
          text,
          null,
          2
        )

      : text;

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(value){

  $("loading")
    .classList
    .toggle(
      "hidden",
      !value
    );


  $("generateBtn").disabled = value;


  /*
    เมื่อเริ่มสร้าง
    ให้เลื่อนลงมาที่ Loading
  */

  if(value){

    setTimeout(
      function(){

        $("loading")
          .scrollIntoView({

            behavior:"smooth",

            block:"center"

          });

      },
      50
    );

  }

}


/* =====================================================
   TABS
===================================================== */

document
  .querySelectorAll(".tab")
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          document
            .querySelectorAll(".tab")
            .forEach(
              function(tab){

                tab.classList
                  .remove("active");

              }
            );


          document
            .querySelectorAll(".panel")
            .forEach(
              function(panel){

                panel.classList
                  .add("hidden");

              }
            );


          button.classList
            .add("active");


          const panel =
            $(button.dataset.tab);


          if(panel){

            panel.classList
              .remove("hidden");

          }

        }
      );

    }
  );


/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveLocal(data){

  try{

    localStorage.setItem(

      "ai_teacher_v15_data",

      JSON.stringify(data)

    );

  }
  catch(e){

    console.warn(
      "ไม่สามารถบันทึกข้อมูล",
      e
    );

  }

}


function loadLocal(){

  try{

    const value =
      localStorage.getItem(
        "ai_teacher_v15_data"
      );


    return value
      ? JSON.parse(value)
      : null;

  }
  catch(e){

    return null;

  }

}


/* =====================================================
   GENERATE
===================================================== */

async function generate(){


  const prompt =
    $("prompt")
      .value
      .trim();


  const teacher =
    $("teacher")
      .value
      .trim();


  const selected = [

    ...document
      .querySelectorAll(
        ".check input:checked"
      )

  ]
    .map(
      function(input){

        return input.id;

      }
    );


  /* ---------------------------------------------------
     VALIDATE
  --------------------------------------------------- */

  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    $("prompt").focus();

    return;

  }


  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  /* ---------------------------------------------------
     RESET
  --------------------------------------------------- */

  $("error")
    .classList
    .add("hidden");


  $("result")
    .classList
    .add("hidden");


  setLoading(true);


  /* ---------------------------------------------------
     API
  --------------------------------------------------- */

  try{


    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              prompt:
                prompt,

              teacher_name:
                teacher,

              question_count:
                +$("count").value,

              question_types:
                selected,

              difficulty:
                $("difficulty").value

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data.detail ||
        "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"

      );

    }


    if(!data){

      throw new Error(
        "ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์"
      );

    }


    /* -------------------------------------------------
       SAVE
    ------------------------------------------------- */

    currentData = data;


    saveLocal(data);


    /* -------------------------------------------------
       RENDER
    ------------------------------------------------- */

    render(data);


  }
  catch(error){

    console.error(error);


    showError(

      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่"

    );

  }
  finally{

    setLoading(false);

  }

}

/* =====================================================
   DOWNLOAD ALL PDF
===================================================== */

/*
   กดปุ่มเดียว

   ระบบจะดาวน์โหลด:

   1. แผนการสอน.pdf
   2. ใบงาน.pdf
   3. แบบทดสอบ.pdf
   4. เฉลย.pdf

   เป็น PDF แยกไฟล์
   ไม่ใช่ ZIP
===================================================== */

function downloadAllPDF(){


  if(!currentData){

    showError(
      "ยังไม่มีชุดการสอนให้ดาวน์โหลด"
    );

    return;

  }


  const pdf =
    currentData.pdf || {};


  const files = [

    {
      url:
        pdf.lesson_pdf,

      name:
        "แผนการสอน.pdf"

    },

    {
      url:
        pdf.worksheet_pdf,

      name:
        "ใบงาน.pdf"

    },

    {
      url:
        pdf.quiz_pdf,

      name:
        "แบบทดสอบ.pdf"

    },

    {
      url:
        pdf.answer_pdf,

      name:
        "เฉลย.pdf"

    }

  ]
  .filter(
    function(file){

      return !!file.url;

    }
  );


  if(!files.length){

    showError(
      "ไม่พบไฟล์ PDF"
    );

    return;

  }


  /*
     เปลี่ยนข้อความปุ่ม
  */

  const button =
    document.querySelector(
      ".download-all"
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "⏳ กำลังดาวน์โหลด...";

  }


  /*
     ใช้การเปิด PDF แต่ละไฟล์
     จาก URL เดิมของระบบ

     ไม่สร้าง ZIP
  */

  files.forEach(
    function(file,index){

      setTimeout(
        function(){

          const link =
            document.createElement(
              "a"
            );


          link.href =
            file.url;


          link.download =
            file.name;


          link.target =
            "_blank";


          link.rel =
            "noopener";


          document.body
            .appendChild(link);


          link.click();


          link.remove();


        },

        index * 700

      );

    }
  );


  /*
     คืนสถานะปุ่ม
  */

  setTimeout(
    function(){

      if(button){

        button.disabled = false;

        button.textContent =
          "📥 ดาวน์โหลดไฟล์ทั้งหมด";

      }

    },
    files.length * 700 + 1000
  );

}

   NEW PACK
===================================================== */

function newPack(){


  currentData = null;


  $("result")
    .classList
    .add("hidden");


  $("error")
    .classList
    .add("hidden");


  $("prompt").value = "";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });


  setTimeout(
    function(){

      $("prompt").focus();

    },
    400
  );

}

   LOAD SAVED DATA
===================================================== */

window.addEventListener(

  function(){


    const old =
      loadLocal();


    if(old){

      currentData =
        old;


      render(old);

    }

  }
);
