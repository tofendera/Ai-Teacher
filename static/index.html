<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color"
content="#fff8ed">

<title>ชุดเอกสารการเรียนการสอน</title>

<style>

:root{

--bg:#fff8ed;
--card:#ffffff;
--ink:#27324a;
--muted:#6f7890;

--primary:#6c63ff;
--primary2:#5148e8;

--line:#e9e5dc;

--blue:#e3f0ff;
--green:#dff8ee;
--pink:#ffe3ec;

--shadow:
0 12px 30px rgba(49,55,85,.09);

}

*{
box-sizing:border-box;
}

body{

margin:0;

background:
linear-gradient(
180deg,
#fff8ed 0%,
#f7f5ff 100%
);

font-family:
-apple-system,
BlinkMacSystemFont,
"Noto Sans Thai",
sans-serif;

color:var(--ink);

}

button,
input,
select,
textarea{

font:inherit;

}

.container{

width:min(
900px,
92%
);

margin:auto;

}

.header{

padding:
20px 0 10px;

display:flex;

justify-content:space-between;

align-items:center;

}

.brand{

display:flex;

align-items:center;

gap:10px;

font-weight:800;

font-size:20px;

}

.logo{

width:44px;

height:44px;

border-radius:14px;

background:white;

display:grid;

place-items:center;

box-shadow:var(--shadow);

font-size:23px;

}

.badge{

background:var(--green);

padding:
7px 11px;

border-radius:999px;

font-size:12px;

font-weight:800;

}

.hero{

text-align:center;

padding:
25px 0 15px;

}

.hero h1{

font-size:
clamp(
28px,
7vw,
44px
);

margin:
0 0 10px;

}

.hero p{

color:var(--muted);

margin:0;

}

.card{

background:white;

border:
1px solid var(--line);

border-radius:24px;

padding:22px;

box-shadow:var(--shadow);

margin:
16px 0;

}

.label{

display:block;

font-weight:800;

margin-bottom:9px;

}

.input{

width:100%;

border:
2px solid #e8e4f8;

border-radius:16px;

padding:
13px 15px;

outline:none;

background:#fcfbff;

}

.input:focus{

border-color:
var(--primary);

}

.prompt{

width:100%;

min-height:120px;

resize:vertical;

border:
2px solid #e8e4f8;

border-radius:18px;

padding:16px;

outline:none;

background:#fcfbff;

}

.prompt:focus{

border-color:
var(--primary);

}

.examples{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-top:10px;

}

.example{

border:0;

background:#f1efff;

color:#5148e8;

padding:
8px 12px;

border-radius:999px;

font-weight:700;

cursor:pointer;

}

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

}

.field{

background:#faf9f5;

border:
1px solid var(--line);

border-radius:18px;

padding:15px;

}

.field select{

width:100%;

border:0;

outline:none;

background:transparent;

font-weight:700;

color:var(--ink);

}

.types{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

.check{

position:relative;

}

.check input{

position:absolute;

opacity:0;

}

.check label{

display:block;

padding:14px;

border:
2px solid var(--line);

border-radius:16px;

cursor:pointer;

font-weight:700;

background:white;

}

.check input:checked + label{

border-color:
var(--primary);

background:#f0efff;

color:#5148e8;

}

.primary{

width:100%;

border:0;

border-radius:18px;

padding:17px;

background:
linear-gradient(
135deg,
var(--primary),
var(--primary2)
);

color:white;

font-weight:800;

font-size:18px;

cursor:pointer;

box-shadow:
0 9px 18px
rgba(108,99,255,.25);

}

.primary:disabled{

opacity:.6;

cursor:wait;

}

.note{

text-align:center;

font-size:13px;

color:var(--muted);

margin-top:10px;

}

.hidden{

display:none!important;

}

.loading{

text-align:center;

padding:35px;

}

.spinner{

font-size:38px;

animation:
bounce 1s infinite alternate;

}

@keyframes bounce{

to{
transform:translateY(-8px);
}

}

.error{

background:#ffe7e7;

color:#9d2929;

padding:14px;

border-radius:16px;

}

.result-title{

font-size:24px;

font-weight:800;

margin-bottom:12px;

}

.chips{

display:flex;

gap:7px;

flex-wrap:wrap;

}

.chip{

background:var(--blue);

padding:
7px 10px;

border-radius:999px;

font-size:12px;

font-weight:800;

}

.tabs{

display:flex;

gap:8px;

overflow-x:auto;

padding-bottom:5px;

margin-top:18px;

}

.tab{

white-space:nowrap;

border:0;

background:#f1f0ed;

border-radius:13px;

padding:
11px 14px;

font-weight:800;

color:var(--muted);

cursor:pointer;

}

.tab.active{

background:#5148e8;

color:white;

}

.panel{

line-height:1.8;

}

.panel h3{

margin-top:20px;

}

.item{

padding:15px;

border:
1px solid var(--line);

border-radius:16px;

margin:
10px 0;

background:white;

}

.question{

font-weight:800;

}

.qtype{

display:inline-block;

font-size:11px;

background:#f1f0ff;

color:#5148e8;

padding:
5px 8px;

border-radius:999px;

font-weight:800;

}

.actions{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-top:18px;

}

.secondary{

border:
2px solid #e7e3f6;

background:white;

color:#5148e8;

border-radius:16px;

padding:13px;

font-weight:800;

cursor:pointer;

}

.secondary:disabled{

opacity:.5;

}

.saved{

background:#eefaf5;

color:#26734f;

padding:
10px 13px;

border-radius:14px;

font-size:13px;

margin-top:12px;

}

@media(max-width:650px){

.grid{

grid-template-columns:
1fr;

}

.types{

grid-template-columns:
1fr;

}

.actions{

grid-template-columns:
1fr;

}

.card{

padding:17px;

}

}

</style>

</head>


<body>

<div class="container">


<header class="header">

<div class="brand">

<div class="logo">
📚
</div>

ชุดเอกสารการเรียนการสอน

</div>

<div class="badge">
V1.5
</div>

</header>


<section class="hero">

<h1>
เตรียมการสอน ✨
</h1>

<p>
กรอกข้อมูล แล้วสร้างชุดเอกสารพร้อมใช้
</p>

</section>


<!-- =====================================================
     BUILDER
===================================================== -->

<section
id="builder"
class="card"
>


<label class="label">
👨‍🏫 ชื่อครูผู้สอน
</label>


<input
id="teacherName"
class="input"
type="text"
placeholder="เช่น ครูดอย"
maxlength="100"
/>


<div style="height:18px"></div>


<label class="label">
👋 วันนี้คุณอยากสอนอะไร?
</label>


<textarea
id="prompt"
class="prompt"
placeholder="เช่น ระบบสุริยะ ป.5 1 ชั่วโมง"
></textarea>


<div class="examples">

<button
class="example"
onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
>
🧮 เศษส่วน ป.4
</button>


<button
class="example"
onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
>
🌎 ระบบสุริยะ ป.5
</button>


<button
class="example"
onclick="fillExample('Animals ป.3 30 นาที')"
>
🇬🇧 Animals ป.3
</button>

</div>

</section>


<section class="card">


<div class="grid">


<div class="field">

<label class="label">
🔢 จำนวนข้อสอบ
</label>

<select id="count">

<option value="5">
5 ข้อ
</option>

<option
value="10"
selected
>
10 ข้อ
</option>

<option value="15">
15 ข้อ
</option>

<option value="20">
20 ข้อ
</option>

<option value="30">
30 ข้อ
</option>

</select>

</div>


<div class="field">

<label class="label">
🎯 ระดับความยาก
</label>

<select id="difficulty">

<option value="easy">
ง่าย
</option>

<option value="medium">
ปานกลาง
</option>

<option value="hard">
ยาก
</option>

<option
value="mixed"
selected
>
ผสม
</option>

</select>

</div>


</div>


<div style="margin-top:18px">


<label class="label">

🧠 รูปแบบข้อสอบ

<span
style="
color:#6f7890;
font-weight:500
"
>
(เลือกได้หลายแบบ)
</span>

</label>


<div class="types">


<div class="check">

<input
type="checkbox"
id="multiple_choice"
checked
>

<label for="multiple_choice">
☑️ ปรนัย
</label>

</div>


<div class="check">

<input
type="checkbox"
id="fill_blank"
>

<label for="fill_blank">
✏️ เติมคำ
</label>

</div>


<div class="check">

<input
type="checkbox"
id="calculation"
>

<label for="calculation">
🔢 คำนวณ
</label>

</div>


<div class="check">

<input
type="checkbox"
id="application"
>

<label for="application">
💡 ประยุกต์ใช้
</label>

</div>


</div>

</div>


<div style="margin-top:18px">


<button
id="generateBtn"
class="primary"
onclick="generate()"
>
✨ สร้างชุดการสอน
</button>


<div class="note">

แผนการสอน + ใบงาน + แบบทดสอบ + เฉลย

</div>


</div>

</section>


<!-- =====================================================
     LOADING
===================================================== -->

<section
id="loading"
class="card loading hidden"
>

<div class="spinner">
✨
</div>

<h3>
กำลังจัดเตรียมเอกสาร...
</h3>

<p style="color:#6f7890">

กำลังสร้างเนื้อหาและตรวจสอบคำตอบ

</p>

</section>


<!-- =====================================================
     ERROR
===================================================== -->

<section
id="error"
class="card hidden"
>

<div
id="errorText"
class="error"
></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section
id="result"
class="card hidden"
>


<div class="result-title">

🎉 ชุดการสอนพร้อมแล้ว

</div>


<div
id="summary"
class="chips"
></div>


<div
id="savedMessage"
class="saved"
>
💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
</div>


<div class="tabs">


<button
class="tab active"
data-tab="lesson"
>
📚 แผนการสอน
</button>


<button
class="tab"
data-tab="worksheet"
>
📝 ใบงาน
</button>


<button
class="tab"
data-tab="quiz"
>
🧠 แบบทดสอบ
</button>


<button
class="tab"
data-tab="answer"
>
✅ เฉลย
</button>


</div>


<div
id="lesson"
class="panel"
></div>


<div
id="worksheet"
class="panel hidden"
></div>


<div
id="quiz"
class="panel hidden"
></div>


<div
id="answer"
class="panel hidden"
></div>


<div class="actions">


<button
id="pdfBtn"
class="secondary"
onclick="downloadPDF()"
>
📄 บันทึก PDF
</button>


<button
class="secondary"
onclick="newPack()"
>
🔄 สร้างชุดใหม่
</button>


</div>


</section>


</div>


<script>


// ========================================================
// STATE
// ========================================================

let currentData = null;


const STORAGE_KEY =
"teacher_pack_v15";


const typeNames = {

multiple_choice:
"ปรนัย",

fill_blank:
"เติมคำ",

calculation:
"คำนวณ",

application:
"ประยุกต์ใช้"

};


// ========================================================
// EXAMPLE
// ========================================================

function fillExample(value){

document.getElementById(
"prompt"
).value = value;

}


// ========================================================
// ESCAPE
// ========================================================

function esc(value){

return String(
value ?? ""
)
.replace(
/[&<>"']/g,
function(match){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[match];

}
);

}


// ========================================================
// TABS
// ========================================================

document
.querySelectorAll(".tab")
.forEach(
function(button){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".tab")
.forEach(
function(item){

item.classList.remove(
"active"
);

}
);


document
.querySelectorAll(".panel")
.forEach(
function(panel){

panel.classList.add(
"hidden"
);

}
);


button.classList.add(
"active"
);


document
.getElementById(
button.dataset.tab
)
.classList.remove(
"hidden"
);

}
);

}
);


// ========================================================
// LOADING
// ========================================================

function setLoading(value){

document
.getElementById("loading")
.classList.toggle(
"hidden",
!value
);


document
.getElementById("generateBtn")
.disabled = value;

}


// ========================================================
// ERROR
// ========================================================

function showError(message){

document
.getElementById("error")
.classList.remove(
"hidden"
);


document
.getElementById("errorText")
.textContent = message;

}


// ========================================================
// GENERATE
// ========================================================

async function generate(){

const prompt =
document
.getElementById("prompt")
.value
.trim();


const teacherName =
document
.getElementById("teacherName")
.value
.trim();


const selected =
[
...
document
.querySelectorAll(
".check input:checked"
)
]
.map(
x => x.id
);


if(!teacherName){

showError(
"กรุณากรอกชื่อครูผู้สอนก่อนครับ"
);

return;

}


if(!prompt){

showError(
"กรุณาพิมพ์หัวข้อที่ต้องการสอนครับ"
);

return;

}


if(!selected.length){

showError(
"กรุณาเลือกรูปแบบข้อสอบอย่างน้อย 1 แบบครับ"
);

return;

}


setLoading(true);


document
.getElementById("error")
.classList.add(
"hidden"
);


try{


const response =
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

prompt:

prompt,

teacher_name:

teacherName,

question_count:

Number(
document
.getElementById("count")
.value
),

question_types:

selected,

difficulty:

document
.getElementById("difficulty")
.value

})

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.detail ||
"เกิดข้อผิดพลาด"
);

}


currentData = data;


// ======================================================
// SAVE
// ======================================================

saveData(data);


// ======================================================
// RENDER
// ======================================================

render(data);


}
catch(error){

showError(
error.message ||
"เกิดข้อผิดพลาด"
);

}
finally{

setLoading(false);

}

}


// ========================================================
// SAVE DATA
// ========================================================

function saveData(data){

try{

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}
catch(error){

console.log(
"ไม่สามารถบันทึกข้อมูล:",
error
);

}

}


// ========================================================
// LOAD DATA
// ========================================================

function loadSavedData(){

try{

const saved =
localStorage.getItem(
STORAGE_KEY
);


if(!saved){

return;

}


const data =
JSON.parse(saved);


if(
data &&
data.summary &&
data.quiz
){

currentData = data;

render(
data,
false
);

}

}
catch(error){

console.log(
"โหลดข้อมูลเก่าไม่สำเร็จ:",
error
);

}

}


// ========================================================
// RENDER
// ========================================================

function render(
data,
scroll = true
){

document
.getElementById("error")
.classList.add(
"hidden"
);


document
.getElementById("result")
.classList.remove(
"hidden"
);


const summary =
data.summary || {};


document
.getElementById(
"summary"
)
.innerHTML = `

<span class="chip">
👨‍🏫 ${esc(
summary.teacher_name
)}
</span>

<span class="chip">
🎒 ${esc(
summary.grade
)}
</span>

<span class="chip">
📖 ${esc(
summary.subject
)}
</span>

<span class="chip">
✏️ ${esc(
summary.topic
)}
</span>

<span class="chip">
⏱️ ${esc(
summary.duration
)}
</span>

`;


// ======================================================
// LESSON
// ======================================================

const objectives =
data.lesson_plan?.objective || [];


const steps =
data.lesson_plan?.steps || [];


document
.getElementById("lesson")
.innerHTML = `

<h3>
1. จุดประสงค์การเรียนรู้
</h3>

<div class="item">

<ol>

${objectives
.map(
item =>
`<li>${esc(item)}</li>`
)
.join("")}

</ol>

</div>


<h3>
2. ขั้นตอนการจัดการเรียนรู้
</h3>

${steps
.map(
item =>
`

<div class="item">

<div class="question">

${esc(item.time)}
·
${esc(item.title)}

</div>

<div style="margin-top:7px">

${esc(item.detail)}

</div>

</div>

`
)
.join("")}


<h3>
3. การประเมินผล
</h3>

<div class="item">

${esc(
data.lesson_plan?.assessment
)}

</div>

`;


// ======================================================
// WORKSHEET
// ======================================================

const worksheet =
data.worksheet || [];


document
.getElementById("worksheet")
.innerHTML = `

<h3>
ใบงาน
</h3>

<p>
ชื่อ-สกุล ______________________________________
</p>

<p>
ชั้น __________ เลขที่ __________ วันที่ __________
</p>

<p>
<b>
คำชี้แจง
</b>
</p>

<p>
ให้นักเรียนตอบคำถามต่อไปนี้
</p>

${worksheet
.map(
item =>
`

<div class="item">

<div class="question">

ข้อ ${esc(item.no)}.
${esc(item.question)}

</div>

<div style="margin-top:16px">

คำตอบ:

</div>

<div style="
border-bottom:1px solid #aaa;
height:28px;
margin-bottom:10px;
"></div>

<div style="
border-bottom:1px solid #aaa;
height:28px;
"></div>

</div>

`
)
.join("")}

`;


// ======================================================
// QUIZ
// ======================================================

const quiz =
data.quiz || [];


document
.getElementById("quiz")
.innerHTML = `

<h3>
แบบทดสอบ ${quiz.length} ข้อ
</h3>

<p>
ชื่อ-สกุล ______________________________________
</p>

<p>
ชั้น __________ เลขที่ __________
</p>

<p>
<b>
คำชี้แจง:
</b>
ทำแบบทดสอบทุกข้อ
</p>

${quiz
.map(
item =>
`

<div class="item">

<span class="qtype">

${esc(
typeNames[item.type] ||
item.type
)}

</span>

<div
style="
margin-top:9px;
font-weight:800;
"
>

ข้อ ${esc(item.no)}.
${esc(item.question)}

</div>

${
item.options &&
item.options.length

?

`

<ol type="A">

${item.options
.map(
option =>
`<li>${esc(option)}</li>`
)
.join("")}

</ol>

`

:

`

<div style="
margin-top:18px;
border-bottom:1px solid #aaa;
height:28px;
"></div>

`
}

</div>

`
)
.join("")}

`;


// ======================================================
// ANSWER
// ======================================================

document
.getElementById("answer")
.innerHTML = `

<h3>
เฉลยใบงาน
</h3>

${worksheet
.map(
item =>
`

<div class="item">

<b>
ข้อ ${esc(item.no)}
</b>

—

${esc(item.answer)}

</div>

`
)
.join("")}


<h3>
เฉลยแบบทดสอบ
</h3>

${quiz
.map(
item =>
`

<div class="item">

<b>
ข้อ ${esc(item.no)}
</b>

—

${esc(item.answer)}

<div style="
color:#6f7890;
margin-top:6px;

// ========================================================
// DOWNLOAD PDF
// ========================================================

async function downloadPDF(){

if(!currentData){

showError(
"ยังไม่มีชุดการสอนสำหรับสร้าง PDF"
);

return;

}


const button =
document.getElementById(
"pdfBtn"
);


button.disabled = true;

button.textContent =
"⏳ กำลังสร้าง PDF...";


try{


const response =
await fetch(
"/api/pdf?section=all",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify(
currentData
)

}
);


if(!response.ok){

let message =
"สร้าง PDF ไม่สำเร็จ";


try{

const data =
await response.json();

message =
data.detail ||
message;

}
catch(e){}


throw new Error(
message
);

}


const blob =
await response.blob();


const url =
URL.createObjectURL(
blob
);


const link =
document.createElement("a");


link.href = url;


const teacher =
currentData
.summary
.teacher_name
|| "ครู";


const topic =
currentData
.summary
.topic
|| "เอกสาร";


link.download =
`${teacher}-${topic}.pdf`;


document
.body
.appendChild(link);


link.click();


link.remove();


URL.revokeObjectURL(
url
);


}
catch(error){

showError(
error.message
);

}
finally{

button.disabled = false;

button.textContent =
"📄 บันทึก PDF";

}

}
