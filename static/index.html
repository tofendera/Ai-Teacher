<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff8ed"
>

<title>จัดทำชุดการสอน</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --bg:#fff8ed;

  --card:#ffffff;

  --ink:#27324a;

  --muted:#6f7890;

  --primary:#6c63ff;

  --primary2:#5148e8;

  --line:#e9e5dc;

  --blue:#e3f0ff;

  --mint:#dff8ee;

  --danger:#ffe7e7;

  --danger-text:#9d2929;

}


/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{

  font-size:18px;

  -webkit-text-size-adjust:100%;

  scroll-behavior:smooth;
}

body{

  margin:0;

  background:
    linear-gradient(
      180deg,
      #fff8ed 0%,
      #f7f5ff 100%
    );

  color:var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    sans-serif;

  font-size:18px;

  line-height:1.65;

  -webkit-font-smoothing:antialiased;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

  width:min(
    1000px,
    94%
  );

  margin:0 auto;

  padding-bottom:40px;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  padding:
    24px 0 12px;

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:12px;
}

.brand{

  font-size:25px;

  font-weight:800;

  line-height:1.3;
}

.badge{

  flex-shrink:0;

  font-size:15px;

  background:
    var(--mint);

  padding:
    8px 14px;

  border-radius:
    999px;

  font-weight:800;
}


/* =====================================================
   HERO
===================================================== */

.hero{

  text-align:center;

  padding:
    34px 0 28px;
}

.hero h1{

  font-size:
    clamp(
      38px,
      8vw,
      54px
    );

  line-height:1.25;

  margin:
    0 0 12px;

  font-weight:800;

  letter-spacing:-.5px;
}

.hero p{

  color:
    var(--muted);

  margin:0 auto;

  max-width:760px;

  font-size:20px;

  line-height:1.7;
}


/* =====================================================
   CARD
===================================================== */

.card{

  background:
    var(--card);

  border:
    1px solid var(--line);

  border-radius:26px;

  padding:25px;

  box-shadow:
    0 12px 30px
    rgba(
      49,
      55,
      85,
      .09
    );

  margin:
    20px 0;
}


/* =====================================================
   LABEL
===================================================== */

.label{

  display:block;

  margin-bottom:12px;

  font-size:21px;

  line-height:1.5;

  font-weight:800;
}


/* =====================================================
   PROMPT
===================================================== */

.prompt{

  display:block;

  width:100%;

  min-height:145px;

  border:
    2px solid #e8e4f8;

  border-radius:20px;

  padding:17px;

  resize:vertical;

  outline:none;

  background:#fcfbff;

  color:var(--ink);

  font-family:inherit;

  font-size:19px;

  line-height:1.65;

  appearance:none;

  -webkit-appearance:none;
}

.prompt:focus{

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(
      108,
      99,
      255,
      .10
    );
}

.prompt::placeholder{

  color:#a0a0a0;

  font-size:17px;
}


/* =====================================================
   EXAMPLES
===================================================== */

.examples{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:13px;
}

.example{

  border:0;

  background:
    #f4f2ff;

  color:
    #5148e8;

  border-radius:
    999px;

  padding:
    10px 15px;

  font-family:inherit;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.example:active{

  transform:scale(.98);
}


/* =====================================================
   GRID
===================================================== */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:16px;
}


/* =====================================================
   FIELD
===================================================== */

.field{

  background:
    #faf9f5;

  border:
    1px solid var(--line);

  padding:18px;

  border-radius:20px;
}

.field .label{

  margin-bottom:8px;
}

.field input,
.field select{

  display:block;

  width:100%;

  min-height:34px;

  border:0;

  background:transparent;

  outline:none;

  color:var(--ink);

  font-family:inherit;

  font-size:19px;

  font-weight:700;

  line-height:1.5;

  appearance:auto;
}

.field input::placeholder{

  color:#999;

  font-size:17px;

  font-weight:500;
}

.field input:focus{

  outline:none;
}


/* =====================================================
   TYPES
===================================================== */

.types{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:13px;
}

.check{

  position:relative;
}

.check input{

  position:absolute;

  opacity:0;

  pointer-events:none;
}

.check label{

  display:block;

  padding:18px;

  border:
    2px solid var(--line);

  border-radius:18px;

  font-size:19px;

  line-height:1.4;

  font-weight:800;

  cursor:pointer;

  user-select:none;

  -webkit-tap-highlight-color:transparent;
}

.check input:checked + label{

  border-color:
    var(--primary);

  background:
    #f0efff;

  color:
    #5148e8;

  box-shadow:
    0 3px 10px
    rgba(
      108,
      99,
      255,
      .08
    );
}


/* =====================================================
   PRIMARY BUTTON
===================================================== */

.primary{

  display:block;

  width:100%;

  border:0;

  border-radius:20px;

  padding:19px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:#fff;

  font-family:inherit;

  font-weight:800;

  font-size:21px;

  line-height:1.4;

  cursor:pointer;

  box-shadow:
    0 10px 22px
    rgba(
      108,
      99,
      255,
      .25
    );

  -webkit-tap-highlight-color:transparent;
}

.primary:active{

  transform:scale(.99);
}

.primary:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;
}

.note{

  text-align:center;

  color:
    var(--muted);

  font-size:16px;

  line-height:1.6;

  margin-top:12px;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

  display:none !important;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  text-align:center;

  padding:
    42px 25px;
}

.loading h3{

  margin:
    10px 0 5px;

  font-size:24px;

  line-height:1.5;
}

.loading p{

  margin:0;

  color:
    var(--muted);

  font-size:18px;

  line-height:1.7;
}

.spinner{

  font-size:46px;

  line-height:1;

  animation:
    bounce 1s infinite alternate;
}

@keyframes bounce{

  to{

    transform:
      translateY(-8px);

  }

}


/* =====================================================
   ERROR
===================================================== */

.error{

  background:
    var(--danger);

  color:
    var(--danger-text);

  padding:17px;

  border-radius:18px;

  font-size:18px;

  line-height:1.7;

  white-space:pre-wrap;

  word-break:break-word;
}


/* =====================================================
   SAVED
===================================================== */

.saved{

  background:
    var(--mint);

  color:
    #28704e;

  padding:16px;

  border-radius:18px;

  font-size:17px;

  line-height:1.6;
}


/* =====================================================
   RESULT HEADER
===================================================== */

.result-head{

  display:flex;

  justify-content:
    space-between;

  gap:15px;

  align-items:flex-start;
}

.result-head h2{

  margin:0;

  font-size:28px;

  line-height:1.4;
}


/* =====================================================
   CHIPS
===================================================== */

.chips{

  display:flex;

  gap:9px;

  flex-wrap:wrap;

  margin-top:10px;
}

.chip{

  padding:
    9px 13px;

  border-radius:
    999px;

  background:
    var(--blue);

  font-size:15px;

  line-height:1.4;

  font-weight:800;
}


/* =====================================================
   TABS
===================================================== */

.tabs{

  display:flex;

  gap:9px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:
    4px 2px 9px;

  margin-top:20px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.tabs::-webkit-scrollbar{

  display:none;
}

.tab{

  flex-shrink:0;

  white-space:nowrap;

  border:0;

  background:
    #f2f1ee;

  border-radius:14px;

  padding:
    12px 16px;

  font-family:inherit;

  font-size:17px;

  line-height:1.4;

  font-weight:800;

  color:
    var(--muted);

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.tab.active{

  background:
    #5148e8;

  color:#fff;

  box-shadow:
    0 5px 12px
    rgba(
      81,
      72,
      232,
      .18
    );
}


/* =====================================================
   PANEL
===================================================== */

.panel{

  font-size:19px;

  line-height:1.85;

  padding-top:8px;
}

.panel h3{

  margin:
    24px 0 12px;

  font-size:25px;

  line-height:1.5;

  font-weight:800;
}

.panel h3:first-child{

  margin-top:10px;
}


/* =====================================================
   LESSON CONTENT
===================================================== */

.lesson-section{

  margin:
    0 0 24px;
}

.lesson-paragraph{

  margin:
    0 0 13px;

  text-align:left;

  line-height:1.9;
}

.lesson-paragraph + .lesson-paragraph{

  text-indent:1.5em;
}

.objective-item{

  margin:
    10px 0;

  padding:
    13px 15px;

  background:
    #faf9f5;

  border:
    1px solid var(--line);

  border-radius:
    16px;

  line-height:1.8;
}


/* =====================================================
   RESULT ITEM
===================================================== */

.item{

  padding:18px;

  border:
    1px solid var(--line);

  border-radius:18px;

  margin:13px 0;

  background:#fff;

  font-size:19px;

  line-height:1.85;
}

.item strong,
.item b{

  font-weight:800;
}

.item-option{

  margin:
    6px 0 0 20px;

  line-height:1.7;
}

.answer-line{

  margin-top:13px;

  padding-top:10px;

  border-top:
    1px dashed #ddd8ce;

  color:
    #555e73;
}


/* =====================================================
   STEPS
===================================================== */

.step-title{

  font-size:20px;

  line-height:1.5;

  font-weight:800;

  margin-bottom:7px;
}

.step-detail{

  line-height:1.9;
}


/* =====================================================
   PDF BUTTONS
===================================================== */

.pdfs{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

  margin-top:18px;
}

.pdfbtn{

  display:block;

  text-align:center;

  text-decoration:none;

  border:
    2px solid #e7e3f6;

  background:#fff;

  color:
    #5148e8;

  border-radius:16px;

  padding:15px;

  font-family:inherit;

  font-size:17px;

  line-height:1.5;

  font-weight:800;

  transition:
    .15s ease;
}

.pdfbtn:active{

  transform:scale(.98);

  background:#f7f5ff;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-top:18px;
}

.secondary{

  border:
    2px solid #e7e3f6;

  background:#fff;

  color:
    #5148e8;

  border-radius:17px;

  padding:15px;

  font-family:inherit;

  font-size:17px;

  line-height:1.5;

  font-weight:800;

  cursor:pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  html{

    font-size:18px;
  }

  body{

    font-size:18px;
  }

  .container{

    width:94%;

    padding-bottom:30px;
  }

  .header{

    padding:
      20px 0 12px;
  }

  .brand{

    font-size:24px;
  }

  .badge{

    font-size:15px;

    padding:
      8px 13px;
  }

  .hero{

    padding:
      28px 0 23px;
  }

  .hero h1{

    font-size:39px;

    line-height:1.3;
  }

  .hero p{

    font-size:19px;

    line-height:1.75;
  }

  .card{

    padding:20px;

    border-radius:24px;

    margin:
      18px 0;
  }

  .label{

    font-size:21px;
  }

  .prompt{

    min-height:145px;

    font-size:19px;

    padding:17px;
  }

  .prompt::placeholder{

    font-size:17px;
  }

  .grid{

    grid-template-columns:
      1fr;
  }

  .field{

    padding:18px;
  }

  .field input,
  .field select{

    font-size:19px;
  }

  .types{

    grid-template-columns:
      1fr;
  }

  .check label{

    font-size:19px;

    padding:18px;
  }

  .primary{

    font-size:21px;

    padding:19px;
  }

  .panel{

    font-size:19px;

    line-height:1.85;
  }

  .panel h3{

    font-size:24px;

    margin-top:26px;
  }

  .item{

    font-size:18px;

    padding:17px;

    line-height:1.85;
  }

  .pdfs{

    grid-template-columns:
      1fr;
  }

  .actions{

    grid-template-columns:
      1fr;
  }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:390px){

  .container{

    width:93%;
  }

  .card{

    padding:17px;
  }

  .hero h1{

    font-size:35px;
  }

  .hero p{

    font-size:18px;
  }

  .brand{

    font-size:22px;
  }

  .label{

    font-size:20px;
  }

  .prompt{

    font-size:18px;
  }

  .panel{

    font-size:18px;
  }

  .panel h3{

    font-size:23px;
  }

}


/* =====================================================
   PRINT
===================================================== */

@media print{

  body{

    background:#fff;
  }

  .header,
  .hero,
  #builder,
  #loading,
  #error,
  .pdfs,
  .actions,
  .tabs,
  #saved{

    display:none !important;
  }

  .card{

    border:0;

    box-shadow:none;

    margin:0;

    padding:0;
  }

  .container{

    width:100%;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="brand">
    📚 ชุดการสอน
  </div>

  <div class="badge">
    V1.5
  </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

  <h1>
    สอนอะไรวันนี้? ✨
  </h1>

  <p>
    พิมพ์หัวข้อ แล้วสร้างแผนการสอน
    ใบงาน แบบทดสอบ และเฉลย
  </p>

</section>


<!-- =====================================================
     BUILDER
===================================================== -->

<section
  class="card"
  id="builder"
>

  <label class="label">
    👋 วันนี้คุณอยากสอนอะไร?
  </label>

  <textarea
    id="prompt"
    class="prompt"
    placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
  ></textarea>


  <div class="examples">

    <button
      type="button"
      class="example"
      onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
    >
      🧮 เศษส่วน ป.4
    </button>

    <button
      type="button"
      class="example"
      onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
    >
      🌎 ระบบสุริยะ ป.5
    </button>

    <button
      type="button"
      class="example"
      onclick="fillExample('Animals ป.3 30 นาที')"
    >
      🇬🇧 Animals ป.3
    </button>

  </div>

</section>


<!-- =====================================================
     SETTINGS
===================================================== -->

<section class="card">

  <div class="grid">


    <!-- TEACHER -->

    <div class="field">

      <label class="label">
        👨‍🏫 ชื่อครู
      </label>

      <input
        id="teacher"
        type="text"
        placeholder="เช่น สมปอง เข้ามา"
        autocomplete="name"
      >

    </div>


    <!-- QUESTION COUNT -->

    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>

      <select id="count">

        <option value="5">
          5
        </option>

        <option
          value="10"
          selected
        >
          10
        </option>

        <option value="15">
          15
        </option>

        <option value="20">
          20
        </option>

        <option value="30">
          30
        </option>

      </select>

    </div>


    <!-- DIFFICULTY -->

    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option
          value="mixed"
          selected
        >
          ผสม
        </option>

      </select>

    </div>

  </div>


  <!-- QUESTION TYPES -->

  <div style="margin-top:22px">

    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
        style="
          color:#6f7890;
          font-weight:500;
          font-size:16px;
        "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">


      <div class="check">

        <input
          type="checkbox"
          id="multiple_choice"
          checked
        >

        <label
          for="multiple_choice"
        >
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="fill_blank"
        >

        <label
          for="fill_blank"
        >
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="calculation"
        >

        <label
          for="calculation"
        >
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="application"
        >

        <label
          for="application"
        >
          💡 ประยุกต์ใช้
        </label>

      </div>


    </div>

  </div>


  <!-- GENERATE -->

  <div style="margin-top:22px">

    <button
      id="generateBtn"
      class="primary"
      type="button"
      onclick="generate()"
    >
      ✨ สร้างชุดการสอน
    </button>


    <div class="note">

      แผนการสอน + ใบงาน +
      แบบทดสอบ + เฉลย

    </div>

  </div>

</section>


<!-- =====================================================
     LOADING
===================================================== -->

<section
  id="loading"
  class="card loading hidden"
>

  <div class="spinner">
    ✨
  </div>

  <h3>
    กำลังสร้างชุดการสอน...
  </h3>

  <p>
    กำลังสร้างแผนการสอน ใบงาน
    แบบทดสอบ และไฟล์ PDF
  </p>

</section>


<!-- =====================================================
     ERROR
===================================================== -->

<section
  id="error"
  class="card hidden"
>

  <div
    class="error"
    id="errorText"
  ></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section
  id="result"
  class="card hidden"
>


  <div class="result-head">

    <div>

      <h2>
        🎉 ชุดการสอนพร้อมแล้ว
      </h2>

      <div
        id="summary"
        class="chips"
      ></div>

    </div>

  </div>


  <!-- SAVED -->

  <div
    id="saved"
    class="saved hidden"
    style="margin-top:14px"
  >
    💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
  </div>


  <!-- ===================================================
       TABS
  =================================================== -->

  <div class="tabs">


    <button
      type="button"
      class="tab active"
      data-tab="lesson"
    >
      📚 แผนการสอน
    </button>


    <button
      type="button"
      class="tab"
      data-tab="worksheet"
    >
      📝 ใบงาน
    </button>


    <button
      type="button"
      class="tab"
      data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>


    <button
      type="button"
      class="tab"
      data-tab="answer"
    >
      ✅ เฉลย
    </button>


  </div>


  <!-- ===================================================
       PANELS
  =================================================== -->

  <div
    id="lesson"
    class="panel"
  ></div>


  <div
    id="worksheet"
    class="panel hidden"
  ></div>


  <div
    id="quiz"
    class="panel hidden"
  ></div>


  <div
    id="answer"
    class="panel hidden"
  ></div>


  <!-- ===================================================
       PDF
  =================================================== -->

  <div
    id="pdfs"
    class="pdfs"
  ></div>


  <!-- ===================================================
       ACTIONS
  =================================================== -->

  <div class="actions">

    <button
      type="button"
      class="secondary"
      onclick="window.print()"
    >
      🖨️ พิมพ์
    </button>


    <button
      type="button"
      class="secondary"
      onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>

  </div>


</section>


</div>


<script>

/* ========================================================
   GLOBAL
======================================================== */

let currentData = null;


/* ========================================================
   HELPER
======================================================== */

const $ = id =>
  document.getElementById(id);


/* ========================================================
   FILL EXAMPLE
======================================================== */

function fillExample(value){

  $("prompt").value = value;

  $("prompt").focus();

}


/* ========================================================
   ESCAPE HTML
======================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* ========================================================
   NORMALIZE ARRAY
======================================================== */

function arr(value){

  if(Array.isArray(value)){
    return value;
  }

  if(value === null || value === undefined){
    return [];
  }

  if(typeof value === "string"){

    return value.trim()
      ? [value]
      : [];

  }

  return [value];

}


/* ========================================================
   SHOW ERROR
======================================================== */

function showError(text){

  $("error")
    .classList
    .remove("hidden");


  $("errorText").textContent =
    typeof text === "object"
      ? JSON.stringify(
          text,
          null,
          2
        )
      : String(text);


  $("error")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}


/* ========================================================
   LOADING
======================================================== */

function setLoading(value){

  $("loading")
    .classList
    .toggle(
      "hidden",
      !value
    );


  $("generateBtn")
    .disabled = value;


  if(value){

    /*
     * เลื่อนให้ผู้ใช้เห็นทันทีว่า
     * ระบบกำลังสร้างไฟล์อยู่
     */

    setTimeout(() => {

      $("loading")
        .scrollIntoView({

          behavior:"smooth",

          block:"center"

        });

    },80);

  }

}


/* ========================================================
   TABS
======================================================== */

document
  .querySelectorAll(".tab")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".tab")
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          document
            .querySelectorAll(".panel")
            .forEach(
              p =>
                p.classList.add(
                  "hidden"
                )
            );


          button.classList.add(
            "active"
          );


          const target =
            $(button.dataset.tab);


          if(target){

            target.classList.remove(
              "hidden"
            );

          }

        }
      );

    }
  );


/* ========================================================
   LOCAL STORAGE
======================================================== */

function saveLocal(data){

  try{

    localStorage.setItem(

      "ai_teacher_v15_data",

      JSON.stringify(data)

    );

  }
  catch(e){

    console.warn(
      "ไม่สามารถบันทึก localStorage",
      e
    );

  }

}


function loadLocal(){

  try{

    const x =
      localStorage.getItem(
        "ai_teacher_v15_data"
      );


    return x
      ? JSON.parse(x)
      : null;

  }
  catch(e){

    return null;

  }

}


/* ========================================================
   GENERATE
======================================================== */

async function generate(){


  const prompt =
    $("prompt")
      .value
      .trim();


  const teacher =
    $("teacher")
      .value
      .trim();


  const selected = [

    ...document
      .querySelectorAll(
        ".check input:checked"
      )

  ]
  .map(
    x => x.id
  );


  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    return;

  }


  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  $("error")
    .classList
    .add("hidden");


  $("result")
    .classList
    .add("hidden");


  setLoading(true);


  try{


    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              prompt:

                prompt,

              teacher_name:

                teacher,

              question_count:

                Number(
                  $("count").value
                ),

              question_types:

                selected,

              difficulty:

                $("difficulty").value

            })

        }
      );


    let data;


    try{

      data =
        await response.json();

    }
    catch(e){

      throw new Error(
        "เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ถูกต้อง"
      );

    }


    if(!response.ok){

      throw new Error(
        data.detail ||
        "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
      );

    }


    if(!data){

      throw new Error(
        "ไม่พบข้อมูลที่สร้าง"
      );

    }


    currentData =
      data;


    saveLocal(
      data
    );


    render(
      data
    );


  }
  catch(error){

    console.error(
      error
    );


    showError(
      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่"
    );

  }
  finally{

    setLoading(
      false
    );

  }

}


/* ========================================================
   RENDER
======================================================== */

function render(data){


  $("error")
    .classList
    .add("hidden");


  $("result")
    .classList
    .remove("hidden");


  $("saved")
    .classList
    .remove("hidden");


  /* ======================================================
     SUMMARY
  ====================================================== */

  const summary =
    data.summary || {};


  $("summary")
    .innerHTML = `

      <span class="chip">
        🎒 ${esc(summary.grade || "ไม่ระบุ")}
      </span>

      <span class="chip">
        📖 ${esc(summary.subject || "ไม่ระบุ")}
      </span>

      <span class="chip">
        ✏️ ${esc(summary.topic || "")}
      </span>

      <span class="chip">
        ⏱️ ${esc(summary.duration || "")}
      </span>

      ${
        summary.teacher
        ?
        `
        <span class="chip">
          👨‍🏫 ${esc(summary.teacher)}
        </span>
        `
        :
        ""
      }

    `;


  /* ======================================================
     LESSON
  ====================================================== */

  renderLesson(
    data.lesson_plan || {}
  );


  /* ======================================================
     WORKSHEET
  ====================================================== */

  renderWorksheet(
    data.worksheet || []
  );


  /* ======================================================
     QUIZ
  ====================================================== */

  renderQuiz(
    data.quiz || []
  );


  /* ======================================================
     ANSWER
  ====================================================== */

  renderAnswer(
    data
  );


  /* ======================================================
     PDF
  ====================================================== */

  renderPDFs(
    data.pdf || {}
  );


  /* ======================================================
     DEFAULT TAB
  ====================================================== */

  document
    .querySelectorAll(".tab")
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  document
    .querySelector(
      '.tab[data-tab="lesson"]'
    )
    .classList
    .add("active");


  document
    .querySelectorAll(".panel")
    .forEach(
      p =>
        p.classList.add(
          "hidden"
        )
    );


  $("lesson")
    .classList
    .remove("hidden");


  /* ======================================================
     SCROLL RESULT
  ====================================================== */

  setTimeout(() => {

    $("result")
      .scrollIntoView({

        behavior:"smooth",

        block:"start"

      });

  },120);

}


/* ========================================================
   RENDER LESSON
======================================================== */

function renderLesson(lesson){

  const objectives =
    arr(
      lesson.objective
    );


  const content =
    arr(
      lesson.content ||
      lesson.material
    );


  const keyPoints =
    arr(
      lesson.key_points ||
      lesson.important
    );


  const examples =
    arr(
      lesson.examples
    );


  const steps =
    arr(
      lesson.steps
    );


  const assessment =
    String(
      lesson.assessment ||
      ""
    ).trim();


  let html = "";


  /* ------------------------------------------------------
     OBJECTIVE
  ------------------------------------------------------ */

  html += `

    <div class="lesson-section">

      <h3>
        1. จุดประสงค์การเรียนรู้
      </h3>

  `;


  if(objectives.length){

    html += objectives
      .map(
        x => `

          <div class="objective-item">
            ${esc(
              typeof x === "object"
                ? JSON.stringify(x)
                : x
            )}
          </div>

        `
      )
      .join("");

  }
  else{

    html += `

      <div class="lesson-paragraph">
        ผู้เรียนสามารถอธิบายความรู้สำคัญ
        และนำความรู้ไปใช้ได้อย่างเหมาะสม
      </div>

    `;

  }


  html += `
    </div>
  `;


  /* ------------------------------------------------------
     CONTENT
  ------------------------------------------------------ */

  html += `

    <div class="lesson-section">

      <h3>
        2. เนื้อหาที่ใช้สอน
      </h3>

  `;


  if(content.length){

    html += content
      .map(
        x => `

          <p class="lesson-paragraph">
            ${esc(
              typeof x === "object"
                ? (
                    x.content ||
                    x.text ||
                    JSON.stringify(x)
                  )
                : x
            )}
          </p>

        `
      )
      .join("");

  }
  else{

    html += `

      <p class="lesson-paragraph">
        ระบบยังไม่ได้รับข้อมูลเนื้อหาสำหรับหัวข้อนี้
      </p>

    `;

  }


  html += `
    </div>
  `;


  /* ------------------------------------------------------
     KEY POINT
  ------------------------------------------------------ */

  html += `

    <div class="lesson-section">

      <h3>
        สาระสำคัญ
      </h3>

  `;


  if(keyPoints.length){

    html += keyPoints
      .map(
        x => `

          <p class="lesson-paragraph">
            ${esc(
              typeof x === "object"
                ? (
                    x.content ||
                    x.text ||
                    JSON.stringify(x)
                  )
                : x
            )}
          </p>

        `
      )
      .join("");

  }
  else{

    html += `

      <p class="lesson-paragraph">
        เนื้อหาส่วนนี้ใช้สรุปแนวคิดสำคัญ
        ที่ผู้เรียนควรเข้าใจหลังจบบทเรียน
      </p>

    `;

  }


  html += `
    </div>
  `;


  /* ------------------------------------------------------
     EXAMPLES
  ------------------------------------------------------ */

  if(examples.length){

    html += `

      <div class="lesson-section">

        <h3>
          ตัวอย่างสำหรับใช้สอน
        </h3>

    `;


    html += examples
      .map(
        x => `

          <p class="lesson-paragraph">
            ${esc(
              typeof x === "object"
                ? (
                    x.content ||
                    x.text ||
                    JSON.stringify(x)
                  )
                : x
            )}
          </p>

        `
      )
      .join("");


    html += `
      </div>
    `;

  }


  /* ------------------------------------------------------
     STEPS
  ------------------------------------------------------ */

  html += `

    <div class="lesson-section">

      <h3>
        3. ขั้นตอนการจัดการเรียนรู้
      </h3>

  `;


  if(steps.length){

    html += steps
      .map(
        (step,index) => {

          if(typeof step === "string"){

            return `

              <div class="item">

                <div class="step-title">
                  ${index + 1}. ขั้นตอน
                </div>

                <div class="step-detail">
                  ${esc(step)}
                </div>

              </div>

            `;

          }


          return `

            <div class="item">

              <div class="step-title">

                ${
                  esc(
                    step.time || ""
                  )
                }

                ${
                  step.time
                    ? " · "
                    : ""
                }

                ${
                  esc(
                    step.title ||
                    `ขั้นตอนที่ ${index + 1}`
                  )
                }

              </div>

              <div class="step-detail">

                ${esc(
                  step.detail ||
                  step.description ||
                  ""
                )}

              </div>

            </div>

          `;

        }
      )
      .join("");

  }
  else{

    html += `

      <div class="lesson-paragraph">
        ไม่พบรายละเอียดขั้นตอนการจัดการเรียนรู้
      </div>

    `;

  }


  html += `
    </div>
  `;


  /* ------------------------------------------------------
     ASSESSMENT
  ------------------------------------------------------ */

  html += `

    <div class="lesson-section">

      <h3>
        4. การประเมินผล
      </h3>

      <p class="lesson-paragraph">

        ${
          esc(
            assessment ||
            "ประเมินจากการมีส่วนร่วม การตอบคำถาม การทำใบงาน และผลการทำแบบทดสอบ"
          )
        }

      </p>

    </div>

  `;


  $("lesson")
    .innerHTML = html;

}


/* ========================================================
   RENDER WORKSHEET
======================================================== */

function renderWorksheet(worksheet){

  let html = `

    <h3>
      ใบงาน
    </h3>

  `;


  if(!worksheet.length){

    html += `

      <div class="item">
        ยังไม่มีข้อมูลใบงาน
      </div>

    `;

    $("worksheet")
      .innerHTML = html;

    return;

  }


  html += worksheet
    .map(
      (x,i) => {

        const question =
          typeof x === "object"
            ? x.question || ""
            : String(x);


        const options =
          typeof x === "object"
            ? arr(x.options)
            : [];


        return `

          <div class="item">

            <b>
              ${i + 1}. ${esc(question)}
            </b>

            ${
              options.length
              ?
              options
                .map(
                  (o,j) => `

                    <div class="item-option">

                      ${
                        [
                          "ก.",
                          "ข.",
                          "ค.",
                          "ง.",
                          "จ."
                        ][j] || ""
                      }

                      ${esc(o)}

                    </div>

                  `
                )
                .join("")
              :
              ""
            }


            <div class="answer-line">

              คำตอบ
              ........................................................................

            </div>

          </div>

        `;

      }
    )
    .join("");


  $("worksheet")
    .innerHTML = html;

}


/* ========================================================
   RENDER QUIZ
======================================================== */

function renderQuiz(quiz){

  let html = `

    <h3>
      แบบทดสอบ ${quiz.length} ข้อ
    </h3>

  `;


  if(!quiz.length){

    html += `

      <div class="item">
        ยังไม่มีข้อมูลแบบทดสอบ
      </div>

    `;

    $("quiz")
      .innerHTML = html;

    return;

  }


  html += quiz
    .map(
      (x,i) => {

        const question =
          typeof x === "object"
            ? x.question || ""
            : String(x);


        const options =
          typeof x === "object"
            ? arr(x.options)
            : [];


        return `

          <div class="item">

            <b>
              ${i + 1}. ${esc(question)}
            </b>


            ${
              options.length
              ?
              options
                .map(
                  (o,j) => `

                    <div class="item-option">

                      ${
                        [
                          "ก.",
                          "ข.",
                          "ค.",
                          "ง.",
                          "จ."
                        ][j] || ""
                      }

                      ${esc(o)}

                    </div>

                  `
                )
                .join("")
              :
              ""
            }

          </div>

        `;

      }
    )
    .join("");


  $("quiz")
    .innerHTML = html;

}


/* ========================================================
   RENDER ANSWER
======================================================== */

function renderAnswer(data){

  const worksheet =
    arr(
      data.worksheet
    );


  const quiz =
    arr(
      data.quiz
    );


  let html = "";


  /* ------------------------------------------------------
     WORKSHEET ANSWERS
  ------------------------------------------------------ */

  html += `

    <h3>
      เฉลยใบงาน
    </h3>

  `;


  if(worksheet.length){

    html += worksheet
      .map(
        (x,i) => {

          const answer =
            typeof x === "object"
              ? x.answer || ""
              : "";


          return `

            <div class="item">

              <b>
                ${i + 1}. ${esc(answer)}
              </b>

            </div>

          `;

        }
      )
      .join("");

  }
  else{

    html += `

      <div class="item">
        ยังไม่มีข้อมูลเฉลยใบงาน
      </div>

    `;

  }


  /* ------------------------------------------------------
     QUIZ ANSWERS
  ------------------------------------------------------ */

  html += `

    <h3>
      เฉลยแบบทดสอบ
    </h3>

  `;


  if(quiz.length){

    html += quiz
      .map(
        (x,i) => {

          const answer =
            typeof x === "object"
              ? x.answer || ""
              : "";


          const explanation =
            typeof x === "object"
              ? x.explanation || ""
              : "";


          return `

            <div class="item">

              <b>
                ${i + 1}. ${esc(answer)}
              </b>

              ${
                explanation
                ?
                `
                <div
                  style="
                    margin-top:8px;
                    color:#6f7890;
                  "
                >
                  ${esc(explanation)}
                </div>
                `
                :
                ""
              }

            </div>

          `;

        }
      )
      .join("");

  }
  else{

    html += `

      <div class="item">
        ยังไม่มีข้อมูลเฉลยแบบทดสอบ
      </div>

    `;

  }


  $("answer")
    .innerHTML = html;

}


/* ========================================================
   RENDER PDF
======================================================== */

function renderPDFs(pdf){

  const items = [

    [
      "📚 ดาวน์โหลดแผนการสอน",
      pdf.lesson_pdf
    ],

    [
      "📝 ดาวน์โหลดใบงาน",
      pdf.worksheet_pdf
    ],

    [
      "🧠 ดาวน์โหลดแบบทดสอบ",
      pdf.quiz_pdf
    ],

    [
      "✅ ดาวน์โหลดเฉลย",
      pdf.answer_pdf
    ]

  ];


  $("pdfs")
    .innerHTML = items
      .map(
        item => {

          if(!item[1]){

            return "";

          }


          return `

            <a
              class="pdfbtn"
              target="_blank"
              rel="noopener"
              href="${esc(item[1])}"
            >
              ${item[0]}
            </a>

          `;

        }
      )
      .join("");

}


/* ========================================================
   NEW PACK
======================================================== */

function newPack(){

  $("result")
    .classList
    .add("hidden");


  $("error")
    .classList
    .add("hidden");


  $("loading")
    .classList
    .add("hidden");


  $("prompt")
    .focus();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* ========================================================
   LOAD SAVED DATA
======================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const old =
      loadLocal();


    if(old){

      currentData =
        old;


      render(
        old
      );

    }

  }
);

</script>


</body>

</html>
