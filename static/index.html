<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff8ed"
>

<title>จัดทำชุดการสอน</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root {
  --bg: #fff8ed;
  --card: #ffffff;
  --ink: #27324a;
  --muted: #737b91;
  --primary: #6258e8;
  --primary-dark: #5148d8;
  --line: #e8e4dc;
  --soft: #f7f5ff;
  --mint: #dff7ed;
}


/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    linear-gradient(
      180deg,
      #fff8ed 0%,
      #f7f5ff 100%
    );

  color: var(--ink);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    sans-serif;

  font-size: 15px;
  line-height: 1.65;

  -webkit-text-size-adjust: 100%;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
  width: min(900px, 94%);
  margin: 0 auto;
  padding-bottom: 30px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  padding: 18px 0 5px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 20px;
  font-weight: 800;
}

.badge {
  background: var(--mint);

  padding: 6px 11px;

  border-radius: 999px;

  font-size: 12px;
  font-weight: 800;
}


/* =====================================================
   HERO
===================================================== */

.hero {
  text-align: center;
  padding: 25px 0 18px;
}

.hero h1 {
  margin: 0 0 8px;

  font-size:
    clamp(
      31px,
      7vw,
      44px
    );

  line-height: 1.2;
  font-weight: 800;
}

.hero p {
  margin: 0 auto;

  max-width: 650px;

  color: var(--muted);

  font-size: 16px;
  line-height: 1.6;
}


/* =====================================================
   CARD
===================================================== */

.card {
  background: var(--card);

  border:
    1px solid var(--line);

  border-radius: 23px;

  padding: 18px;

  margin: 15px 0;

  box-shadow:
    0 10px 28px
    rgba(45, 51, 80, .08);
}


/* =====================================================
   LABEL
===================================================== */

.label {
  display: block;

  margin-bottom: 8px;

  font-size: 16px;
  font-weight: 800;
}


/* =====================================================
   TEXTAREA
===================================================== */

.prompt {
  width: 100%;

  min-height: 105px;

  padding: 14px;

  resize: vertical;

  outline: none;

  border:
    2px solid #e7e3f7;

  border-radius: 17px;

  background: #fcfbff;

  color: var(--ink);

  font-family: inherit;

  font-size: 15px;

  line-height: 1.6;
}

.prompt:focus {
  border-color: var(--primary);
}


/* =====================================================
   EXAMPLE BUTTONS
===================================================== */

.examples {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 8px;
}

.example {
  border: 0;

  border-radius: 999px;

  padding:
    7px 11px;

  background: #f3f1ff;

  color: #5148d8;

  font-family: inherit;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;
}


/* =====================================================
   GRID
===================================================== */

.grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;
}


/* =====================================================
   FIELD
===================================================== */

.field {
  padding: 13px;

  border:
    1px solid var(--line);

  border-radius: 17px;

  background: #faf9f5;
}

.field input,
.field select {
  width: 100%;

  border: 0;

  outline: 0;

  background: transparent;

  color: var(--ink);

  font-family: inherit;

  font-size: 15px;

  font-weight: 700;
}

.field input::placeholder {
  color: #a3a3a3;
  font-weight: 500;
}


/* =====================================================
   QUESTION TYPES
===================================================== */

.types {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;
}

.check input {
  position: absolute;
  opacity: 0;
}

.check label {
  display: block;

  padding: 11px;

  border:
    2px solid var(--line);

  border-radius: 15px;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.check input:checked + label {
  border-color: var(--primary);

  background: var(--soft);

  color: #5148d8;
}


/* =====================================================
   PRIMARY BUTTON
===================================================== */

.primary {
  width: 100%;

  border: 0;

  border-radius: 17px;

  padding: 14px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  color: #fff;

  font-family: inherit;

  font-size: 17px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 8px 17px
    rgba(98, 88, 232, .23);
}

.primary:disabled {
  opacity: .6;
  cursor: wait;
}

.note {
  margin-top: 9px;

  text-align: center;

  color: var(--muted);

  font-size: 12px;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
  display: none !important;
}


/* =====================================================
   LOADING
===================================================== */

.loading {
  text-align: center;

  padding:
    27px 18px;
}

.spinner {
  font-size: 36px;

  animation:
    bounce 1s infinite alternate;
}

@keyframes bounce {
  to {
    transform: translateY(-7px);
  }
}

.loading h3 {
  margin:
    9px 0 3px;

  font-size: 19px;
}

.loading p {
  margin: 0;

  color: var(--muted);

  font-size: 14px;
}


/* =====================================================
   ERROR
===================================================== */

.error {
  padding: 13px;

  border-radius: 15px;

  background: #ffe7e7;

  color: #9d2929;

  font-size: 14px;

  white-space: pre-wrap;
}


/* =====================================================
   RESULT HEADER
===================================================== */

.result-head h2 {
  margin: 0;

  font-size: 22px;
}


/* =====================================================
   CHIPS
===================================================== */

.chips {
  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 7px;
}

.chip {
  padding:
    5px 9px;

  border-radius: 999px;

  background: #e8f2ff;

  font-size: 11px;

  font-weight: 800;
}


/* =====================================================
   SAVED
===================================================== */

.saved {
  margin-top: 10px;

  padding: 11px;

  border-radius: 15px;

  background: var(--mint);

  color: #28704e;

  font-size: 13px;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
  display: flex;

  gap: 7px;

  overflow-x: auto;

  margin-top: 15px;

  padding-bottom: 4px;

  -webkit-overflow-scrolling: touch;
}

.tab {
  flex: 0 0 auto;

  border: 0;

  border-radius: 11px;

  padding:
    8px 11px;

  background: #f1f0ed;

  color: var(--muted);

  font-family: inherit;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;
}

.tab.active {
  background: #5148d8;
  color: #fff;
}


/* =====================================================
   PANEL
===================================================== */

.panel {
  font-size: 15px;

  line-height: 1.75;
}

.panel h3 {
  margin:
    20px 0 9px;

  font-size: 19px;

  line-height: 1.4;

  font-weight: 800;
}

.panel h3:first-child {
  margin-top: 11px;
}


/* =====================================================
   ITEM
===================================================== */

.item {
  margin: 8px 0;

  padding: 12px;

  border:
    1px solid var(--line);

  border-radius: 15px;

  background: #fff;

  font-size: 15px;

  line-height: 1.75;
}

.item b {
  font-size: 15px;
}


/* =====================================================
   PDF DOWNLOAD
   เหลือเพียง 1 ปุ่ม
===================================================== */

.pdf-area {
  margin-top: 19px;
}

.download-all {
  display: flex;

  align-items: center;

  justify-content: center;

  width: 100%;

  min-height: 55px;

  border:
    2px solid #e5e1f5;

  border-radius: 16px;

  background: #fff;

  color: #5148d8;

  font-family: inherit;

  font-size: 16px;

  font-weight: 800;

  cursor: pointer;

  text-decoration: none;

  transition: .15s;
}

.download-all:active {
  transform: scale(.98);

  background: #f7f5ff;
}

.download-all:disabled {
  opacity: .6;

  cursor: wait;
}


/* =====================================================
   NEW PACK
===================================================== */

.actions {
  margin-top: 10px;
}

.secondary {
  width: 100%;

  border:
    2px solid #e5e1f5;

  border-radius: 16px;

  padding: 12px;

  background: #fff;

  color: #5148d8;

  font-family: inherit;

  font-size: 15px;

  font-weight: 800;

  cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

  .container {
    width: 94%;
  }

  .card {
    padding: 16px;
  }

  .grid,
  .types {
    grid-template-columns: 1fr;
  }

  .hero {
    padding-top: 22px;
  }

  .hero h1 {
    font-size: 33px;
  }

  .hero p {
    font-size: 15px;
  }

  .panel {
    font-size: 15px;
  }

  .panel h3 {
    font-size: 19px;
  }

  .item {
    font-size: 15px;
  }

  .download-all {
    font-size: 15px;
  }
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 390px) {

  .hero h1 {
    font-size: 30px;
  }

  .card {
    padding: 14px;
  }
}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
HEADER
===================================================== -->

<header class="header">

  <div class="brand">
    📚 ชุดการสอน
  </div>

  <div class="badge">

  </div>

</header>


<!-- =====================================================
HERO
===================================================== -->

<section class="hero">

  </h1>

  <p>

  </p>

</section>


<!-- =====================================================
BUILDER
===================================================== -->

<section

<!-- =====================================================
SETTINGS

<section class="card">

LOADING

<script>


/* =====================================================
   STATE
===================================================== */

let currentData = null;


/* =====================================================
   HELPER
===================================================== */

function $(id) {
  return document.getElementById(id);
}


/* =====================================================
   EXAMPLE
===================================================== */

function fillExample(value) {

  $("prompt").value = value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function (m) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m];

      }
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(text) {

  $("error")
    .classList
    .remove("hidden");

  $("errorText").textContent =
    typeof text === "object"
      ? JSON.stringify(
          text,
          null,
          2
        )
      : text;

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(value) {

  $("loading")
    .classList
    .toggle(
      "hidden",
      !value
    );


  $("generateBtn").disabled = value;


  /* =================================================
     สำคัญ:
     ตอนกดสร้าง ให้เลื่อนลงมาที่ Loading
  ================================================== */

  if (value) {

    setTimeout(
      function () {

        $("loading")
          .scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

      },
      50
    );

  }

}


/* =====================================================
   TABS
===================================================== */

document
  .querySelectorAll(".tab")
  .forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {


          document
            .querySelectorAll(".tab")
            .forEach(
              function (b) {
                b.classList.remove("active");
              }
            );


          document
            .querySelectorAll(".panel")
            .forEach(
              function (p) {
                p.classList.add("hidden");
              }
            );


          button.classList.add("active");


          const panel =
            $(button.dataset.tab);


          if (panel) {
            panel.classList.remove("hidden");
          }

        }
      );

    }
  );


/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveLocal(data) {

  try {

    localStorage.setItem(
      "ai_teacher_v15_data",
      JSON.stringify(data)
    );

  }
  catch (e) {

    console.warn(
      "ไม่สามารถบันทึกข้อมูล",
      e
    );

  }

}


function loadLocal() {

  try {

    const value =
      localStorage.getItem(
        "ai_teacher_v15_data"
      );


    return value
      ? JSON.parse(value)
      : null;

  }
  catch (e) {

    return null;

  }

}


/* =====================================================
   GENERATE
===================================================== */

async function generate() {


  const prompt =
    $("prompt")
      .value
      .trim();


  const teacher =
    $("teacher")
      .value
      .trim();


  const selected = [
    ...document
      .querySelectorAll(
        ".check input:checked"
      )
  ]
    .map(
      function (x) {
        return x.id;
      }
    );


  /* =================================================
     VALIDATE
  ================================================== */

  if (!prompt) {

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    $("prompt").focus();

    return;

  }


  if (!selected.length) {

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  /* =================================================
     RESET
  ================================================== */

  $("error")
    .classList
    .add("hidden");


  $("result")
    .classList
    .add("hidden");


  setLoading(true);


  /* =================================================
     API
  ================================================== */

  try {


    const response =
      await fetch(
        "/api/generate",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              prompt:
                prompt,

              teacher_name:
                teacher,

              question_count:
                +$("count").value,

              question_types:
                selected,

              difficulty:
                $("difficulty").value

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.detail ||
        "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์"
      );

    }


    if (!data) {

      throw new Error(
        "ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์"
      );

    }


    /* =================================================
       SAVE
    ================================================== */

    currentData = data;

    saveLocal(data);


    /* =================================================
       RENDER
    ================================================== */

    render(data);


  }
  catch (error) {

    console.error(error);

    showError(

/* =====================================================

===================================================== */

/*
  ใช้ data.pdf เดิมทั้ง 4 ตัว

  data.pdf.lesson_pdf
  data.pdf.worksheet_pdf
  data.pdf.quiz_pdf
  data.pdf.answer_pdf

  กดปุ่มเดียวแล้วสั่งดาวน์โหลดทั้ง 4
*/

async function downloadAllPDF() {


  if (!currentData) {

    showError(
      "ยังไม่มีชุดการสอนให้ดาวน์โหลด"
    );

    return;

  }


  const pdf =
    currentData.pdf || {};


  const files = [

    {
      name: "แผนการสอน.pdf",
      url: pdf.lesson_pdf
    },

    {
      name: "ใบงาน.pdf",
      url: pdf.worksheet_pdf
    },

    {
      name: "แบบทดสอบ.pdf",
      url: pdf.quiz_pdf
    },

    {
      name: "เฉลย.pdf",
      url: pdf.answer_pdf
    }

  ]
    .filter(
      function (file) {
        return !!file.url;
      }
    );


  if (!files.length) {

    showError(
      "ไม่พบไฟล์ PDF ในข้อมูลที่ระบบส่งกลับมา"
    );

    return;

  }


  const button =
    $("downloadAllBtn");


  button.disabled = true;


  button.textContent =
    "⏳ กำลังเตรียมไฟล์...";


  try {


    /*
      ดาวน์โหลดทีละไฟล์
      เพื่อไม่ให้เบราว์เซอร์ยิงพร้อมกันทั้งหมด
    */

    for (
      const file of files
    ) {

      await downloadOnePDF(
        file.url,
        file.name
      );


      /*
        เว้นช่วงเล็กน้อย
        ช่วยลดโอกาส Safari บล็อก
        การดาวน์โหลดหลายไฟล์
      */

      await sleep(500);

    }


    button.textContent =
      "✅ ดาวน์โหลดไฟล์ทั้งหมดแล้ว";


    await sleep(1200);


  }
  catch (error) {

    console.error(error);


    showError(
      "ไม่สามารถดาวน์โหลดไฟล์ PDF ได้\n\n" +
      (
        error.message ||
        "กรุณาลองใหม่อีกครั้ง"
      )
    );

  }
  finally {

    button.disabled = false;

    button.textContent =
      "📥 ดาวน์โหลดไฟล์ทั้งหมด";

  }

}


/* =====================================================
   DOWNLOAD ONE PDF
===================================================== */

async function downloadOnePDF(
  url,
  filename
) {


  /*
    ถ้า URL เป็นของเว็บเดียวกัน
    ให้ fetch แล้วสร้าง Blob
  */

  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "ดาวน์โหลด " +
      filename +
      " ไม่สำเร็จ"
    );

  }


  const blob =
    await response.blob();


  const blobUrl =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    blobUrl;


  a.download =
    filename;


  a.style.display =
    "none";


  document.body.appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function () {

      URL.revokeObjectURL(
        blobUrl
      );

    },
    1000
  );

}


/* =====================================================
   SLEEP
===================================================== */

function sleep(ms) {

  return new Promise(
    function (resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}

}
