<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
  http-equiv="Cache-Control"
  content="no-cache, no-store, must-revalidate"
/>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>ชุดการสอน AI</title>

<!-- PDF-LIB ใช้รวม PDF 4 ไฟล์เป็น PDF เดียว -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #faf8f0;
  color: #27324d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans Thai",
    "Tahoma",
    sans-serif;
  font-size: 16px;
  line-height: 1.65;
}

/* =========================================================
   LAYOUT
========================================================= */

.page {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 22px 18px 70px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

.version {
  padding: 7px 14px;
  border-radius: 999px;
  background: #ddf5ec;
  color: #27324d;
  font-weight: 800;
  font-size: 14px;
}

/* =========================================================
   HERO
========================================================= */

.hero {
  text-align: center;
  padding: 26px 6px 28px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(34px, 8vw, 52px);
  line-height: 1.2;
  letter-spacing: -1.5px;
  font-weight: 800;
}

.hero p {
  margin: 14px auto 0;
  max-width: 650px;
  color: #7b8195;
  font-size: 19px;
  line-height: 1.6;
}

/* =========================================================
   CARD
========================================================= */

.card {
  background: #ffffff;
  border: 1px solid #e8e4dc;
  border-radius: 28px;
  padding: 24px;
  margin-top: 18px;
  box-shadow: 0 8px 30px rgba(48, 45, 70, 0.07);
}

.card-title {
  margin: 0 0 18px;
  font-size: 23px;
  line-height: 1.35;
  font-weight: 800;
}

/* =========================================================
   FORM
========================================================= */

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 19px;
  font-weight: 800;
}

input,
textarea,
select {
  width: 100%;
  border: 2px solid #e4e0ef;
  border-radius: 18px;
  background: #fcfbff;
  color: #27324d;
  font-family: inherit;
  font-size: 17px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input,
select {
  min-height: 56px;
  padding: 12px 16px;
}

textarea {
  min-height: 170px;
  padding: 16px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #8f82d8;
  box-shadow: 0 0 0 4px rgba(143, 130, 216, 0.12);
}

/* =========================================================
   QUICK TOPICS
========================================================= */

.quick-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.quick-btn {
  width: auto;
  margin: 0;
  padding: 10px 16px;
  border-radius: 999px;
  border: 0;
  background: #f2efff;
  color: #5548b8;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
}

/* =========================================================
   FORM GRID
========================================================= */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* =========================================================
   CREATE BUTTON
========================================================= */

.primary-btn {
  width: 100%;
  min-height: 60px;
  margin-top: 8px;
  border: 0;
  border-radius: 18px;
  background: #5a4bc4;
  color: #ffffff;
  font-family: inherit;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
}

.primary-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* =========================================================
   STATUS
========================================================= */

#status-section {
  scroll-margin-top: 20px;
}

.status-card {
  display: none;
}

.status-card.show {
  display: block;
}

.status-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 10px;
}

.status-text {
  color: #6f7488;
  font-size: 18px;
}

.progress {
  width: 100%;
  height: 12px;
  margin-top: 18px;
  overflow: hidden;
  border-radius: 999px;
  background: #ebe9f1;
}

.progress-bar {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: #6657ce;
  transition: width 0.35s ease;
}

/* =========================================================
   RESULT
========================================================= */

.result {
  display: none;
}

.result.show {
  display: block;
}

.result-title {
  margin: 0 0 18px;
  font-size: 27px;
  font-weight: 800;
}

.section {
  margin-top: 26px;
}

.section h2 {
  margin: 0 0 12px;
  font-size: 25px;
  line-height: 1.35;
}

.section h3 {
  margin: 20px 0 8px;
  font-size: 21px;
}

.section p {
  margin: 8px 0;
  font-size: 18px;
}

.section ul {
  margin: 8px 0 8px 24px;
  padding: 0;
}

.section li {
  margin: 5px 0;
  font-size: 18px;
}

/* =========================================================
   STEPS
========================================================= */

.step {
  padding: 17px 0;
  border-bottom: 1px solid #ece9e3;
}

.step:last-child {
  border-bottom: 0;
}

.step-head {
  font-size: 20px;
  font-weight: 800;
}

.step-detail {
  margin-top: 5px;
  font-size: 18px;
}

/* =========================================================
   QUESTIONS
========================================================= */

.question {
  margin-top: 16px;
  padding: 17px;
  border-radius: 18px;
  background: #faf9fd;
  border: 1px solid #e8e5f1;
}

.question-text {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.65;
}

.options {
  margin-top: 8px;
}

.option {
  margin: 5px 0;
  font-size: 18px;
}

.answer {
  margin-top: 10px;
  color: #5045ad;
  font-size: 17px;
  font-weight: 700;
}

/* =========================================================
   PDF ACTIONS
========================================================= */

.pdf-actions {
  margin-top: 30px;
  padding-top: 24px;
  border-top: 1px solid #e7e3dc;
}

.pdf-btn {
  width: 100%;
  min-height: 62px;
  border: 0;
  border-radius: 18px;
  background: #5a4bc4;
  color: #ffffff;
  font-family: inherit;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
}

.pdf-btn:disabled {
  opacity: 0.55;
  cursor: wait;
}

.new-btn {
  width: 100%;
  min-height: 58px;
  margin-top: 14px;
  border: 2px solid #e0dcef;
  border-radius: 18px;
  background: #ffffff;
  color: #5146b4;
  font-family: inherit;
  font-size: 19px;
  font-weight: 800;
  cursor: pointer;
}

/* =========================================================
   ERROR
========================================================= */

.error {
  display: none;
  margin-top: 16px;
  padding: 15px 17px;
  border-radius: 16px;
  background: #fff0f0;
  color: #a52e2e;
  border: 1px solid #f1cccc;
  font-size: 17px;
}

.error.show {
  display: block;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .page {
    padding: 16px 14px 55px;
  }

  .hero {
    padding-top: 20px;
    padding-bottom: 22px;
  }

  .hero h1 {
    font-size: 36px;
  }

  .hero p {
    font-size: 17px;
  }

  .card {
    padding: 19px;
    border-radius: 24px;
  }

  .card-title {
    font-size: 21px;
  }

  .field label {
    font-size: 18px;
  }

  .form-grid {
    grid-template-columns: 1fr;
    gap: 0;
  }

  textarea {
    min-height: 150px;
  }

  .section h2 {
    font-size: 23px;
  }

  .section p,
  .section li {
    font-size: 17px;
  }

  .question-text {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="page" id="top">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">
    <div class="logo">📚 ชุดการสอน</div>
    <div class="version">V1.5</div>
  </header>

  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero">
    <h1>สอนอะไรวันนี้? ✨</h1>

    <p>
      พิมพ์หัวข้อ แล้วสร้างแผนการสอน ใบงาน
      แบบทดสอบ และเฉลย
    </p>
  </section>

  <!-- =====================================================
       FORM
  ====================================================== -->

  <section class="card" id="form-section">

    <h2 class="card-title">
      👋 วันนี้คุณอยากสอนอะไร?
    </h2>

    <div class="field">

      <label for="prompt">หัวข้อการสอน</label>

      <textarea
        id="prompt"
        maxlength="500"
        autocomplete="off"
        placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
      ></textarea>

      <div class="quick-topics">

        <button
          type="button"
          class="quick-btn"
          data-topic="เศษส่วน ป.4"
        >
          🧮 เศษส่วน ป.4
        </button>

        <button
          type="button"
          class="quick-btn"
          data-topic="ระบบสุริยะ ป.5"
        >
          🌎 ระบบสุริยะ ป.5
        </button>

        <button
          type="button"
          class="quick-btn"
          data-topic="Animals ป.3"
        >
          🇬🇧 Animals ป.3
        </button>

      </div>

    </div>

    <div class="form-grid">

      <div class="field">

        <label for="teacherName">
          👨‍🏫 ชื่อครู
        </label>

        <input
          id="teacherName"
          type="text"
          maxlength="100"
          autocomplete="off"
          placeholder="เช่น สมปอง เข้ามา"
        >

      </div>

      <div class="field">

        <label for="questionCount">
          🔢 จำนวนข้อสอบ
        </label>

        <select id="questionCount">

          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="30">30</option>

        </select>

      </div>

    </div>

    <div class="form-grid">

      <div class="field">

        <label for="difficulty">
          🎯 ระดับความยาก
        </label>

        <select id="difficulty">

          <option value="easy">ง่าย</option>
          <option value="mixed" selected>ผสม</option>
          <option value="hard">ยาก</option>

        </select>

      </div>

      <div class="field">

        <label for="questionType">
          🧠 รูปแบบข้อสอบ
        </label>

        <select id="questionType">

          <option value="multiple_choice" selected>
            ปรนัย
          </option>

        </select>

      </div>

    </div>

    <button
      type="button"
      id="createBtn"
      class="primary-btn"
    >
      ✨ สร้างชุดการสอน
    </button>

    <div
      id="formError"
      class="error"
    ></div>

  </section>

  <!-- =====================================================
       STATUS
  ====================================================== -->

  <section
    id="status-section"
    class="card status-card"
  >

    <div class="status-title">
      กำลังสร้างชุดการสอน
    </div>

    <div
      id="statusText"
      class="status-text"
    >
      กำลังเตรียมข้อมูล...
    </div>

    <div class="progress">
      <div
        id="progressBar"
        class="progress-bar"
      ></div>
    </div>

  </section>

  <!-- =====================================================
       RESULT
  ====================================================== -->

  <section
    id="result"
    class="card result"
  >

    <h2 class="result-title">
      ชุดการสอนพร้อมแล้ว
    </h2>

    <!-- SUMMARY -->

    <div class="section">

      <h2>ข้อมูลการสอน</h2>

      <p id="summaryText"></p>

    </div>

    <!-- LESSON PLAN -->

    <div class="section">

      <h2>1. แผนการจัดการเรียนรู้</h2>

      <div id="objectives"></div>

      <div id="lessonSteps"></div>

      <div id="assessment"></div>

    </div>

    <!-- TEACHING CONTENT -->

    <div class="section">

      <h2>2. เนื้อหาที่ใช้สอน</h2>

      <div id="intro"></div>

      <div id="concepts"></div>

      <div id="examples"></div>

      <div id="teacherTips"></div>

      <div id="thinkingQuestions"></div>

    </div>

    <!-- WORKSHEET -->

    <div class="section">

      <h2>3. ใบงาน</h2>

      <div id="worksheet"></div>

    </div>

    <!-- QUIZ -->

    <div class="section">

      <h2>4. แบบทดสอบ</h2>

      <div id="quiz"></div>

    </div>

    <!-- =================================================
         ONLY TWO BUTTONS
    ================================================== -->

    <div class="pdf-actions">

      <button
        type="button"
        id="downloadPdfBtn"
        class="pdf-btn"
      >
        📄 ดาวน์โหลด PDF
      </button>

      <button
        type="button"
        id="newBtn"
        class="new-btn"
      >
        🔄 สร้างชุดใหม่
      </button>

    </div>

    <div
      id="pdfError"
      class="error"
    ></div>

  </section>

</div>


<script>
/* =========================================================
   ELEMENTS
========================================================= */

const promptInput =
  document.getElementById("prompt");

const teacherNameInput =
  document.getElementById("teacherName");

const questionCountInput =
  document.getElementById("questionCount");

const difficultyInput =
  document.getElementById("difficulty");

const questionTypeInput =
  document.getElementById("questionType");

const createBtn =
  document.getElementById("createBtn");

const statusSection =
  document.getElementById("status-section");

const statusText =
  document.getElementById("statusText");

const progressBar =
  document.getElementById("progressBar");

const result =
  document.getElementById("result");

const formSection =
  document.getElementById("form-section");

const formError =
  document.getElementById("formError");

const pdfError =
  document.getElementById("pdfError");

const downloadPdfBtn =
  document.getElementById("downloadPdfBtn");

const newBtn =
  document.getElementById("newBtn");


/* =========================================================
   IMPORTANT:
   ไม่ใช้ localStorage
   ไม่ใช้ sessionStorage
   ดังนั้น refresh แล้วข้อมูลไม่ถูกโหลดกลับมา
========================================================= */

let currentData = null;
let currentJobId = null;


/* =========================================================
   QUICK TOPICS
========================================================= */

document
  .querySelectorAll(".quick-btn")
  .forEach(btn => {

    btn.addEventListener("click", () => {

      promptInput.value =
        btn.dataset.topic;

      promptInput.focus();

    });

  });


/* =========================================================
   ERROR
========================================================= */

function showFormError(message) {

  formError.textContent = message;
  formError.classList.add("show");

}

function hideFormError() {

  formError.textContent = "";
  formError.classList.remove("show");

}

function showPdfError(message) {

  pdfError.textContent = message;
  pdfError.classList.add("show");

}

function hidePdfError() {

  pdfError.textContent = "";
  pdfError.classList.remove("show");

}


/* =========================================================
   SCROLL TO STATUS
========================================================= */

function scrollToStatus() {

  setTimeout(() => {

    statusSection.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 80);

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(percent, text) {

  progressBar.style.width =
    percent + "%";

  statusText.textContent =
    text;

}


/* =========================================================
   CREATE
========================================================= */

createBtn.addEventListener("click", async () => {

  hideFormError();
  hidePdfError();

  const prompt =
    promptInput.value.trim();

  if (!prompt) {

    showFormError(
      "กรุณาพิมพ์หัวข้อที่ต้องการสอน"
    );

    promptInput.focus();

    return;
  }


  /* -----------------------------------------------
     RESET OLD RESULT
  ------------------------------------------------ */

  currentData = null;
  currentJobId = null;

  result.classList.remove("show");

  statusSection.classList.add("show");

  createBtn.disabled = true;

  setProgress(
    8,
    "กำลังเตรียมข้อมูลการสอน..."
  );

  scrollToStatus();


  try {

    setProgress(
      20,
      "กำลังสร้างแผนการสอน..."
    );


    const payload = {

      prompt: prompt,

      teacher_name:
        teacherNameInput.value.trim(),

      question_count:
        Number(questionCountInput.value),

      question_types: [
        questionTypeInput.value
      ],

      difficulty:
        difficultyInput.value

    };


    const response =
      await fetch(
        "/api/generate",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)

        }
      );


    if (!response.ok) {

      let message =
        "ไม่สามารถสร้างชุดการสอนได้";

      try {

        const err =
          await response.json();

        if (err.detail) {
          message = err.detail;
        }

      } catch (_) {}

      throw new Error(message);
    }


    setProgress(
      55,
      "กำลังจัดทำใบงานและแบบทดสอบ..."
    );


    const data =
      await response.json();


    currentData = data;


    /*
      Backend รุ่นต่าง ๆ อาจส่ง ID ในชื่อ
      id / job_id / file_id
      รองรับไว้ทั้งหมด
    */

    currentJobId =
      data.id ||
      data.job_id ||
      data.file_id ||
      data.pdf_id ||
      null;


    setProgress(
      82,
      "กำลังจัดรูปแบบเอกสาร..."
    );


    renderResult(data);


    setProgress(
      100,
      "สร้างชุดการสอนเสร็จแล้ว"
    );


    setTimeout(() => {

      statusSection.classList.remove("show");

      result.classList.add("show");

      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }, 450);


  } catch (error) {

    statusSection.classList.remove("show");

    showFormError(
      error.message ||
      "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง"
    );

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } finally {

    createBtn.disabled = false;

  }

});


/* =========================================================
   RENDER RESULT
========================================================= */

function renderResult(data) {

  /* -----------------------------------------------
     SUMMARY
  ------------------------------------------------ */

  const summary =
    data.summary || {};

  const summaryParts = [];

  if (summary.subject) {
    summaryParts.push(
      "วิชา " + summary.subject
    );
  }

  if (summary.grade) {
    summaryParts.push(
      "ระดับชั้น " + summary.grade
    );
  }

  if (summary.topic) {
    summaryParts.push(
      "เรื่อง " + summary.topic
    );
  }

  if (summary.duration) {
    summaryParts.push(
      "เวลา " + summary.duration
    );
  }

  /*
     ตั้งใจไม่แสดงคำว่า "ครูผู้ช่วย"
     และไม่สร้าง label ใหม่
  */

  if (summary.teacher_name) {
    summaryParts.push(
      "ครูผู้สอน " +
      summary.teacher_name
    );
  }

  document.getElementById(
    "summaryText"
  ).textContent =
    summaryParts.join("  |  ");


  /* -----------------------------------------------
     OBJECTIVES
  ------------------------------------------------ */

  const lessonPlan =
    data.lesson_plan || {};

  const objectives =
    Array.isArray(lessonPlan.objective)
      ? lessonPlan.objective
      : [];

  document.getElementById(
    "objectives"
  ).innerHTML = "";

  if (objectives.length) {

    const h =
      document.createElement("h3");

    h.textContent =
      "จุดประสงค์การเรียนรู้";

    document.getElementById(
      "objectives"
    ).appendChild(h);


    const ul =
      document.createElement("ul");

    objectives.forEach(item => {

      const li =
        document.createElement("li");

      li.textContent =
        cleanText(item);

      ul.appendChild(li);

    });

    document.getElementById(
      "objectives"
    ).appendChild(ul);

  }


  /* -----------------------------------------------
     LESSON STEPS
  ------------------------------------------------ */

  const lessonSteps =
    document.getElementById(
      "lessonSteps"
    );

  lessonSteps.innerHTML = "";


  const steps =
    Array.isArray(lessonPlan.steps)
      ? lessonPlan.steps
      : [];


  steps.forEach(step => {

    const box =
      document.createElement("div");

    box.className = "step";


    const head =
      document.createElement("div");

    head.className =
      "step-head";

    const time =
      cleanText(step.time || "");

    const title =
      cleanText(step.title || "");

    head.textContent =
      [time, title]
        .filter(Boolean)
        .join(" · ");


    const detail =
      document.createElement("div");

    detail.className =
      "step-detail";

    detail.textContent =
      cleanText(step.detail || "");


    box.appendChild(head);
    box.appendChild(detail);

    lessonSteps.appendChild(box);

  });


  /* -----------------------------------------------
     ASSESSMENT
  ------------------------------------------------ */

  const assessment =
    document.getElementById(
      "assessment"
    );

  assessment.innerHTML = "";


  if (lessonPlan.assessment) {

    const h =
      document.createElement("h3");

    h.textContent =
      "การประเมินผล";


    const p =
      document.createElement("p");

    p.textContent =
      cleanText(
        lessonPlan.assessment
      );


    assessment.appendChild(h);
    assessment.appendChild(p);

  }


  /* -----------------------------------------------
     TEACHING CONTENT
  ------------------------------------------------ */

  const teaching =
    data.teaching_content || {};


  document.getElementById(
    "intro"
  ).innerHTML = "";


  if (teaching.intro) {

    const p =
      document.createElement("p");

    p.textContent =
      cleanText(teaching.intro);

    document.getElementById(
      "intro"
    ).appendChild(p);

  }


  renderStringArray(
    "concepts",
    "แนวคิดสำคัญ",
    teaching.concepts
  );


  renderExamples(
    teaching.examples
  );


  renderStringArray(
    "teacherTips",
    "คำแนะนำสำหรับครู",
    teaching.teacher_tips
  );


  renderStringArray(
    "thinkingQuestions",
    "คำถามชวนคิด",
    teaching.thinking_questions
  );


  /* -----------------------------------------------
     WORKSHEET
  ------------------------------------------------ */

  renderWorksheet(
    Array.isArray(data.worksheet)
      ? data.worksheet
      : []
  );


  /* -----------------------------------------------
     QUIZ
  ------------------------------------------------ */

  renderQuiz(
    Array.isArray(data.quiz)
      ? data.quiz
      : []
  );

}


/* =========================================================
   STRING ARRAY
========================================================= */

function renderStringArray(
  elementId,
  title,
  items
) {

  const container =
    document.getElementById(
      elementId
    );

  container.innerHTML = "";


  if (!Array.isArray(items) ||
      !items.length) {

    return;
  }


  const h =
    document.createElement("h3");

  h.textContent =
    title;


  const ul =
    document.createElement("ul");


  items.forEach(item => {

    const li =
      document.createElement("li");

    li.textContent =
      cleanText(item);

    ul.appendChild(li);

  });


  container.appendChild(h);
  container.appendChild(ul);

}


/* =========================================================
   EXAMPLES
========================================================= */

function renderExamples(items) {

  const container =
    document.getElementById(
      "examples"
    );

  container.innerHTML = "";


  if (!Array.isArray(items) ||
      !items.length) {

    return;
  }


  const h =
    document.createElement("h3");

  h.textContent =
    "ตัวอย่าง";


  container.appendChild(h);


  items.forEach(item => {

    const box =
      document.createElement("div");

    box.className =
      "question";


    const title =
      document.createElement("div");

    title.className =
      "question-text";

    title.textContent =
      cleanText(
        item.title || ""
      );


    const explanation =
      document.createElement("div");

    explanation.className =
      "step-detail";

    explanation.textContent =
      cleanText(
        item.explanation || ""
      );


    box.appendChild(title);
    box.appendChild(explanation);

    container.appendChild(box);

  });

}


/* =========================================================
   WORKSHEET
========================================================= */

function renderWorksheet(items) {

  const container =
    document.getElementById(
      "worksheet"
    );

  container.innerHTML = "";


  items.forEach((item, index) => {

    const box =
      document.createElement("div");

    box.className =
      "question";


    /*
       สำคัญ:
       แสดงเป็น

       1. คำถาม

       ไม่แสดง "(ปรนัย)"
       และไม่ซ้ำเลขข้อ
    */

    const question =
      document.createElement("div");

    question.className =
      "question-text";

    question.textContent =
      (index + 1) +
      ". " +
      removeLeadingNumber(
        cleanText(item.question || "")
      );


    box.appendChild(question);


    if (item.answer) {

      const answer =
        document.createElement("div");

      answer.className =
        "answer";

      answer.textContent =
        "คำตอบ: " +
        cleanText(item.answer);

      box.appendChild(answer);

    }


    container.appendChild(box);

  });

}


/* =========================================================
   QUIZ
========================================================= */

function renderQuiz(items) {

  const container =
    document.getElementById(
      "quiz"
    );

  container.innerHTML = "";


  items.forEach((item, index) => {

    const box =
      document.createElement("div");

    box.className =
      "question";


    const question =
      document.createElement("div");

    question.className =
      "question-text";


    /*
       ไม่แสดง:
       (ปรนัย)

       ไม่แสดง type
    */

    question.textContent =
      (index + 1) +
      ". " +
      removeLeadingNumber(
        cleanText(item.question || "")
      );


    box.appendChild(question);


    const options =
      Array.isArray(item.options)
        ? item.options
        : [];


    if (options.length) {

      const optionsBox =
        document.createElement("div");

      optionsBox.className =
        "options";


      options.forEach((option, optionIndex) => {

        const div =
          document.createElement("div");

        div.className =
          "option";


        const labels = [
          "ก.",
          "ข.",
          "ค.",
          "ง."
        ];


        div.textContent =
          labels[optionIndex] +
          " " +
          removeOptionLabel(
            cleanText(option)
          );


        optionsBox.appendChild(div);

      });


      box.appendChild(optionsBox);

    }


    container.appendChild(box);

  });

}


/* =========================================================
   TEXT CLEANING
========================================================= */

function cleanText(value) {

  if (value === null ||
      value === undefined) {

    return "";

  }

  return String(value)
    .replace(/\r\n/g, "\n")
    .trim();

}


function removeLeadingNumber(text) {

  return String(text)
    .replace(
      /^\s*(?:ข้อ\s*)?\d+\s*[\.\):\-]\s*/,
      ""
    )
    .trim();

}


function removeOptionLabel(text) {

  return String(text)
    .replace(
      /^\s*[ก-ฮ]\s*[\.\):\-]\s*/,
      ""
    )
    .replace(
      /^\s*[A-Da-d]\s*[\.\):\-]\s*/,
      ""
    )
    .trim();

}

/* =========================================================
   PDF URL
========================================================= */

/*
   Backend เดิมมีรูปแบบ URL:

   /api/pdf/{id}_lesson.pdf
   /api/pdf/{id}_worksheet.pdf
   /api/pdf/{id}_quiz.pdf
   /api/pdf/{id}_answer.pdf

   ฟังก์ชันนี้รองรับ ID หลายรูปแบบ
*/

function makePdfUrl(id, type) {

  return (
    "/api/pdf/" +
    encodeURIComponent(id) +
    "_" +
    type +
    ".pdf"
  );

}


/* =========================================================
   GET JOB ID
========================================================= */

function getPdfId(data) {

  if (!data) {
    return null;
  }


  /*
     ลอง key ที่ Backend รุ่นต่าง ๆ
     อาจใช้
  */

  return (
    data.id ||
    data.job_id ||
    data.file_id ||
    data.pdf_id ||
    data.uuid ||
    data.document_id ||
    null
  );

}


/* =========================================================
   FETCH PDF
========================================================= */

async function fetchPdf(url) {

  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "ไม่สามารถเปิดไฟล์ PDF ได้"
    );

  }


  const contentType =
    response.headers.get(
      "content-type"
    ) || "";


  if (
    contentType.includes(
      "application/json"
    )
  ) {

    let detail =
      "ไม่พบไฟล์ PDF";

    try {

      const json =
        await response.json();

      if (json.detail) {
        detail = json.detail;
      }

    } catch (_) {}

    throw new Error(detail);

  }


  return await response.arrayBuffer();

}


/* =========================================================
   MERGE PDF
========================================================= */

async function mergePdfs(
  pdfBuffers
) {

  if (
    !window.PDFLib ||
    !window.PDFLib.PDFDocument
  ) {

    throw new Error(
      "ระบบรวม PDF ยังโหลดไม่เสร็จ กรุณาลองอีกครั้ง"
    );

  }


  const {
    PDFDocument
  } = window.PDFLib;


  const mergedPdf =
    await PDFDocument.create();


  for (
    const buffer of pdfBuffers
  ) {

    const sourcePdf =
      await PDFDocument.load(
        buffer
      );


    const pages =
      await mergedPdf.copyPages(
        sourcePdf,
        sourcePdf.getPageIndices()
      );


    pages.forEach(page => {

      mergedPdf.addPage(page);

    });

  }


  return await mergedPdf.save();

}


/* =========================================================
   DOWNLOAD PDF — ONE BUTTON
========================================================= */

downloadPdfBtn.addEventListener(
  "click",
  async () => {

    hidePdfError();


    if (!currentData) {

      showPdfError(
        "ยังไม่มีชุดการสอนสำหรับดาวน์โหลด"
      );

      return;

    }


    /*
       ดึง ID จาก response
    */

    const id =
      currentJobId ||
      getPdfId(currentData);


    if (!id) {

      showPdfError(
        "ระบบไม่พบรหัสไฟล์ PDF ของชุดการสอนนี้"
      );

      return;

    }


    downloadPdfBtn.disabled =
      true;

    downloadPdfBtn.textContent =
      "กำลังเตรียม PDF...";


    try {

      /*
         PDF ทั้ง 4 ส่วน
      */

      const types = [
        "lesson",
        "worksheet",
        "quiz",
        "answer"
      ];


      const buffers = [];


      for (
        let i = 0;
        i < types.length;
        i++
      ) {

        downloadPdfBtn.textContent =
          "กำลังรวม PDF " +
          (i + 1) +
          "/4...";


        const url =
          makePdfUrl(
            id,
            types[i]
          );


        const buffer =
          await fetchPdf(url);


        buffers.push(buffer);

      }


      downloadPdfBtn.textContent =
        "กำลังสร้าง PDF รวม...";


      /*
         รวม 4 PDF เป็น PDF เดียว
      */

      const mergedBytes =
        await mergePdfs(
          buffers
        );


      const blob =
        new Blob(
          [mergedBytes],
          {
            type:
              "application/pdf"
          }
        );


      const pdfUrl =
        URL.createObjectURL(blob);


      /*
         สำคัญ:
         เปิด PDF ให้ Safari เห็นก่อน

         ไม่ใช้ <a download>
         เพราะเราไม่ต้องการให้ดาวน์โหลดทันที
      */

      window.location.href =
        pdfUrl;


      /*
         ไม่ revoke ทันที เพราะ Safari
         ต้องใช้ Blob URL ในการเปิด PDF
      */

      setTimeout(() => {

        try {

          URL.revokeObjectURL(
            pdfUrl
          );

        } catch (_) {}

      }, 60000);


    } catch (error) {

      console.error(error);

      showPdfError(
        error.message ||
        "ไม่สามารถรวม PDF ได้ กรุณาลองใหม่"
      );


      downloadPdfBtn.disabled =
        false;

      downloadPdfBtn.textContent =
        "📄 ดาวน์โหลด PDF";

      return;

    }


    downloadPdfBtn.disabled =
      false;

    downloadPdfBtn.textContent =
      "📄 ดาวน์โหลด PDF";

  }
);


/* =========================================================
   PAGE LOAD RESET
========================================================= */

/*
   ทุกครั้งที่หน้าเว็บโหลดใหม่
   ไม่อ่าน localStorage
   ไม่อ่าน sessionStorage
   และ reset ตัวแปรทั้งหมด
*/

window.addEventListener(
  "pageshow",
  () => {

    /*
       ถ้ากลับมาจาก bfcache
       ให้หน้าเว็บเริ่มใหม่ด้วย
    */

    if (
      performance &&
      performance.getEntriesByType
    ) {

      const navigation =
        performance.getEntriesByType(
          "navigation"
        )[0];

      if (
        navigation &&
        navigation.type ===
          "back_forward"
      ) {

        currentData = null;
        currentJobId = null;

      }

    }

  }
);


/* =========================================================
   HARD RESET ON LOAD
========================================================= */

currentData = null;
currentJobId = null;

result.classList.remove("show");
statusSection.classList.remove("show");

</script>
