<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff8ed"
>

<title>สร้างชุดการสอน</title>

<style>

:root{
  --bg:#fff8ed;
  --card:#ffffff;
  --ink:#27324a;
  --muted:#6f7890;
  --primary:#6c63ff;
  --primary2:#5148e8;
  --mint:#dff8ee;
  --blue:#e3f0ff;
  --line:#e9e5dc;
  --shadow:0 12px 30px rgba(49,55,85,.09);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    linear-gradient(
      180deg,
      #fff8ed 0,
      #f7f5ff 100%
    );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    sans-serif;
  color:var(--ink);
}

button,
input,
select,
textarea{
  font:inherit;
}

.container{
  width:min(900px,92%);
  margin:auto;
  padding-bottom:50px;
}

.header{
  padding:22px 0 12px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.version{
  font-size:12px;
  background:var(--mint);
  padding:7px 11px;
  border-radius:999px;
  font-weight:700;
}

.hero{
  text-align:center;
  padding:28px 0 20px;
}

.hero h1{
  font-size:clamp(
    30px,
    7vw,
    46px
  );
  margin:0 0 10px;
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  font-size:16px;
  margin:0;
  line-height:1.6;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
  margin:16px 0;
}

.label{
  font-weight:800;
  margin-bottom:9px;
  display:block;
}

.field-group{
  margin-bottom:18px;
}

.input,
.prompt,
select{
  width:100%;
  border:2px solid #e8e4f8;
  border-radius:17px;
  padding:15px;
  outline:none;
  background:#fcfbff;
  color:var(--ink);
}

.input:focus,
.prompt:focus,
select:focus{
  border-color:var(--primary);
}

.prompt{
  min-height:120px;
  resize:vertical;
}

.examples{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.example{
  border:0;
  background:#f4f2ff;
  color:#5148e8;
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  background:#faf9f5;
  border:1px solid var(--line);
  padding:15px;
  border-radius:18px;
}

.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.check{
  position:relative;
}

.check input{
  position:absolute;
  opacity:0;
}

.check label{
  display:block;
  padding:14px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#fff;
  cursor:pointer;
  font-weight:700;
}

.check input:checked + label{
  border-color:var(--primary);
  background:#f0efff;
  color:#5148e8;
}

button.primary{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );
  color:#fff;
  font-weight:800;
  font-size:18px;
  cursor:pointer;
  box-shadow:
    0 9px 18px
    rgba(108,99,255,.25);
}

button.primary:disabled{
  opacity:.6;
  cursor:wait;
}

.note{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
}

.hidden{
  display:none !important;
}

.loading{
  text-align:center;
  padding:38px 20px;
}

.loading-icon{
  font-size:40px;
  animation:bounce 1s infinite alternate;
}

@keyframes bounce{
  to{
    transform:translateY(-8px);
  }
}

.progress{
  height:10px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:18px;
}

.progress-bar{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #6c63ff,
      #5148e8
    );
  transition:
    width .4s ease;
}

.loading-text{
  font-weight:800;
  margin-top:15px;
}

.error{
  background:#ffe7e7;
  color:#9d2929;
  padding:14px;
  border-radius:16px;
  line-height:1.6;
}

.result-title{
  font-size:26px;
  font-weight:800;
  margin-bottom:10px;
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.chip{
  padding:8px 11px;
  border-radius:999px;
  background:var(--blue);
  font-size:13px;
  font-weight:800;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-top:20px;
}

.tab{
  white-space:nowrap;
  border:0;
  background:#f2f1ee;
  border-radius:13px;
  padding:11px 14px;
  font-weight:800;
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  background:#5148e8;
  color:#fff;
}

.panel{
  line-height:1.8;
}

.panel h3{
  margin-top:22px;
}

.item{
  padding:15px;
  border:1px solid var(--line);
  border-radius:16px;
  margin:10px 0;
  background:#fff;
}

.qtype{
  display:inline-block;
  font-size:11px;
  background:#f1f0ff;
  color:#5148e8;
  padding:5px 8px;
  border-radius:999px;
  font-weight:800;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.secondary{
  border:2px solid #e7e3f6;
  background:#fff;
  color:#5148e8;
  border-radius:16px;
  padding:13px;
  font-weight:800;
  cursor:pointer;
}

.saved{
  background:#e8f8f0;
  color:#28704d;
  padding:13px;
  border-radius:15px;
  margin-top:15px;
  font-weight:700;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .types{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

@media print{

  body{
    background:#fff;
  }

  .header,
  .hero,
  #builder,
  #loading,
  #error,
  .actions,
  .tabs{
    display:none !important;
  }

  .card{
    box-shadow:none;
    border:0;
  }

}

</style>

</head>

<body>

<div class="container">

<header class="header">

  <div class="version">
    V1.5
  </div>

</header>


<section class="hero">

  <h1>
    สร้างชุดการสอน
  </h1>

  <p>
    กรอกหัวข้อและรายละเอียด แล้วสร้างเอกสารการเรียนการสอนได้ทันที
  </p>

</section>


<!-- ========================================================= -->
<!-- BUILDER -->
<!-- ========================================================= -->

<section
  id="builder"
  class="card"
>

  <div class="field-group">

    <label class="label">
      👋 วันนี้คุณอยากสอนอะไร?
    </label>

    <textarea
      id="prompt"
      class="prompt"
      placeholder="เช่น เศษส่วน ป.4 1 ชั่วโมง"
    ></textarea>

    <div class="examples">

      <button
        class="example"
        onclick="fillExample('เศษส่วน ป.4 1 ชั่วโมง')"
      >
        🧮 เศษส่วน ป.4
      </button>

      <button
        class="example"
        onclick="fillExample('ระบบสุริยะ ป.5 1 ชั่วโมง')"
      >
        🌎 ระบบสุริยะ ป.5
      </button>

      <button
        class="example"
        onclick="fillExample('Animals ป.3 30 นาที')"
      >
        🇬🇧 Animals ป.3
      </button>

    </div>

  </div>


  <!-- TEACHER NAME -->

  <div class="field-group">

    <label class="label">
      👨‍🏫 ชื่อครูผู้สอน
    </label>

    <input
      id="teacherName"
      class="input"
      type="text"
      maxlength="100"
      placeholder="เช่น สมปอง เข้ามา"
    >

  </div>


  <!-- SETTINGS -->

  <div class="grid">

    <div class="field">

      <label class="label">
        🔢 จำนวนข้อสอบ
      </label>

      <select id="count">

        <option value="5">
          5 ข้อ
        </option>

        <option
          value="10"
          selected
        >
          10 ข้อ
        </option>

        <option value="15">
          15 ข้อ
        </option>

        <option value="20">
          20 ข้อ
        </option>

        <option value="30">
          30 ข้อ
        </option>

      </select>

    </div>


    <div class="field">

      <label class="label">
        🎯 ระดับความยาก
      </label>

      <select id="difficulty">

        <option value="easy">
          ง่าย
        </option>

        <option value="medium">
          ปานกลาง
        </option>

        <option value="hard">
          ยาก
        </option>

        <option
          value="mixed"
          selected
        >
          ผสม
        </option>

      </select>

    </div>

  </div>


  <!-- QUESTION TYPES -->

  <div style="margin-top:18px">

    <label class="label">

      🧠 รูปแบบข้อสอบ

      <span
        style="
          color:#6f7890;
          font-weight:500
        "
      >
        (เลือกได้หลายแบบ)
      </span>

    </label>


    <div class="types">

      <div class="check">

        <input
          type="checkbox"
          id="multiple_choice"
          checked
        >

        <label
          for="multiple_choice"
        >
          ☑️ ปรนัย
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="fill_blank"
        >

        <label
          for="fill_blank"
        >
          ✏️ เติมคำ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="calculation"
        >

        <label
          for="calculation"
        >
          🔢 คำนวณ
        </label>

      </div>


      <div class="check">

        <input
          type="checkbox"
          id="application"
        >

        <label
          for="application"
        >
          💡 ประยุกต์ใช้
        </label>

      </div>

    </div>

  </div>


  <!-- GENERATE -->

  <div style="margin-top:20px">

    <button
      id="generateBtn"
      class="primary"
      onclick="generate()"
    >
      ✨ สร้างชุดการสอน
    </button>

    <div class="note">
      แผนการสอน + ใบงาน + แบบทดสอบ + เฉลย
    </div>

  </div>

</section>


<!-- ========================================================= -->
<!-- LOADING -->
<!-- ========================================================= -->

<section
  id="loading"
  class="card loading hidden"
>

  <div class="loading-icon">
    ✨
  </div>

  <h3>
    กำลังสร้างชุดการสอน...
  </h3>

  <div
    id="loadingText"
    class="loading-text"
  >
    กำลังเตรียมข้อมูล
  </div>

  <div class="progress">

    <div
      id="progressBar"
      class="progress-bar"
    ></div>

  </div>

  <p
    style="
      color:#6f7890;
      margin-top:12px
    "
  >
    กรุณารอสักครู่ ระบบกำลังจัดเรียงเนื้อหาและตรวจคำตอบ
  </p>

</section>


<!-- ========================================================= -->
<!-- ERROR -->
<!-- ========================================================= -->

<section
  id="error"
  class="card hidden"
>

  <div
    id="errorText"
    class="error"
  ></div>

</section>


<!-- ========================================================= -->
<!-- RESULT -->
<!-- ========================================================= -->

<section
  id="result"
  class="card hidden"
>

  <div class="result-title">
    🎉 ชุดการสอนพร้อมแล้ว
  </div>


  <div
    id="summary"
    class="chips"
  ></div>


  <div
    id="savedMessage"
    class="saved hidden"
  >
    💾 ชุดการสอนนี้ถูกบันทึกไว้ในเครื่องแล้ว
  </div>


  <div class="tabs">

    <button
      class="tab active"
      data-tab="lesson"
    >
      📚 แผนการสอน
    </button>

    <button
      class="tab"
      data-tab="worksheet"
    >
      📝 ใบงาน
    </button>

    <button
      class="tab"
      data-tab="quiz"
    >
      🧠 แบบทดสอบ
    </button>

    <button
      class="tab"
      data-tab="answer"
    >
      ✅ เฉลย
    </button>

  </div>


  <div
    id="lesson"
    class="panel"
  ></div>


  <div
    id="worksheet"
    class="panel hidden"
  ></div>


  <div
    id="quiz"
    class="panel hidden"
  ></div>


  <div
    id="answer"
    class="panel hidden"
  ></div>


  <div
    class="actions"
    style="margin-top:20px"
  >

    <button
      class="secondary"
      onclick="savePDF()"
    >
      📄 บันทึก PDF
    </button>

    <button
      class="secondary"
      onclick="newPack()"
    >
      🔄 สร้างชุดใหม่
    </button>

  </div>

</section>

</div>


<script>

let currentData = null;

const typeNames = {
  multiple_choice:"ปรนัย",
  fill_blank:"เติมคำ",
  calculation:"คำนวณ",
  application:"ประยุกต์ใช้"
};


// ============================================================
// INITIAL LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const teacher =
      localStorage.getItem(
        "teacher_name"
      );

    if(teacher){

      document.getElementById(
        "teacherName"
      ).value = teacher;

    }

    const saved =
      localStorage.getItem(
        "teacher_pack_v15"
      );

    if(saved){

      try{

        const data =
          JSON.parse(saved);

        if(
          data &&
          data.summary
        ){

          currentData = data;

          render(
            data,
            false
          );

          document.getElementById(
            "savedMessage"
          ).classList.remove(
            "hidden"
          );

        }

      }catch(e){

        localStorage.removeItem(
          "teacher_pack_v15"
        );

      }

    }

  }
);


// ============================================================
// EXAMPLE
// ============================================================

function fillExample(value){

  document.getElementById(
    "prompt"
  ).value = value;

}


// ============================================================
// TABS
// ============================================================

document.querySelectorAll(
  ".tab"
).forEach(
  btn => {

    btn.addEventListener(
      "click",
      () => {

        document.querySelectorAll(
          ".tab"
        ).forEach(
          b =>
            b.classList.remove(
              "active"
            )
        );

        document.querySelectorAll(
          ".panel"
        ).forEach(
          p =>
            p.classList.add(
              "hidden"
            )
        );

        btn.classList.add(
          "active"
        );

        document.getElementById(
          btn.dataset.tab
        ).classList.remove(
          "hidden"
        );

      }
    );

  }
);


// ============================================================
// ESCAPE
// ============================================================

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


// ============================================================
// GENERATE
// ============================================================

async function generate(){

  const prompt =
    document.getElementById(
      "prompt"
    ).value.trim();

  const teacherName =
    document.getElementById(
      "teacherName"
    ).value.trim();

  const selected = [
    ...document.querySelectorAll(
      ".check input:checked"
    )
  ].map(
    x => x.id
  );


  if(!prompt){

    showError(
      "พิมพ์หัวข้อที่อยากสอนก่อนนะครับ 😊"
    );

    return;

  }


  if(!teacherName){

    showError(
      "กรุณากรอกชื่อครูผู้สอนก่อนสร้างชุดการสอน"
    );

    document.getElementById(
      "teacherName"
    ).focus();

    return;

  }


  if(!selected.length){

    showError(
      "เลือกอย่างน้อย 1 รูปแบบข้อสอบครับ"
    );

    return;

  }


  // จำชื่อครู
  localStorage.setItem(
    "teacher_name",
    teacherName
  );


  // แสดง Loading
  setLoading(
    true
  );


  // สำคัญ:
  // เลื่อนหน้าจอลงไปทันที
  // ให้ผู้ใช้เห็นว่ากำลังสร้างไฟล์

  setTimeout(
    () => {

      document.getElementById(
        "loading"
      ).scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },
    50
  );


  try{

    const res =
      await fetch(
        "/api/generate",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prompt,

            teacher_name:
              teacherName,

            question_count:
              Number(
                document.getElementById(
                  "count"
                ).value
              ),

            question_types:
              selected,

            difficulty:
              document.getElementById(
                "difficulty"
              ).value

          })

        }
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data.detail ||
        "เกิดข้อผิดพลาด"
      );

    }


    currentData = data;


    // บันทึกข้อมูลทันที
    // เพื่อไม่ให้กลับหน้าแล้วหาย

    localStorage.setItem(
      "teacher_pack_v15",
      JSON.stringify(
        data
      )
    );


    render(
      data,
      true
    );


  }catch(error){

    showError(
      error.message ||
      "เกิดข้อผิดพลาด"
    );

  }finally{

    setLoading(
      false
    );

  }

}


// ============================================================
// LOADING
// ============================================================

let loadingTimer = null;

function setLoading(value){

  const loading =
    document.getElementById(
      "loading"
    );

  const button =
    document.getElementById(
      "generateBtn"
    );


  loading.classList.toggle(
    "hidden",
    !value
  );

  button.disabled =
    value;


  if(value){

    const messages = [

      [
        "กำลังวิเคราะห์หัวข้อ...",
        15
      ],

      [
        "กำลังจัดทำเนื้อหา...",
        35
      ],

      [
        "กำลังสร้างใบงาน...",
        55
      ],

      [
        "กำลังสร้างแบบทดสอบ...",
        72
      ],

      [
        "กำลังตรวจคำตอบ...",
        88
      ],

      [
        "กำลังจัดรูปแบบเอกสาร...",
        96
      ]

    ];


    let index = 0;


    document.getElementById(
      "progressBar"
    ).style.width =
      "5%";


    document.getElementById(
      "loadingText"
    ).textContent =
      messages[0][0];


    loadingTimer =
      setInterval(
        () => {

          if(index <
             messages.length - 1){

            index++;

            document.getElementById(
              "loadingText"
            ).textContent =
              messages[index][0];

            document.getElementById(
              "progressBar"
            ).style.width =
              messages[index][1] +
              "%";

          }

        },
        1000
      );


  }else{

    if(loadingTimer){

      clearInterval(
        loadingTimer
      );

      loadingTimer =
        null;

    }

    document.getElementById(
      "progressBar"
    ).style.width =
      "100%";

  }

}


// ============================================================
// ERROR
// ============================================================

function showError(message){

  const error =
    document.getElementById(
      "error"
    );

  const text =
    document.getElementById(
      "errorText"
    );


  text.textContent =
    message;


  error.classList.remove(
    "hidden"
  );


  error.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


// ============================================================
// RENDER
// ============================================================

function render(
  data,
  scrollToResult = true
){

  document.getElementById(
    "error"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "result"
  ).classList.remove(
    "hidden"
  );


  const s =

    data.worksheet || []

}


// ============================================================
// FORMAT TEXT
// ============================================================

function formatText(value){

  return esc(
    value || ""
  )
  .replace(
    /\n\n/g,
    "<br><br>"
  )
  .replace(
    /\n/g,
    "<br>"
  );

}


// ============================================================
// REMOVE QUESTION NUMBER
// ============================================================

function removeQuestionNumber(
  value
){

  return String(
    value || ""
  ).replace(
    /^\s*(ข้อ\s*)?\d+[\.\):\-]?\s*/i,
    ""
  );

}


// ============================================================
// SAVE PDF
// ============================================================

async function savePDF(){

  if(!currentData){

    showError(
      "ยังไม่มีชุดการสอนให้บันทึก"
    );

    return;

  }


  try{

    const button =
      event?.currentTarget;


    if(button){

      button.disabled =
        true;

      button.textContent =
        "กำลังสร้าง PDF...";
    }


    const response =
      await fetch(
        "/api/pdf",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify(
            currentData
          )

        }
      );


    if(!response.ok){

      let message =
        "สร้าง PDF ไม่สำเร็จ";

      try{

        const data =
          await response.json();

        message =
          data.detail ||
          message;

      }catch(e){}

      throw new Error(
        message
      );

    }


    const blob =
      await response.blob();


    const url =
      window.URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        "a"
      );

    a.href =
      url;

    a.download =
      "ชุดการสอน.pdf";

    document.body.appendChild(
      a
    );

    a.click();

    a.remove();

    window.URL.revokeObjectURL(
      url
    );


    // เก็บข้อมูลไว้เหมือนเดิม
    localStorage.setItem(
      "teacher_pack_v15",
      JSON.stringify(
        currentData
      )
    );


  }catch(error){

    showError(
      error.message
    );

  }finally{

    const buttons =
      document.querySelectorAll(
        ".secondary"
      );

    buttons.forEach(
      button => {

        if(
          button.textContent
            .includes(
              "กำลังสร้าง PDF"
            )
        ){

          button.disabled =
            false;

          button.textContent =
            "📄 บันทึก PDF";

        }

      }
    );

  }

}

  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}
